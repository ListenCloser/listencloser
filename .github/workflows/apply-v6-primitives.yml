name: Apply V6 shared primitives

on:
  push:
    branches:
      - design/v6-reference-led-system
    paths:
      - .github/workflows/apply-v6-primitives.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/v6-reference-led-system
          fetch-depth: 0
      - name: Apply scoped component migration
        run: python3 .github/scripts/apply-v6-primitives.py
      - name: Commit migration and remove helpers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/scripts/apply-v6-primitives.py .github/workflows/apply-v6-primitives.yml
          git add components/workspace/Inspector.tsx components/workspace/TransportBar.tsx
          git diff --cached --check
          git commit -m "design: reuse V6 tabs and source menu primitives"
          git push origin HEAD:design/v6-reference-led-system
