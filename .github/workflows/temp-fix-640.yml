name: Temporary exact patch for issue 640

on:
  push:
    branches:
      - fix/640-alignment-confidence-truthfulness

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/640-alignment-confidence-truthfulness
          fetch-depth: 0
      - name: Replace only fabricated Compare confidence literals
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("backend/domain/capabilities.py")
          text = path.read_text(encoding="utf-8")
          old = "            confidence=0.95,\n"
          new = "            confidence=None,\n"
          count = text.count(old)
          if count != 2:
              raise SystemExit(f"expected exactly 2 fabricated Compare confidence literals, found {count}")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
          git diff --check
          test "$(git diff --numstat -- backend/domain/capabilities.py)" = $'2\t2\tbackend/domain/capabilities.py'
      - name: Commit exact patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add backend/domain/capabilities.py
          git commit -m "fix(compare): omit unmeasured confidence"
          git push origin HEAD:fix/640-alignment-confidence-truthfulness
