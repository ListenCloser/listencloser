name: Format atomic claim test once

on:
  push:
    branches:
      - feat/platform-v3-atomic-job-claim
    paths:
      - '.github/workflows/format-atomic-claim-once.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/platform-v3-atomic-job-claim
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: '0.12.6'
      - name: Format and commit
        run: |
          set -euo pipefail
          uvx --from ruff==0.5.7 ruff format backend/tests/integration/test_atomic_job_claim.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- backend/tests/integration/test_atomic_job_claim.py
          git rm -- .github/workflows/format-atomic-claim-once.yml
          git diff --cached --check
          git commit -m 'style(queue): format atomic claim integration test'
          git push origin HEAD:feat/platform-v3-atomic-job-claim
