name: Score rebuild bootstrap

on:
  push:
    branches: [feat/991-score-rebuild]
    paths:
      - .github/workflows/score-rebuild-bootstrap.yml

permissions:
  contents: write

concurrency:
  group: score-rebuild-bootstrap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/991-score-rebuild
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.12.6'
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: npm ci
      - run: uv sync --project backend --locked
      - name: Apply score-only workflow changes
        run: python scripts/_apply_score_rebuild.py
      - name: Format and lint backend slice
        run: |
          uv run --project backend ruff format \
            backend/domain/api.py \
            backend/tests/test_score_rebuild_workflow.py
          uv run --project backend ruff check \
            backend/domain/api.py \
            backend/tests/test_score_rebuild_workflow.py
      - name: Regenerate OpenAPI contract
        run: npm run api:generate
      - name: Validate score rebuild slice
        run: |
          npm run typecheck
          uv run --project backend python -m pytest \
            backend/tests/test_score_rebuild_workflow.py \
            backend/tests/test_score_engine_routing.py \
            backend/tests/test_transcription_profile_routing.py \
            -m 'not integration' -q
      - name: Commit score rebuild slice
        run: |
          set -euo pipefail
          git add \
            backend/domain/api.py \
            backend/tests/test_score_rebuild_workflow.py \
            openapi/openapi.json \
            lib/api-types.ts
          git config user.name 'listencloser-ci'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'feat(score): rebuild score from performance MIDI'
          git push origin HEAD:feat/991-score-rebuild
