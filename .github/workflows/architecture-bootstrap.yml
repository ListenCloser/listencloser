name: Architecture bootstrap

on:
  pull_request:
    paths:
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'tests/**'
      - 'mocks/**'
      - 'tsconfig.json'
      - 'package.json'
      - 'package-lock.json'
      - '.dependency-cruiser.cjs'
      - '.github/workflows/architecture-bootstrap.yml'

concurrency:
  group: architecture-bootstrap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-import-graph:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - name: Validate frontend dependency architecture
        run: >-
          npx --yes
          --package=dependency-cruiser@18.2.0
          --package=typescript@5.7.3
          depcruise
          --config .dependency-cruiser.cjs
          --validate
          app components lib
      - name: Generate compact Mermaid dependency view
        run: |
          mkdir -p architecture-output
          npx --yes \
            --package=dependency-cruiser@18.2.0 \
            --package=typescript@5.7.3 \
            depcruise \
            --config .dependency-cruiser.cjs \
            --output-type mermaid \
            --include-only '^(app|components|lib)/' \
            --collapse 2 \
            --output-to architecture-output/frontend-dependencies.mmd \
            app components lib
      - name: Upload generated dependency view
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-dependency-graph-${{ github.run_attempt }}
          path: architecture-output/frontend-dependencies.mmd
          if-no-files-found: error
          retention-days: 7
