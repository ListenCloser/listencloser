name: Analysis V3 multitrack exploratory smoke

on:
  push:
    branches:
      - eval/analysis-v3-multitrack-smoke-run
    paths:
      - '.github/workflows/eval-multitrack-smoke.yml'
      - 'backend/evaluation/analysis_v3/multitrack_transcription/exploratory_babyslakh_smoke.py'

permissions:
  contents: read

concurrency:
  group: analysis-v3-multitrack-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: '.python-version'

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.6'
          enable-cache: true
          cache-dependency-glob: 'backend/uv.lock'

      - name: Sync locked hello-ai backend
        run: uv sync --project backend --locked

      - name: Create isolated pinned CPU MR-MT3 environment
        shell: bash
        run: |
          set -euo pipefail
          MT3_VENV="$RUNNER_TEMP/mt3-venv"
          uv venv "$MT3_VENV" --python 3.11
          uv pip install --python "$MT3_VENV/bin/python" \
            --index-url https://download.pytorch.org/whl/cpu \
            'torch==2.6.0' 'torchvision==0.21.0' 'torchaudio==2.6.0'
          uv pip install --python "$MT3_VENV/bin/python" \
            --extra-index-url https://download.pytorch.org/whl/cpu \
            'mt3-infer @ git+https://github.com/openmirlab/mt3-infer.git@2d20ee5bb6ca727968bd23c6100fd2a35154166b'
          "$MT3_VENV/bin/python" - <<'PY'
          import importlib.metadata as metadata
          import torch

          assert metadata.version('mt3-infer') == '0.2.0', metadata.version('mt3-infer')
          assert torch.__version__.startswith('2.6.0'), torch.__version__
          assert '+cpu' in torch.__version__, torch.__version__
          print({'mt3_infer': metadata.version('mt3-infer'), 'torch': torch.__version__})
          PY
          test -x "$MT3_VENV/bin/mt3-infer"

      - name: Verify locked hello-ai environment stayed unchanged
        run: |
          backend/.venv/bin/python - <<'PY'
          import torch
          assert torch.__version__ == '2.6.0+cpu', torch.__version__
          print({'hello_ai_torch': torch.__version__})
          PY

      - name: Run one-track 30-second BabySlakh exploratory smoke
        env:
          PYTHONPATH: backend
          MUSIC_EVAL_CACHE_DIR: ${{ runner.temp }}/music-eval-cache
          MT3_CHECKPOINT_DIR: ${{ runner.temp }}/mt3-checkpoints
          MT3_INFER_BIN: ${{ runner.temp }}/mt3-venv/bin/mt3-infer
          MT3_INFER_VERSION: '0.2.0'
          MT3_TORCH_VERSION: '2.6.0+cpu'
          MULTITRACK_SMOKE_OUTPUT: ${{ github.workspace }}/smoke-output
          HELLO_AI_MEASUREMENT_SHA: 7057c1c247fb2770fee5f5e418479cbf69bd4619
        run: |
          backend/.venv/bin/python backend/evaluation/analysis_v3/multitrack_transcription/exploratory_babyslakh_smoke.py

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: analysis-v3-multitrack-smoke
          path: smoke-output
          if-no-files-found: warn
          retention-days: 7
