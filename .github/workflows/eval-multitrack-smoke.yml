name: Analysis V3 multitrack exploratory smoke

on:
  push:
    branches:
      - eval/analysis-v3-multitrack-smoke-run
    paths:
      - '.github/workflows/eval-multitrack-smoke.yml'
      - 'backend/evaluation/analysis_v3/multitrack_transcription/exploratory_babyslakh_smoke.py'

permissions:
  contents: read

concurrency:
  group: analysis-v3-multitrack-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: '.python-version'

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.6'
          enable-cache: true
          cache-dependency-glob: 'backend/uv.lock'

      - name: Sync locked hello-ai backend
        run: uv sync --project backend --locked

      - name: Install pinned research-only MR-MT3 runner
        run: |
          uv pip install --python backend/.venv/bin/python 'mt3-infer[torch]==0.2.0'
          backend/.venv/bin/python -c "import importlib.metadata as m; assert m.version('mt3-infer') == '0.2.0'"

      - name: Run one-track 30-second BabySlakh exploratory smoke
        env:
          PYTHONPATH: backend
          MUSIC_EVAL_CACHE_DIR: ${{ runner.temp }}/music-eval-cache
          MT3_CHECKPOINT_DIR: ${{ runner.temp }}/mt3-checkpoints
          MULTITRACK_SMOKE_OUTPUT: ${{ github.workspace }}/smoke-output
          HELLO_AI_MEASUREMENT_SHA: 7057c1c247fb2770fee5f5e418479cbf69bd4619
        run: |
          backend/.venv/bin/python backend/evaluation/analysis_v3/multitrack_transcription/exploratory_babyslakh_smoke.py

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: analysis-v3-multitrack-smoke
          path: smoke-output
          if-no-files-found: warn
          retention-days: 7
