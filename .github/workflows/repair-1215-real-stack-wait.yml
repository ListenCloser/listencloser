name: Repair PR 1215 real-stack attach wait

on:
  push:
    branches:
      - integrate/1082-score-source-fresh-main
    paths:
      - .github/workflows/repair-1215-real-stack-wait.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: integrate/1082-score-source-fresh-main
          fetch-depth: 1

      - name: Wait on the product attach lifecycle and self-delete
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          python - <<'PY'
          from pathlib import Path

          path = Path('tests/e2e/real-stack-golden.spec.ts')
          text = path.read_text()
          old = '''  const chooser = await chooserPromise;
  await chooser.setFiles(SOURCE_SCORE);
}'''
          new = '''  const chooser = await chooserPromise;
  await chooser.setFiles(SOURCE_SCORE);

  // File selection only starts the async attach. Wait for the product's
  // existing attachment lifecycle to finish before asserting the selected
  // source elsewhere in the golden path.
  const attachingScore = page.getByRole("status").filter({ hasText: "Attaching score" });
  await expect(attachingScore).toBeVisible({ timeout: 10_000 });
  await expect(attachingScore).toBeHidden({ timeout: 60_000 });
}'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one attach helper target, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY

          rm .github/workflows/repair-1215-real-stack-wait.yml

          mapfile -t changed < <(git status --short | awk '{print $2}' | sort)
          expected=$(printf '%s\n' '.github/workflows/repair-1215-real-stack-wait.yml' 'tests/e2e/real-stack-golden.spec.ts' | sort)
          actual=$(printf '%s\n' "${changed[@]}")
          if [[ "$actual" != "$expected" ]]; then
            echo "Unexpected repair diff"
            printf '  %s\n' "${changed[@]}"
            exit 1
          fi

          git diff --check
          git add tests/e2e/real-stack-golden.spec.ts .github/workflows/repair-1215-real-stack-wait.yml
          git commit -m "test(score): wait for MusicXML attach completion"
          git push origin HEAD:integrate/1082-score-source-fresh-main
