name: Temporary sync PR 1219 into PR 1217

on:
  push:
    branches:
      - feat/1176-layers-current-main

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/1176-layers-current-main
          fetch-depth: 0
      - name: Merge current Symbolic Detail parent with bounded golden-path resolution
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin agent/1178-symbolic-detail
          if git merge --no-edit origin/agent/1178-symbolic-detail; then
            :
          else
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            if [[ ${#conflicts[@]} -ne 1 || "${conflicts[0]}" != "tests/e2e/real-stack-golden.spec.ts" ]]; then
              printf 'Unexpected conflicts:\n%s\n' "${conflicts[*]}" >&2
              exit 1
            fi
            git checkout --ours tests/e2e/real-stack-golden.spec.ts
            python - <<'PY'
          from pathlib import Path
          path = Path("tests/e2e/real-stack-golden.spec.ts")
          text = path.read_text()
          old = '''    const addAnalysis = page.getByRole("region", { name: "Add analysis" });
              await expect(addAnalysis.getByRole("button", { name: "+ Add analysis", exact: true })).toBeVisible();
              await addAnalysis.getByRole("button", { name: "+ Add analysis", exact: true }).click();'''.replace("              await", "    await")
          new = '''    const addAnalysis = page.getByRole("region", { name: "Add analysis" });
              const sharedAddAnalysisButton = addAnalysis.getByRole("button", { name: "+ Add analysis", exact: true }).first();
              await expect(sharedAddAnalysisButton).toBeVisible();
              await sharedAddAnalysisButton.click();'''.replace("              const", "    const").replace("              await", "    await")
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit("expected Structure Map Add analysis block not found")
          path.write_text(text)
          PY
            git add tests/e2e/real-stack-golden.spec.ts
            git diff --check --cached
            git commit --no-edit
          fi
          git push origin HEAD:feat/1176-layers-current-main
