name: Temporary sync PR 1219 into PR 1217

on:
  push:
    branches:
      - feat/1176-layers-current-main

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/1176-layers-current-main
          fetch-depth: 0
      - name: Merge current Symbolic Detail parent
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin agent/1178-symbolic-detail
          git merge --no-edit origin/agent/1178-symbolic-detail
          git push origin HEAD:feat/1176-layers-current-main
