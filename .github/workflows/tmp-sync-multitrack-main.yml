name: Temporary final main sync for multitrack eval

on:
  push:
    branches:
      - eval/analysis-v3-multitrack-transcription
    paths:
      - '.github/workflows/tmp-sync-multitrack-main.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: eval/analysis-v3-multitrack-transcription
          fetch-depth: 0
      - name: Merge current main without rewriting research history
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git merge --no-edit origin/main
          git push origin HEAD:eval/analysis-v3-multitrack-transcription
