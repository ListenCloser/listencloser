name: Agent 848 format

on:
  push:
    branches:
      - feat/848-experimental-measured-changes

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.12.9'
      - name: Apply locked Ruff formatter
        run: uvx ruff==0.5.7 format backend/domain/measured_changes.py backend/tests/test_measured_changes.py
      - name: Commit formatter output
        run: |
          if git diff --quiet -- backend/domain/measured_changes.py backend/tests/test_measured_changes.py; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/domain/measured_changes.py backend/tests/test_measured_changes.py
          git commit -m 'style(change): apply canonical Ruff formatting'
          git push
