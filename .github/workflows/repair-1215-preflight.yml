name: Repair 1215 preflight

on:
  push:
    branches:
      - integrate/1082-score-source-fresh-main

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove stale golden-path snapshot
        shell: bash
        run: |
          set -euo pipefail
          target='tests/e2e/real-stack-golden.spec.ts'
          needle='    const positionBeforeSourceScore = await transportPosition(page);'
          test "$(grep -Fxc "$needle" "$target")" -eq 1
          sed -i '\|const positionBeforeSourceScore = await transportPosition(page);|d' "$target"
          rm .github/workflows/repair-1215-preflight.yml
          test "$(git diff --name-only | sort)" = $'.github/workflows/repair-1215-preflight.yml\ntests/e2e/real-stack-golden.spec.ts'
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$target" .github/workflows/repair-1215-preflight.yml
          git commit -m 'test(score): remove stale source-score snapshot'
          git push origin "HEAD:${GITHUB_REF_NAME}"
