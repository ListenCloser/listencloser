name: Temporary reintegrate PR 1221

on:
  push:
    branches:
      - agent/1179-production-spatial-lens

permissions:
  contents: write

jobs:
  reintegrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - name: Reintegrate production/spatial lens on the pitch-contour seam
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          target='origin/agent/1087-pitch-contour-reintegration'
          git fetch origin agent/1087-pitch-contour-reintegration
          if git merge-base --is-ancestor "$target" HEAD; then
            echo 'Target already integrated.'
            exit 0
          fi

          set +e
          git merge --no-edit "$target"
          merge_rc=$?
          set -e
          if [ "$merge_rc" -ne 0 ]; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            printf 'Conflicts: %s\n' "${conflicts[*]}"
            allowed=(
              backend/config/capabilities.json
              backend/domain/api/workflows_jobs.py
              backend/worker.py
              docs/generated/frontend-dependencies.md
            )
            for conflict in "${conflicts[@]}"; do
              ok=false
              for path in "${allowed[@]}"; do
                if [ "$conflict" = "$path" ]; then ok=true; break; fi
              done
              if [ "$ok" != true ]; then
                echo "Unexpected conflict: $conflict" >&2
                exit 1
              fi
            done
            for path in "${allowed[@]}"; do
              if printf '%s\n' "${conflicts[@]}" | grep -Fxq "$path"; then
                git checkout --theirs -- "$path"
              fi
            done

            python3 - <<'PY'
          from pathlib import Path
          import re

          capabilities = Path('backend/config/capabilities.json')
          text = capabilities.read_text()
          if '"production_spatial"' not in text:
              suffix = '\n    }\n  }\n}\n'
              assert text.endswith(suffix)
              block = '''\n    },\n    "production_spatial": {\n      "status": "experimental",\n      "input": "audio",\n      "engine": "pyloudnorm_librosa_mid_side_v1",\n      "exposure": {"inspector": true, "annotations": false, "ask": false},\n      "evaluation": {\n        "dataset": "synthetic stereo/mono fixtures",\n        "metric": "experimental_product_integration",\n        "details": "#1179: BS.1770 loudness, exact two-channel mid/side energy share, spectral centroid, and onset-strength changes are exposed only as method-qualified within-recording adjacent-window relations."\n      },\n      "validated_domain": "within-recording adjacent fixed-window measurement comparison",\n      "notes": "Experimental opt-in Inspector lens only. Literal measurements and relations; no semantic timbre, mix-quality, width-quality, section, cause, importance, or cross-recording claims. Mid/side relation is unavailable unless the source is exactly stereo."\n  }\n}\n'''
              text = text[:-len(suffix)] + block
              capabilities.write_text(text)

          workflows = Path('backend/domain/api/workflows_jobs.py')
          text = workflows.read_text()
          pattern = re.compile(r'_PUBLIC_CREATE_WORKFLOW_ACTIONS = frozenset\(\s*\{([^}]*)\}\s*\)', re.S)
          match = pattern.search(text)
          assert match
          actions = set(re.findall(r'"([^"]+)"', match.group(1)))
          actions.add('production_spatial')
          rendered = '_PUBLIC_CREATE_WORKFLOW_ACTIONS = frozenset(\n    {' + ', '.join(f'"{item}"' for item in sorted(actions)) + '}\n)'
          text = text[:match.start()] + rendered + text[match.end():]
          workflows.write_text(text)

          worker = Path('backend/worker.py')
          text = worker.read_text()
          import_line = 'from domain.production_spatial_capability import register_production_spatial_capability\n'
          if import_line not in text:
              anchor = 'from domain.pgmq_job_worker import PgmqJobWorker\n'
              assert anchor in text
              text = text.replace(anchor, anchor + import_line)
          call = '    register_production_spatial_capability(worker)\n'
          if call not in text:
              anchor = '    register_structure_map_capability(worker)\n'
              assert anchor in text
              text = text.replace(anchor, anchor + call)
          worker.write_text(text)
          PY

            python3 -m pip install --disable-pip-version-check -q 'ruff==0.15.2'
            ruff format backend/domain/api/workflows_jobs.py backend/worker.py

            npm ci
            out="$(mktemp -d)"
            npx --yes --package=dependency-cruiser@18.2.0 --package=typescript@5.7.3 depcruise \
              --config .dependency-cruiser.cjs --output-type mermaid \
              --include-only '^(app|components|lib)/' --collapse 2 \
              --output-to "$out/frontend-dependencies.mmd" app components lib
            {
              cat <<'EOF'
          # Frontend dependency graph

          > Generated by dependency-cruiser 18.2.0 with TypeScript 5.7.3 from `.dependency-cruiser.cjs`. Do not hand-edit this graph; regenerate it through the architecture check when frontend imports change.

          This is an orientation view of `app/`, `components/`, and `lib/`. Deeper folders are collapsed to keep the graph reviewable. The architecture rules in `.dependency-cruiser.cjs`, not the picture alone, are the enforceable contract.

          ```mermaid
          EOF
              cat "$out/frontend-dependencies.mmd"
              echo '```'
            } > docs/generated/frontend-dependencies.md
            rm -rf "$out"

            git add backend/config/capabilities.json backend/domain/api/workflows_jobs.py backend/worker.py docs/generated/frontend-dependencies.md
            if git diff --name-only --diff-filter=U | grep -q .; then
              echo 'Unresolved merge conflicts remain.' >&2
              git diff --name-only --diff-filter=U >&2
              exit 1
            fi
            git commit --no-edit
          fi
          git push origin HEAD:${GITHUB_REF_NAME}
