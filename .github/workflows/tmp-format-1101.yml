name: Temporary Ruff format inspection 1101

on:
  push:
    branches:
      - issue-1083-score-performance-alignment

permissions:
  contents: read

jobs:
  format-diff:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.12.6"
      - name: Show canonical Ruff 0.5.7 format diff
        run: >-
          uvx --from ruff==0.5.7 ruff format --diff
          backend/domain/score_performance_alignment.py
          backend/tests/test_score_performance_alignment.py
