name: Temporary #639 ShellCheck characterization

on:
  push:
    branches:
      - research/639-shellcheck-current
    paths:
      - .github/workflows/tmp-639-shellcheck-current.yml

permissions:
  contents: read

jobs:
  characterize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.12.6'
      - name: Characterize tracked shell scripts
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t scripts < <(git ls-files '*.sh')
          printf 'tracked_shell_scripts=%s\n' "${#scripts[@]}"
          printf '%s\n' "${scripts[@]}"
          uvx --from shellcheck-py==0.11.0.1 shellcheck --version
          set +e
          uvx --from shellcheck-py==0.11.0.1 shellcheck "${scripts[@]}"
          status=$?
          set -e
          printf 'shellcheck_exit=%s\n' "$status"
          exit "$status"
