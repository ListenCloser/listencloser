name: Temporary sync PR 1264 with main

on:
  push:
    branches:
      - feat/1193-piano-roll-note-correction

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Merge current main and resolve only known shared seams
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          set +e
          git merge --no-edit origin/main
          merge_status=$?
          set -e
          if [ "$merge_status" -ne 0 ]; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            printf 'Conflicts:\n%s\n' "${conflicts[*]}"
            for path in "${conflicts[@]}"; do
              case "$path" in
                components/workspace/representations/registry.tsx|docs/generated/frontend-dependencies.md) ;;
                *) echo "Unexpected conflict: $path" >&2; exit 1 ;;
              esac
            done
            git checkout --ours components/workspace/representations/registry.tsx
            git checkout --ours docs/generated/frontend-dependencies.md
            git add components/workspace/representations/registry.tsx docs/generated/frontend-dependencies.md
          fi
          npm ci
          tmpdir="$(mktemp -d)"
          npx --yes --package=dependency-cruiser@18.2.0 --package=typescript@5.7.3 depcruise \
            --config .dependency-cruiser.cjs \
            --output-type mermaid \
            --include-only '^(app|components|lib)/' \
            --collapse 2 \
            --output-to "$tmpdir/frontend-dependencies.mmd" \
            app components lib
          {
            cat <<'EOF'
          # Frontend dependency graph

          > Generated by dependency-cruiser 18.2.0 with TypeScript 5.7.3 from `.dependency-cruiser.cjs`. Do not hand-edit this graph; regenerate it through the architecture check when frontend imports change.

          This is an orientation view of `app/`, `components/`, and `lib/`. Deeper folders are collapsed to keep the graph reviewable. The architecture rules in `.dependency-cruiser.cjs`, not the picture alone, are the enforceable contract.

          ```mermaid
          EOF
            cat "$tmpdir/frontend-dependencies.mmd"
            echo '```'
          } > docs/generated/frontend-dependencies.md
          rm -rf "$tmpdir"
          git add docs/generated/frontend-dependencies.md
          if git diff --cached --quiet && ! git rev-parse -q --verify MERGE_HEAD >/dev/null; then
            echo 'Already synchronized.'
            exit 0
          fi
          if git rev-parse -q --verify MERGE_HEAD >/dev/null; then
            git commit --no-edit
          else
            git commit -m 'chore: refresh correction graph after main sync'
          fi
          git push origin HEAD:feat/1193-piano-roll-note-correction
