name: Temporary probe MidiBERT official assets

on:
  push:
    branches:
      - feat/1233-midibert-default

permissions:
  contents: read

jobs:
  probe:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Download official checkpoint folder and print identities
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check gdown==5.2.0
          mkdir -p /tmp/midibert-checkpoints
          gdown --folder 'https://drive.google.com/drive/folders/1ceIfC1UugZQHPgpEEMkdAF0VhZ1EeLl3?usp=sharing' -O /tmp/midibert-checkpoints
          find /tmp/midibert-checkpoints -type f -printf '%P\t%s bytes\n' | sort
          find /tmp/midibert-checkpoints -type f -exec sha256sum {} \; | sort -k2
