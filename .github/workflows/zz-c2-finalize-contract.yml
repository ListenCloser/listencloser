name: Temporary C2 durable contract finalization

on:
  push:
    branches:
      - feat/1254-clamp3-text-passage

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: package.json
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version-file: .python-version
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: 0.12.9
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install frontend dependencies
        run: npm ci
      - name: Sync locked backend environment
        run: uv sync --project backend --locked
      - name: Register experimental C2 Find capability
        shell: python
        run: |
          from pathlib import Path

          path = Path("backend/config/capabilities.json")
          text = path.read_text()
          if '"text_passage_find"' not in text:
              needle = '    "supplied_text_alignment": {'
              entry = '''    "text_passage_find": {
                "status": "experimental",
                "input": "audio+midi_performance",
                "engine": "clamp3_c2",
                "exposure": {"inspector": false, "annotations": false, "ask": false},
                "validated_domain": "within-Work experimental text-to-passage retrieval over exact directly-parented performance MIDI",
                "notes": "#1254 backend/runtime slice. Candidates are source-time proposals ranked by CLaMP3 C2 text/symbolic cosine similarity, not factual detections or confidence. Exact source audio Version, direct-parent performance-MIDI Version, model/checkpoint/runtime provenance, and query are retained in the private report. No vector database or cross-Work index. UI reachability remains gated on the shared discovery seam owned by #1259."
              },
          '''
              if needle not in text:
                  raise SystemExit("capability insertion point not found")
              path.write_text(text.replace(needle, entry + needle, 1))
      - name: Canonically format C2 slice
        run: |
          uv run --project backend --locked ruff format \
            backend/domain/api/text_passage_find.py \
            backend/domain/text_passage_find.py \
            backend/domain/text_passage_find_capability.py \
            backend/engines/retrieval/clamp3_c2.py \
            backend/engines/retrieval/clamp3_c2_runtime.py \
            backend/tests/test_clamp3_c2_retriever.py \
            backend/tests/test_text_passage_find.py \
            backend/tests/test_text_passage_find_capability.py \
            backend/tests/test_text_passage_find_workflow.py \
            backend/worker.py \
            backend/domain/api/router.py
          uv run --project backend --locked ruff check --fix \
            backend/domain/api/text_passage_find.py \
            backend/domain/text_passage_find.py \
            backend/domain/text_passage_find_capability.py \
            backend/engines/retrieval/clamp3_c2.py \
            backend/engines/retrieval/clamp3_c2_runtime.py \
            backend/tests/test_clamp3_c2_retriever.py \
            backend/tests/test_text_passage_find.py \
            backend/tests/test_text_passage_find_capability.py \
            backend/tests/test_text_passage_find_workflow.py \
            backend/worker.py \
            backend/domain/api/router.py
          uv run --project backend --locked ruff format \
            backend/domain/api/text_passage_find.py \
            backend/domain/text_passage_find.py \
            backend/domain/text_passage_find_capability.py \
            backend/engines/retrieval/clamp3_c2.py \
            backend/engines/retrieval/clamp3_c2_runtime.py \
            backend/tests/test_clamp3_c2_retriever.py \
            backend/tests/test_text_passage_find.py \
            backend/tests/test_text_passage_find_capability.py \
            backend/tests/test_text_passage_find_workflow.py \
            backend/worker.py \
            backend/domain/api/router.py
      - name: Generate canonical API artifacts
        run: npm run api:generate
      - name: Commit canonical outputs
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No canonical changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/config/capabilities.json \
            backend/domain/api/text_passage_find.py \
            backend/domain/text_passage_find.py \
            backend/domain/text_passage_find_capability.py \
            backend/engines/retrieval/clamp3_c2.py \
            backend/engines/retrieval/clamp3_c2_runtime.py \
            backend/tests/test_clamp3_c2_retriever.py \
            backend/tests/test_text_passage_find.py \
            backend/tests/test_text_passage_find_capability.py \
            backend/tests/test_text_passage_find_workflow.py \
            backend/worker.py backend/domain/api/router.py \
            openapi/openapi.json lib/api-types.ts
          git commit -m "chore(find): canonicalize durable C2 contracts"
          git push origin HEAD:${GITHUB_REF_NAME}
