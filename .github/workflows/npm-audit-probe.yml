name: npm audit probe

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/npm-audit-probe.yml'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_MOCK_ENABLED: "true"
      NEXT_PUBLIC_SUPABASE_URL: "https://cijhpddqvvzyzfzmkdnn.supabase.co"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "e2e-anon-key"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate and validate supported Next 16 remediation
        run: |
          set -euo pipefail
          npm install --save-exact next@16.3.3
          npm install --save-dev --save-exact eslint-config-next@16.3.3
          npm audit fix
          npm pkg set scripts.build='next build --webpack'
          npm audit
          npm run typecheck
          npm run lint
          npm test
          npm run build
      - name: Commit validated package metadata to diagnostic branch
        run: |
          set -euo pipefail
          if git diff --quiet -- package.json package-lock.json; then
            echo 'No package metadata changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- package.json package-lock.json
          git commit -m 'chore(security): generate validated Next 16 lockfile'
          git push origin HEAD:chore/security-npm-audit-probe
