name: npm audit probe

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/npm-audit-probe.yml'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Test safe remediation
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --save-exact next@15.5.24
          npm install --package-lock-only --ignore-scripts --save-dev --save-exact eslint-config-next@15.5.24
          npm audit fix --package-lock-only --ignore-scripts || true
          echo '===== proposed package diff ====='
          git diff -- package.json package-lock.json
          echo '===== post-fix audit ====='
          npm audit --json > /tmp/npm-audit.json || true
          node - <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('/tmp/npm-audit.json', 'utf8'));
          console.log(JSON.stringify({metadata: report.metadata, vulnerabilities: report.vulnerabilities}, null, 2));
          NODE
