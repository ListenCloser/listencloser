name: npm audit probe

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/npm-audit-probe.yml'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_MOCK_ENABLED: "true"
      NEXT_PUBLIC_SUPABASE_URL: "https://cijhpddqvvzyzfzmkdnn.supabase.co"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "e2e-anon-key"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Test supported Next 16 remediation
        run: |
          set -euo pipefail
          npm install --save-exact next@16.3.3
          npm install --save-dev --save-exact eslint-config-next@16.3.3
          npm audit fix
          echo '===== proposed package diff ====='
          git diff -- package.json package-lock.json
          echo '===== audit ====='
          npm audit
          npm run typecheck
          npm run lint
          npm test
          npm run build
