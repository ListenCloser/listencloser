name: Python autofix

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'backend/**/*.py'

# This workflow is intentionally advisory/non-required. It repairs deterministic
# same-repository PR style drift before the protected CI/build gate has to fail.
# Fork PRs remain read-only and are skipped.
permissions:
  contents: write

concurrency:
  group: python-autofix-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  autofix:
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out PR head branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.12.6'
          enable-cache: true

      - name: Apply safe Ruff fixes and formatting
        shell: bash
        run: |
          set -euo pipefail
          # Keep the formatter version aligned with backend/uv.lock without
          # paying for the full backend environment. Do not use --unsafe-fixes.
          uvx --from 'ruff==0.5.7' ruff check backend/ --fix || true
          uvx --from 'ruff==0.5.7' ruff format backend/

      - name: Push deterministic fixes when needed
        shell: bash
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if git diff --quiet -- backend; then
            echo 'No deterministic Python fixes needed.'
            exit 0
          fi

          changed="$(git diff --name-only)"
          if printf '%s\n' "$changed" | grep -Ev '^backend/.*\.py$' >/dev/null; then
            echo 'Autofix changed a path outside backend Python; refusing to push.' >&2
            printf '%s\n' "$changed" >&2
            exit 1
          fi

          # Never overwrite an agent push that raced this job. A subsequent
          # synchronize event will rerun autofix against the newer head.
          git fetch origin "$HEAD_REF"
          remote_sha="$(git rev-parse FETCH_HEAD)"
          if [ "$remote_sha" != "$EVENT_HEAD_SHA" ]; then
            echo "PR head moved from $EVENT_HEAD_SHA to $remote_sha; leaving newer agent work untouched."
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- backend
          git commit -m 'style: auto-fix Python lint and formatting'
          git push origin "HEAD:$HEAD_REF"
