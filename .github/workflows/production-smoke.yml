name: Production Smoke

on:
  push:
    branches: [main]

concurrency:
  group: production-smoke
  cancel-in-progress: true

permissions:
  contents: read
  statuses: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Classify production components changed by this push
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          before="${{ github.event.before }}"
          changed="$(mktemp)"
          trap 'rm -f "$changed"' EXIT

          if [[ "$before" =~ ^0+$ ]]; then
            git show --pretty='' --name-only "$GITHUB_SHA" >"$changed"
          else
            git diff --name-only "$before" "$GITHUB_SHA" >"$changed"
          fi

          echo "Changed paths:"
          sed 's/^/  - /' "$changed"

          scope="$(python3 scripts/check_merge_evidence.py --production-scope <"$changed")"
          frontend=false
          backend=false
          if grep -qx 'frontend' <<<"$scope"; then
            frontend=true
          fi
          if grep -qx 'backend' <<<"$scope"; then
            backend=true
          fi

          echo "frontend=$frontend" >>"$GITHUB_OUTPUT"
          echo "backend=$backend" >>"$GITHUB_OUTPUT"
          echo "Production scope: frontend=$frontend backend=$backend"

      - name: Wait for Vercel to deploy this exact main SHA
        if: steps.scope.outputs.frontend == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/status"
          for attempt in $(seq 1 60); do
            payload="$(curl -fsSL \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$api")"
            state="$(STATUS_PAYLOAD="$payload" python3 - <<'PY'
          import json
          import os

          payload = json.loads(os.environ["STATUS_PAYLOAD"])
          statuses = [
              item for item in payload.get("statuses", [])
              if item.get("context") == "Vercel"
          ]
          print(statuses[0].get("state", "missing") if statuses else "missing")
          PY
            )"
            echo "Vercel status for ${GITHUB_SHA}: ${state}"
            case "$state" in
              success) break ;;
              error|failure) exit 1 ;;
            esac
            if [ "$attempt" -eq 60 ]; then
              echo "Vercel did not report success for exact main SHA within 10 minutes" >&2
              exit 1
            fi
            sleep 10
          done

      - name: Wait for exact backend release when backend deploys
        if: steps.scope.outputs.backend == 'true'
        env:
          PROD_URL: https://hello-ai-wheat.vercel.app
          EXPECTED_RELEASE: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          base = os.environ["PROD_URL"].rstrip("/")
          expected = os.environ["EXPECTED_RELEASE"]
          last = None

          for attempt in range(180):
              try:
                  with urllib.request.urlopen(base + "/api/health/live", timeout=15) as response:
                      payload = json.loads(response.read().decode("utf-8"))
                  last = payload
                  if payload.get("status") == "alive" and payload.get("release") == expected:
                      print(f"backend release reached exact main SHA: {expected}")
                      break
              except (OSError, ValueError, urllib.error.URLError) as exc:
                  last = repr(exc)

              if attempt % 6 == 0:
                  print(f"waiting for backend release {expected}; observed={last}", flush=True)
              time.sleep(10)
          else:
              raise RuntimeError(
                  f"backend did not reach exact release {expected} within 30 minutes; "
                  f"last observed={last}"
              )
          PY

      - name: Verify production alias and backend dependencies without mutations
        env:
          PROD_URL: https://hello-ai-wheat.vercel.app
          EXPECTED_RELEASE: ${{ github.sha }}
          REQUIRE_EXACT_BACKEND_RELEASE: ${{ steps.scope.outputs.backend }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          base = os.environ["PROD_URL"].rstrip("/")
          require_exact = os.environ.get("REQUIRE_EXACT_BACKEND_RELEASE") == "true"
          expected_release = os.environ["EXPECTED_RELEASE"] if require_exact else None

          def fetch(path: str):
              last_error = None
              for _ in range(30):
                  try:
                      with urllib.request.urlopen(base + path, timeout=15) as response:
                          if response.status != 200:
                              raise RuntimeError(f"{path}: HTTP {response.status}")
                          return response.read().decode("utf-8")
                  except (urllib.error.URLError, RuntimeError) as exc:
                      last_error = exc
                      time.sleep(2)
              raise RuntimeError(f"{path} did not become healthy: {last_error}")

          root = fetch("/")
          if "<html" not in root.lower():
              raise RuntimeError("production alias did not return the frontend document")

          live = json.loads(fetch("/api/health/live"))
          ready = json.loads(fetch("/api/health/ready"))
          queue = json.loads(fetch("/api/health/queue"))

          if live.get("status") != "alive" or not live.get("release"):
              raise RuntimeError(f"unexpected live health: {live}")
          if expected_release and live.get("release") != expected_release:
              raise RuntimeError(
                  f"backend release drift: expected {expected_release}, "
                  f"observed {live.get('release')}"
              )
          if ready.get("status") != "ready":
              raise RuntimeError(f"unexpected readiness: {ready}")
          for dependency in ("supabase", "database", "storage"):
              if ready.get(dependency) is not True:
                  raise RuntimeError(f"readiness missing {dependency}: {ready}")
          if queue.get("status") != "ready":
              raise RuntimeError(f"queue is not ready: {queue}")

          print(
              "production smoke passed:",
              {
                  "backend_release": live["release"],
                  "workers": queue.get("workers"),
                  "expected_release": expected_release,
              },
          )
          PY
