name: Temporary sync main PR 1221

on:
  push:
    branches:
      - agent/1179-production-spatial-lens

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Merge current main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          if git merge-base --is-ancestor origin/main HEAD; then
            echo 'Current main already integrated.'
            exit 0
          fi
          set +e
          git merge --no-edit origin/main
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            expected=(
              backend/domain/api/workflows_jobs.py
              backend/tests/test_public_workflow_dispatch.py
              backend/worker.py
              docs/generated/frontend-dependencies.md
            )
            if [ "${#conflicts[@]}" -ne "${#expected[@]}" ]; then
              printf 'Unexpected conflict set:\n%s\n' "${conflicts[*]}" >&2
              exit 1
            fi
            for path in "${expected[@]}"; do
              if ! printf '%s\n' "${conflicts[@]}" | grep -Fxq "$path"; then
                echo "Expected conflict missing: $path" >&2
                exit 1
              fi
            done
            # This branch already carried the final #1216 shared pitch-contour
            # seam before it entered the merge queue. For these overlapping
            # registration/generated files, ours is current-main behavior plus
            # the bounded production_spatial addition.
            git checkout --ours -- "${expected[@]}"
            git add "${expected[@]}"
            if git diff --name-only --diff-filter=U | grep -q .; then
              echo 'Unresolved conflicts remain.' >&2
              git diff --name-only --diff-filter=U >&2
              exit 1
            fi
            git commit --no-edit
          fi
          git push origin HEAD:${GITHUB_REF_NAME}
