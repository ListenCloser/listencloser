name: Run V5 cleanup helper

on:
  push:
    branches:
      - design/v5-visual-language-cleanup
    paths:
      - .github/workflows/run-v5-cleanup.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/v5-visual-language-cleanup
          fetch-depth: 0
      - name: Execute patch payload
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          source = Path('.github/workflows/apply-v5-cleanup.yml').read_text()
          match = re.search(r"python - <<'PY'\n(.*?)\n          PY\n", source, re.S)
          if not match:
              raise SystemExit('patch payload not found')
          payload = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in match.group(1).splitlines()
          )
          payload = payload.replace(
              "overview_pattern.subn(overview, text, count=1)",
              "overview_pattern.subn(lambda _match: overview, text, count=1)",
          )
          payload = payload.replace(
              "counts_pattern.subn(counts, text, count=1)",
              "counts_pattern.subn(lambda _match: counts, text, count=1)",
          )
          payload = payload.replace(
              'raise SystemExit("failed to find old Inspector overview JSX")',
              'pass',
          )
          exec(compile(payload, 'v5-cleanup', 'exec'))

          inspector = Path('components/workspace/Inspector.tsx')
          text = inspector.read_text()
          pattern = re.compile(
              r'      <section className="inspector-section inspector-overview-section">.*?'
              r'      </section>\n\n(?=      <FindingsSection)',
              re.S,
          )
          replacement = '      <AnalysisOverview insights={activeInsights} findings={findings} selection={workspace.selection} />\n\n'
          text, count = pattern.subn(lambda _match: replacement, text, count=1)
          if count != 1:
              raise SystemExit('failed to patch Inspector overview JSX')
          inspector.write_text(text)
          PY
      - name: Commit V5 cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- app/icon.svg app/layout.tsx app/visual-language-v5.css DESIGN.md components/workspace/LibraryPanel.tsx components/workspace/AskPanel.tsx components/workspace/TransportBar.tsx components/workspace/Inspector.tsx components/SheetMusic.tsx lib/representations.tsx
          git rm .github/workflows/apply-v5-cleanup.yml .github/workflows/run-v5-cleanup.yml
          git commit -m "design: tighten V5 visual language and music interactions"
          git push origin HEAD:design/v5-visual-language-cleanup
