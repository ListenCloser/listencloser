name: Temporary Ruff formatter 1049

on:
  push:
    branches:
      - eval/1026-melody-baseline-contract

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.12.6"
      - name: Apply canonical formatting and self-remove
        run: |
          uvx --from ruff==0.5.7 ruff format backend/evaluation/melody.py
          printf 'formatted by Ruff 0.5.7\n' > .tmp-format-1049-trigger
          rm .github/workflows/tmp-format-1049.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add backend/evaluation/melody.py .tmp-format-1049-trigger .github/workflows/tmp-format-1049.yml
          git commit -m "style: apply canonical Ruff formatting"
          git push origin HEAD:eval/1026-melody-baseline-contract
