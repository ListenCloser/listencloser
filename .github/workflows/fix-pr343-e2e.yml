name: Repair PR 343 E2E contracts

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.number == 343 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/product-ui-polish-v4

      - name: Align browser contracts with the redesigned workspace
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path("tests/e2e")
          specs = list(root.glob("*.spec.ts"))

          for path in specs:
              text = path.read_text()
              text = text.replace(
                  'getByRole("button", { name: "Test Work" })',
                  'getByRole("button", { name: /^Test Work\\b/ })',
              )
              text = text.replace('name: /Listening to:/', 'name: /Playback source:/')
              text = text.replace('name: /Listening to/', 'name: /Playback source:/')
              text = text.replace('`Listening to: ${label}`', '`Playback source: ${label}`')
              text = text.replace('"Listening to: Score"', '"Playback source: Score"')
              text = text.replace('"Listening to: Original"', '"Playback source: Original"')
              text = text.replace('name: "Compare playback"', 'name: "Compare playback sources"')
              path.write_text(text)

          # Signed-out route follows the current product contract.
          path = root / "r1-canonical-route.spec.ts"
          text = path.read_text()
          text = text.replace(
              'page.getByText("Music Lab")',
              'page.getByRole("heading", { name: "Listen closer." })',
          )
          text = text.replace('"Sign in with Google"', '"Continue with Google"')
          path.write_text(text)

          # Pipeline tests use semantic transport controls, not removed explanatory copy.
          path = root / "real-pipeline-workspace.spec.ts"
          text = path.read_text()
          text = text.replace('"Sign in with Google"', '"Continue with Google"')
          text = text.replace('  await expect(page.getByText(/You can close this page/)).toBeVisible();\n', '')
          text = text.replace(
              '  // A notation-derived render exists, so the score rendition is a selectable source.\n',
              '  // A notation-derived render exists, so Score is a selectable playback source.\n',
          )
          text = '\n'.join(
              line for line in text.splitlines()
              if 'Select Score in the transport to hear this notation' not in line
          ) + '\n'
          text = text.replace(
              '  await expect(page.getByText("Playing the score rendition in notation time. Click a measure to jump or select it.")).toBeVisible();\n',
              '  await expect(page.getByRole("button", { name: "Playback source: Score", exact: true })).toBeVisible();\n',
          )
          for side, label in (("A", "Original"), ("B", "Transcription")):
              text = text.replace(
                  f'page.getByRole("button", {{ name: "{side}: {label}", exact: true }})',
                  f'page.getByRole("button", {{ name: "{side} compare source", exact: true }})',
              )
          text = text.replace(
              '  await expect(page.getByRole("button", { name: "A compare source", exact: true })).toBeVisible();\n',
              '  await expect(page.getByRole("button", { name: "A compare source", exact: true })).toContainText("Original");\n',
          )
          text = text.replace(
              '  await expect(page.getByRole("button", { name: "B compare source", exact: true })).toBeVisible();\n',
              '  await expect(page.getByRole("button", { name: "B compare source", exact: true })).toContainText("Transcription");\n',
          )
          path.write_text(text)

          # Spectrogram is now a first-class tab rather than a More-menu item.
          path = root / "spectrogram.spec.ts"
          text = path.read_text()
          text = text.replace(
              '  await page.getByRole("button", { name: "More" }).click();\n  await page.getByRole("option", { name: "Spectrogram", exact: true }).click();',
              '  await page.getByRole("tab", { name: "Spectrogram" }).click();',
          )
          text = text.replace(
              'test("is available from More and preserves shared seek and selection"',
              'test("is directly available and preserves shared seek and selection"',
          )
          path.write_text(text)

          # Compare moved into transport; Stop and nested piano-roll scrolling were removed.
          path = root / "workspace-ergonomics.spec.ts"
          text = path.read_text()
          text = text.replace(' * - Compare is near the representation tabs, not in the transport\n', ' * - Compare is integrated into the transport\n')
          text = text.replace(' * - Loop/Stop are icon buttons with aria-labels\n', ' * - Loop is an accessible icon button; play/pause is the primary transport action\n')
          text = text.replace(' * - Library has one desktop toggle\n', ' * - Library stays docked on desktop without duplicate collapse controls\n')
          text = text.replace('test("Compare is near representation tabs, not in transport"', 'test("Compare is integrated into the transport"')
          text = text.replace(
              '    // Compare button should be near the tabs\n    await expect(page.getByRole("button", { name: "Compare", exact: true })).toBeVisible();\n\n    // Compare should NOT be in the transport footer\n    const transport = page.locator(\'[aria-label="Playback"]\');\n    await expect(transport.locator(\'button:has-text("Compare")\')).not.toBeVisible();',
              '    const transport = page.getByRole("contentinfo", { name: "Playback" });\n    await expect(transport.getByRole("button", { name: "Compare", exact: true })).toBeVisible();',
          )
          text = text.replace('test("loop and stop are icon buttons with aria-labels"', 'test("loop is an accessible icon control"')
          text = text.replace(
              '    // Loop button should have aria-label\n    const loopBtn = page.getByRole("button", { name: "Toggle loop" });\n    await expect(loopBtn).toBeVisible();\n    await expect(loopBtn).toHaveAttribute("title", "Toggle loop");\n\n    // Stop button should have aria-label\n    const stopBtn = page.getByRole("button", { name: "Stop" });\n    await expect(stopBtn).toBeVisible();\n    await expect(stopBtn).toHaveAttribute("title", "Stop");',
              '    const loopBtn = page.getByRole("button", { name: "Toggle loop" });\n    await expect(loopBtn).toBeVisible();\n    await expect(loopBtn).toHaveAttribute("title", "Loop");\n    await expect(page.getByRole("button", { name: "Play", exact: true })).toBeVisible();',
          )
          text = text.replace('test("library has one desktop toggle in header only"', 'test("library is docked on desktop without duplicate collapse controls"')
          text = text.replace(
              '    // Header should have a Library button\n    const header = page.locator("header.studio-header");\n    await expect(header.getByRole("button", { name: /library/i })).toBeVisible();\n\n    // The library panel itself should NOT have a separate collapse button\n    // (it was removed - only the header toggle remains)\n    const library = page.locator("aside.studio-library");\n    await expect(library.locator(\'button[title="Collapse library"]\')).not.toBeVisible();',
              '    const library = page.locator("aside.studio-library");\n    await expect(library).toBeVisible();\n    await expect(library.getByRole("heading", { name: "Library" })).toBeVisible();\n    await expect(library.locator(\'button[title="Collapse library"]\')).toHaveCount(0);\n\n    // The header control is mobile-only and should not duplicate the docked desktop navigation.\n    await expect(page.locator("header.studio-header").getByRole("button", { name: /library/i })).not.toBeVisible();',
          )
          text = text.replace(
              '    // The piano roll scroll container should have a reasonable height\n    const scroll = page.locator(".piano-roll-scroll");\n    const box = await scroll.boundingBox();',
              '    // The redesigned roll uses the workspace canvas instead of a nested vertical scroller.\n    const box = await page.getByTestId("piano-roll").boundingBox();',
          )
          path.write_text(text)

          # Library row deletion is now an optimistic row-menu action.
          path = root / "deletion-flow.spec.ts"
          text = path.read_text()
          text = text.replace(
              '  // Click the delete affordance (×), then confirm (🗑).\n  await page.getByRole("button", { name: "Delete work" }).click();\n  await page.getByRole("button", { name: "Confirm delete" }).click();',
              '  await page.getByRole("button", { name: "More actions for Test Work" }).click();\n  await page.getByRole("menuitem", { name: "Delete recording" }).click();',
          )
          text = text.replace(
              '  await expect(page.getByText(/Bring in a recording/)).toBeVisible();',
              '  await expect(page.getByRole("heading", { name: "Import a recording" })).toBeVisible();',
          )
          text = text.replace(
              '  // No stale transport state: playback is disabled, the playhead is at 0:00,\n  // and the previously-loaded duration is cleared rather than left behind.\n  await expect(seek).toBeDisabled();\n  const times = page.locator(".transport-time");\n  await expect(times.nth(0)).toHaveText("0:00");\n  await expect(times.nth(1)).toHaveText("0:00");',
              '  // No stale transport state: deleting the active work removes the source\n  // controls entirely rather than leaving a disabled playhead behind.\n  await expect(page.getByRole("slider", { name: "Playback position" })).toHaveCount(0);\n  await expect(page.getByRole("button", { name: /Playback source:/ })).toHaveCount(0);',
          )
          path.write_text(text)

          # Shared-selection compare source menu uses explicit aria labels.
          path = root / "shared-selection.spec.ts"
          text = path.read_text().replace(
              'page.getByRole("button", { name: "B: " }).click();',
              'page.getByRole("button", { name: "B compare source", exact: true }).click();',
          )
          path.write_text(text)

          # Score follow tests assert the source state instead of removed helper copy.
          path = root / "score-playback-follow.spec.ts"
          text = path.read_text().replace(
              '    // Verify hint says notation time\n    await expect(\n      page.getByText(\n        "Playing the score rendition in notation time.",\n      ),\n    ).toBeVisible();\n\n',
              '    await expect(page.getByRole("button", { name: "Playback source: Score", exact: true })).toBeVisible();\n\n',
          )
          path.write_text(text)

          # Real-stack import should observe the semantic processing state, not transient copy.
          path = root / "real-stack-golden.spec.ts"
          text = path.read_text()
          text = text.replace(
              'page.getByRole("button", { name: new RegExp(`^${side}: `) }).click();',
              'page.getByRole("button", { name: `${side} compare source`, exact: true }).click();',
          )
          text = text.replace('    const uploading = page.getByText("Uploading your recording…");', '    const processing = page.getByRole("progressbar");')
          text = text.replace('      uploading.waitFor({ state: "visible", timeout: 15_000 }).then(() => "started"),', '      processing.waitFor({ state: "visible", timeout: 15_000 }).then(() => "started"),')
          text = text.replace('Score rendition', 'Score').replace('score rendition', 'score')
          text = text.replace(
              '    await expect(page.getByRole("button", { name: "B: Transcription", exact: true })).toBeVisible();',
              '    await expect(page.getByRole("button", { name: "B compare source", exact: true })).toContainText("Transcription");',
          )
          text = text.replace(
              '    await page.getByTitle("Delete work").click();',
              '    const activeRowActions = page.getByRole("button", { name: /More actions for / }).first();\n    await activeRowActions.click();\n    await page.getByRole("menuitem", { name: "Delete recording" }).click();',
          )
          text = text.replace('    await page.getByTitle("Click again to confirm delete").click();\n', '')
          text = text.replace(
              '    await expect(page.getByText(/Bring in a recording|Start with a recording/i).first()).toBeVisible({ timeout: 15_000 });',
              '    await expect(page.getByRole("heading", { name: "Import a recording" })).toBeVisible({ timeout: 15_000 });',
          )
          text = text.replace(
              '    await expect(page.getByRole("slider", { name: "Playback position" })).toBeDisabled();\n    const times = page.locator(".transport-time");\n    await expect(times.nth(0)).toHaveText("0:00");\n    await expect(times.nth(1)).toHaveText("0:00");\n    await expect(page.getByText(/Playback source:/)).toHaveCount(0);',
              '    await expect(page.getByRole("slider", { name: "Playback position" })).toHaveCount(0);\n    await expect(page.getByRole("button", { name: /Playback source:/ })).toHaveCount(0);',
          )
          text = text.replace(
              '    await expect(page.getByText(/Bring in a recording|Start with a recording/i).first()).toBeVisible({ timeout: 30_000 });',
              '    await expect(page.getByRole("heading", { name: "Import a recording" })).toBeVisible({ timeout: 30_000 });',
          )
          path.write_text(text)

          # Production verification waits for durable library hydration and tolerates the
          # currently deployed v3 empty heading while this v4 PR is not merged yet.
          path = root / "production-verify.spec.ts"
          text = path.read_text()
          text = text.replace(
              '  await expect(\n    page.getByText("Bring in a recording to transcribe, explore, and analyze."),\n  ).toBeVisible({ timeout: 10_000 });',
              '  await expect(page.getByRole("heading", { name: /^(Bring in a recording\\.|Import a recording)$/ })).toBeVisible({ timeout: 10_000 });',
          )
          text = text.replace(
              '  // The Import button renders before the first-load project setup completes;\n  // importing then surfaces "Your project is still loading". Register the\n  // create/list round-trip watcher before navigation so it catches the POST.\n  const projectSettled = page\n    .waitForResponse(\n      (resp) => resp.url().includes("/api/v1/projects") && resp.request().method() === "POST",\n      { timeout: 30_000 },\n    )\n    .catch(() => {});\n  await page.goto(PROD_URL);\n  await projectSettled;',
              '  // Wait for durable library hydration, not merely project creation.\n  const librarySettled = page\n    .waitForResponse(\n      (resp) => /\\/api\\/v1\\/projects\\/[^/]+\\/works$/.test(new URL(resp.url()).pathname) && resp.request().method() === "GET",\n      { timeout: 30_000 },\n    )\n    .catch(() => {});\n  await page.goto(PROD_URL);\n  await librarySettled;',
          )
          path.write_text(text)

          # Prevent the side-library import affordance from racing project hydration.
          path = Path("components/workspace/LibraryPanel.tsx")
          text = path.read_text().replace(
              '              disabled={!canImport}\n',
              '              disabled={!canImport || workspace.isLoadingWork}\n',
          )
          path.write_text(text)

          stale = [
              'name: "Test Work"',
              'Listening to:',
              'name: "Compare playback"',
              'name: "Sign in with Google"',
              'getByText("Music Lab")',
              'getByTitle("Delete work")',
              'getByRole("button", { name: "Stop" })',
              '.piano-roll-scroll',
              'Uploading your recording…',
          ]
          failures = []
          for path in specs:
              text = path.read_text()
              for needle in stale:
                  if needle in text:
                      failures.append(f"{path}: {needle}")
          if failures:
              raise SystemExit("stale browser contracts remain:\n" + "\n".join(failures))
          PY

          if git diff --quiet; then
            echo "No repair needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e components/workspace/LibraryPanel.tsx
          git commit -m "test: align e2e contracts with workspace redesign"
          git push origin HEAD:design/product-ui-polish-v4
