name: issue-1083-alignment-eval

on:
  push:
    branches:
      - issue-1083-score-performance-alignment
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6.0.0
        with:
          python-version: "3.11"
      - name: Recreate the exact locked worker environment
        run: |
          set -euxo pipefail
          python -VV
          python -m pip install 'uv==0.12.6'
          cd backend
          uv sync --frozen --no-dev --group worker
          uv pip check --python .venv/bin/python
          du -sk .venv | tee /tmp/worker-before.txt
          .venv/bin/python - <<'PY' | tee /tmp/worker-baseline.txt
          import importlib.metadata
          for name in ("numpy", "scipy", "music21", "pretty-midi", "partitura"):
              print(f"{name}=={importlib.metadata.version(name)}")
          PY
      - name: Add only Parangonar to the locked worker environment
        run: |
          set -euxo pipefail
          cd backend
          uv pip install --python .venv/bin/python 'parangonar==3.3.3'
          uv pip check --python .venv/bin/python
          du -sk .venv | tee /tmp/worker-after.txt
          BEFORE=$(cut -f1 /tmp/worker-before.txt)
          AFTER=$(cut -f1 /tmp/worker-after.txt)
          printf 'locked_worker_incremental_delta_kib=%s\n' "$((AFTER-BEFORE))" | tee /tmp/install-delta.txt
          uv pip freeze --python .venv/bin/python | sort | tee /tmp/alignment-freeze.txt
      - name: Run real symbolic alignment evaluation
        run: |
          set -euxo pipefail
          /usr/bin/time -v -o /tmp/alignment-time.txt \
            backend/.venv/bin/python scripts/evaluate_score_performance_alignment.py \
            | tee /tmp/alignment-report.json
          cat /tmp/alignment-time.txt
          cat /tmp/install-delta.txt
          cat /tmp/worker-baseline.txt
      - name: Upload reproducibility artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: issue-1083-alignment-eval
          path: |
            /tmp/alignment-report.json
            /tmp/alignment-time.txt
            /tmp/install-delta.txt
            /tmp/alignment-freeze.txt
            /tmp/worker-baseline.txt
