name: Apply exact PR 343 browser repair

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.number == 343 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/product-ui-polish-v4
      - name: Apply verified E2E sources
        run: |
          cat > /tmp/e2e-fixed.b64 <<'EOF'

EOF
          base64 -d /tmp/e2e-fixed.b64 > /tmp/e2e-fixed.tar.gz
          tar -xzf /tmp/e2e-fixed.tar.gz -C tests/e2e
          python - <<'PY'
          from pathlib import Path
          path = Path("components/workspace/LibraryPanel.tsx")
          text = path.read_text().replace(
              '              disabled={!canImport}\n',
              '              disabled={!canImport || workspace.isLoadingWork}\n',
          )
          path.write_text(text)
          PY
          if git diff --quiet; then
            echo "Exact repair already applied"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e components/workspace/LibraryPanel.tsx
          git commit -m "test: align e2e contracts with workspace redesign"
          git push origin HEAD:design/product-ui-polish-v4
