name: Issue 1179 browser integration 2
on:
  pull_request:
    branches: [main]
    types: [synchronize]
permissions:
  contents: write
jobs:
  integrate:
    if: github.head_ref == 'agent/1179-production-spatial-lens'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: agent/1179-production-spatial-lens
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - name: Wire browser coverage
        shell: python
        run: |
          from pathlib import Path
          def patch(path, old, new):
              p=Path(path); text=p.read_text()
              if new in text: return
              if text.count(old)!=1: raise SystemExit(f'{path}: anchor count {text.count(old)}')
              p.write_text(text.replace(old,new,1))
          patch('app/_test-support/msw/handlers.ts',
            'import { sampleWavBase64, sampleWavOutputBase64 } from "@/app/_test-support/msw/fixtures/sample-wav";\n',
            'import { sampleWavBase64, sampleWavOutputBase64 } from "@/app/_test-support/msw/fixtures/sample-wav";\nimport { productionSpatialHandlers, productionSpatialReportArtifact, productionSpatialReportReady } from "@/app/_test-support/msw/production-spatial";\n')
          patch('app/_test-support/msw/handlers.ts','export const handlers = [\n','export const handlers = [\n  ...productionSpatialHandlers,\n')
          patch('app/_test-support/msw/handlers.ts',
            '      item("mock-rendered-score-version", "rendered_score", `data:audio/wav;base64,${sampleWavOutputBase64}`, { measure_starts_seconds: measureStartsSeconds }),\n    ];',
            '      item("mock-rendered-score-version", "rendered_score", `data:audio/wav;base64,${sampleWavOutputBase64}`, { measure_starts_seconds: measureStartsSeconds }),\n      ...(productionSpatialReportReady() ? [productionSpatialReportArtifact(now, sourceVersionId)] : []),\n    ];')
          p=Path('components/workspace/inspector/Inspector.tsx'); t=p.read_text(); p.write_text(t.replace('      <MeasuredChanges />\n        <ProductionSpatial />\n      <PassageCompare />','      <MeasuredChanges />\n      <ProductionSpatial />\n      <PassageCompare />'))
          p=Path('tests/e2e/real-stack-golden.spec.ts'); t=p.read_text(); marker='\n  // ── Annotations and Inspector ────────────────────────────────────────\n'
          if 'test.step("experimental production / space"' not in t:
              block='''\n  // ── Experimental Production / Space ─────────────────────────────────\n  await test.step("experimental production / space", async () => {\n    await page.getByRole("tab", { name: "Breakdown" }).click();\n    const inspector = page.locator("aside.inspector");\n    const lens = inspector.getByRole("region", { name: "Production and spatial analysis" });\n    await expect(lens).toBeVisible({ timeout: 20_000 });\n    await lens.getByRole("button", { name: "+ Add analysis", exact: true }).click();\n    await expect(lens.getByText("Production / Space", { exact: true })).toBeVisible();\n    await expect(lens.getByText("Experimental", { exact: true })).toBeVisible();\n    await lens.getByRole("button", { name: "Add", exact: true }).click();\n    await expect(lens.getByText("Spectral centroid", { exact: true })).toBeVisible({ timeout: 180_000 });\n    await expect(lens.getByText("Onset strength", { exact: true })).toBeVisible();\n    await expect(lens.getByText(/Mid\\/side evidence is unavailable|Side energy share/)).toBeVisible();\n    const spectral = lens.locator("article").filter({ hasText: "Spectral centroid" });\n    await spectral.getByText("Method", { exact: true }).click();\n    await expect(spectral.getByText(/librosa spectral centroid mean per fixed window/)).toBeVisible();\n    await expect(spectral.getByText(/Source Version:/)).toBeVisible();\n    await spectral.getByRole("button", { name: "Inspect", exact: true }).click();\n    await expect(inspector.getByRole("button", { name: "Clear selection" })).toBeVisible({ timeout: 10_000 });\n  });\n'''
              if t.count(marker)!=1: raise SystemExit('real-stack insertion marker drift')
              p.write_text(t.replace(marker,block+marker,1))
      - run: npx tsx scripts/architecture/generate-frontend-dependencies.ts
      - run: npm run lint && npm run typecheck && npx tsx scripts/architecture/generate-frontend-dependencies.ts --check
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/_test-support/msw/handlers.ts components/workspace/inspector/Inspector.tsx docs/generated/frontend-dependencies.md tests/e2e/real-stack-golden.spec.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "test: integrate production spatial browser coverage"
          git push origin HEAD:agent/1179-production-spatial-lens
