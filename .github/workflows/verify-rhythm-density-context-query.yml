name: Verify rhythm density context query

on:
  push:
    branches:
      - verify/rhythm-density-context-query

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: 0.12.6
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Sync locked backend environment
        run: uv sync --project backend --locked
      - name: Ruff check and exact formatter diff
        run: |
          cd backend
          uv run ruff check domain/rhythm_density_context_query.py tests/test_rhythm_density_context_query.py
          uv run ruff format domain/rhythm_density_context_query.py tests/test_rhythm_density_context_query.py
          cd ..
          git diff -- backend/domain/rhythm_density_context_query.py backend/tests/test_rhythm_density_context_query.py
      - name: Focused context stack tests on formatted tree
        working-directory: backend
        run: |
          uv run pytest -q tests/test_rhythm_density_context_query.py tests/test_rhythm_density_context_findings.py tests/test_rhythm_density_work_context.py
