name: Temporary exact Ruff fix for PR 1219

on:
  push:
    branches:
      - agent/1178-symbolic-detail

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/1178-symbolic-detail
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: 0.12.9
      - name: Apply canonical Ruff formatting
        shell: bash
        run: |
          set -euo pipefail
          uvx --from ruff==0.5.7 ruff format backend/domain/symbolic_detail_report.py
          git diff --check
          if git diff --quiet -- backend/domain/symbolic_detail_report.py; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add backend/domain/symbolic_detail_report.py
          git commit -m "fix(ci): apply canonical Ruff formatting to symbolic detail report"
          git push origin HEAD:agent/1178-symbolic-detail
