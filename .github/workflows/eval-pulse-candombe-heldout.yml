name: Pulse Candombe Held-out Evaluation

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/eval-pulse-candombe-heldout.yml'
      - 'backend/evaluation/analysis_v3/pulse/**'
      - 'backend/tests/test_pulse_candombe_*.py'
      - 'backend/evaluation/notation_eval.py'
      - 'backend/tests/test_notation_product_path_eval.py'

permissions:
  contents: read

concurrency:
  group: pulse-candombe-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  heldout:
    name: heldout-candombe
    if: github.event.pull_request.head.ref == 'eval-pulse-candombe-heldout'
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: '.python-version'

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.12.6'
          enable-cache: true
          cache-dependency-glob: 'backend/uv.lock'

      - name: Sync locked backend environment
        run: uv sync --project backend --locked

      - name: Acquire exact Beat This v1.0 validation inputs
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/candombe-heldout"
          audio_dir="$root/audio"
          ann_dir="$root/annotations"
          mkdir -p "$audio_dir" "$ann_dir"

          base_audio='https://www.eumus.edu.uy/candombe/datasets/ISMIR2015'
          base_ann='https://raw.githubusercontent.com/CPJKU/beat_this_annotations/v1.0/candombe'

          tracks=(
            csic.1995_ansina1_03
            csic.1995_ansina2_01
            csic.1995_ansina2_04
            csic.1995_cuareim_02
            zavala.muniz.2014_41
          )
          md5s=(
            fffe0c4677d994cbc16e7009b7cad982
            1131da5060d9a55675563fd0d9754bce
            ea6d50a23fe392aa2c0059378e86c5e1
            73aa793b6810118dc19e0f50d63ddcbd
            a305627f4549d364a9627e5e507b1046
          )

          curl --fail --location --retry 4 --retry-all-errors \
            "$base_ann/single.split" \
            --output "$root/single.split"

          for i in "${!tracks[@]}"; do
            track="${tracks[$i]}"
            audio="$audio_dir/$track.flac"
            annotation="$ann_dir/$track.beats"

            curl --fail --location --retry 4 --retry-all-errors \
              "$base_audio/$track.flac" \
              --output "$audio"
            echo "${md5s[$i]}  $audio" | md5sum --check --strict -

            curl --fail --location --retry 4 --retry-all-errors \
              "$base_ann/annotations/beats/$track.beats" \
              --output "$annotation"
          done

          echo "CANDOMBE_ROOT=$root" >> "$GITHUB_ENV"

      - name: Build exact held-out manifest
        run: |
          uv run --project backend python -m backend.evaluation.analysis_v3.pulse.datasets.candombe \
            "$CANDOMBE_ROOT/annotations" \
            "$CANDOMBE_ROOT/single.split" \
            "$CANDOMBE_ROOT/audio" \
            "$CANDOMBE_ROOT/manifest.json"

      - name: Score production baseline on identical audio
        run: |
          uv run --project backend python -m backend.evaluation.analysis_v3.pulse.run_manifest \
            --candidate current \
            --manifest "$CANDOMBE_ROOT/manifest.json" \
            --output-dir "$CANDOMBE_ROOT/results"

      - name: Score Beat This single_final0 on identical audio
        run: |
          uv run --project backend python -m backend.evaluation.analysis_v3.pulse.run_manifest \
            --candidate beat_this_single_final0 \
            --manifest "$CANDOMBE_ROOT/manifest.json" \
            --output-dir "$CANDOMBE_ROOT/results"

      - name: Print machine-readable results
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -d "$CANDOMBE_ROOT/results" ]; then
            for result in "$CANDOMBE_ROOT"/results/*.json; do
              [ -e "$result" ] || continue
              echo "===== $result ====="
              cat "$result"
            done
          fi

      - name: Upload evaluation outputs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: candombe-heldout-${{ github.event.pull_request.head.sha }}
          path: |
            ${{ runner.temp }}/candombe-heldout/manifest.json
            ${{ runner.temp }}/candombe-heldout/results/*.json
          if-no-files-found: warn
          retention-days: 14

  notation-stage-result:
    name: heldout-notation-stage-attribution
    if: github.event.pull_request.head.ref == 'eval/maestro-notation-stage-attribution'
    timeout-minutes: 90
    runs-on: ubuntu-latest
    env:
      MUSIC_EVAL_CACHE_DIR: ${{ runner.temp }}/notation-maestro-cache
      RESULT_DIR: ${{ runner.temp }}/notation-stage-result
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: '.python-version'

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.12.6'
          enable-cache: true
          cache-dependency-glob: 'backend/uv.lock'

      - name: Sync locked backend environment
        run: uv sync --project backend --locked

      - name: Run focused evaluator tests
        working-directory: backend
        run: uv run pytest -q tests/test_notation_product_path_eval.py tests/test_prepared_corpus_manifest.py

      - name: Materialize all pinned MAESTRO test excerpts
        working-directory: backend
        run: |
          set -euo pipefail
          uv run python -m evaluation.datasets.prepare --corpus real_world_v1 --dataset maestro \
            | tee "$RUNNER_TEMP/maestro-prepare.log"
          test -f "$MUSIC_EVAL_CACHE_DIR/manifest-real_world_v1-maestro.json"

      - name: Run reference-MIDI ceiling and production Basic Pitch path
        working-directory: backend
        run: |
          set -euo pipefail
          mkdir -p "$RESULT_DIR"
          uv run python -m evaluation.notation_eval \
            --manifest "$MUSIC_EVAL_CACHE_DIR/manifest-real_world_v1-maestro.json" \
            --output-dir "$RESULT_DIR" \
            --mode both

      - name: Require complete held-out result and summarize attribution
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import statistics
          from pathlib import Path

          result_dir = Path(os.environ['RESULT_DIR'])
          result = json.loads((result_dir / 'notation_eval.json').read_text())
          rows = result['clips']
          assert result['mode'] == 'both'
          assert len(rows) == 30, len(rows)
          assert all('error' not in row for row in rows), [row for row in rows if 'error' in row]

          by_mode = {}
          by_clip = {}
          for row in rows:
              by_mode.setdefault(row['mode'], []).append(row)
              by_clip.setdefault(row['clip_id'], {})[row['mode']] = row
          ref_mode = 'reference_midi_to_score'
          product_mode = 'audio_to_predicted_midi_to_score'
          assert len(by_mode.get(ref_mode, [])) == 15
          assert len(by_mode.get(product_mode, [])) == 15
          assert len(by_clip) == 15
          assert all(set(pair) == {ref_mode, product_mode} for pair in by_clip.values())

          def mean(values):
              return round(statistics.mean(values), 4) if values else None

          onset_f1 = [row['accuracy']['onset_flat']['f1'] for row in by_mode[product_mode]]
          note_f1 = [row['accuracy']['note_flat']['f1'] for row in by_mode[product_mode]]
          paired = []
          for clip_id, pair in sorted(by_clip.items()):
              ref = pair[ref_mode]['structural']
              prod = pair[product_mode]['structural']
              paired.append({
                  'clip_id': clip_id,
                  'reference_midi_score': {
                      'total_note_count': ref.get('total_note_count'),
                      'pitched_note_count': ref.get('pitched_note_count'),
                      'measure_count': ref.get('measure_count'),
                      'tie_count': ref.get('tie_count'),
                      'tie_fragment_overhead': ref.get('tie_fragment_overhead'),
                  },
                  'production_basic_pitch_score': {
                      'total_note_count': prod.get('total_note_count'),
                      'pitched_note_count': prod.get('pitched_note_count'),
                      'measure_count': prod.get('measure_count'),
                      'tie_count': prod.get('tie_count'),
                      'tie_fragment_overhead': prod.get('tie_fragment_overhead'),
                  },
                  'transcription': pair[product_mode]['accuracy'],
              })

          summary = {
              'schema_version': 1,
              'hello_ai_sha': os.environ.get('GITHUB_SHA'),
              'corpus': 'MAESTRO V3 test excerpts pinned in real_world_v1',
              'clips': 15,
              'rows': 30,
              'reference_musicxml': 'unavailable; score-reference fidelity withheld',
              'production_transcription': 'BasicPitchEngine including current product cleanup',
              'macro_transcription_onset_f1': mean(onset_f1),
              'macro_transcription_note_f1': mean(note_f1),
              'reference_midi_score_mean_total_notes': mean([row['structural']['total_note_count'] for row in by_mode[ref_mode]]),
              'production_score_mean_total_notes': mean([row['structural']['total_note_count'] for row in by_mode[product_mode]]),
              'reference_midi_score_mean_measures': mean([row['structural']['measure_count'] for row in by_mode[ref_mode]]),
              'production_score_mean_measures': mean([row['structural']['measure_count'] for row in by_mode[product_mode]]),
              'reference_midi_score_mean_ties': mean([row['structural']['tie_count'] for row in by_mode[ref_mode]]),
              'production_score_mean_ties': mean([row['structural']['tie_count'] for row in by_mode[product_mode]]),
              'paired': paired,
          }
          (result_dir / 'stage_attribution_summary.json').write_text(json.dumps(summary, indent=2) + '\n')
          print(json.dumps({key: value for key, value in summary.items() if key != 'paired'}, indent=2))
          PY

      - name: Upload notation stage result
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: maestro-notation-stage-attribution-${{ github.event.pull_request.head.sha }}
          path: |
            ${{ runner.temp }}/notation-stage-result/notation_eval.json
            ${{ runner.temp }}/notation-stage-result/stage_attribution_summary.json
            ${{ runner.temp }}/maestro-prepare.log
          if-no-files-found: error
          retention-days: 30
