name: Apply rhythm density coverage patch

on:
  push:
    branches: [fix/rhythm-density-full-coverage]
    paths:
      - '.github/workflows/rhythm-density-coverage-edit.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/rhythm-density-full-coverage
      - name: Patch persistence contract and tests
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          capabilities = Path('backend/domain/capabilities.py')
          text = capabilities.read_text()
          old = '''                evidence={"windows": note_density[:50]},\n'''
          new = '''                evidence={\n                    "windows": note_density,\n                    "coverage": {\n                        "policy_version": "complete_series_v1",\n                        "total_generated_window_count": len(note_density),\n                        "stored_window_count": len(note_density),\n                        "start_seconds": note_density[0].get("start"),\n                        "end_seconds": note_density[-1].get("end"),\n                        "truncated": False,\n                    },\n                },\n'''
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one persistence snippet, found {text.count(old)}')
          capabilities.write_text(text.replace(old, new))

          tests = Path('backend/tests/test_rhythm_density_contract.py')
          test_text = tests.read_text()
          marker = '''def test_rhythm_density_capability_maturity_is_unchanged() -> None:\n'''
          if marker not in test_text:
              raise SystemExit('test insertion marker not found')
          addition = '''\n\ndef test_persisted_rhythm_density_keeps_complete_series_and_declares_coverage(\n    monkeypatch,\n) -> None:\n    beats = [float(index) for index in range(82)]\n    onsets = [float(index) + 0.25 for index in range(81)]\n    beat_windows = analyze._compute_beat_relative_density(\n        onsets,\n        beats,\n        window_beats=2,\n        step_beats=1,\n    )\n    assert len(beat_windows) > 50\n\n    persisted = _patch_handle_analyze_shell(monkeypatch, _minimal_analysis(beat_windows))\n    density = next(item for item in persisted if item["kind"] == "rhythm_density")\n    evidence = density["evidence"]\n\n    assert evidence["windows"] == beat_windows\n    assert evidence["coverage"] == {\n        "policy_version": "complete_series_v1",\n        "total_generated_window_count": len(beat_windows),\n        "stored_window_count": len(beat_windows),\n        "start_seconds": beat_windows[0]["start"],\n        "end_seconds": beat_windows[-1]["end"],\n        "truncated": False,\n    }\n\n\n'''
          tests.write_text(test_text.replace(marker, addition + marker))
          PY
      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/domain/capabilities.py backend/tests/test_rhythm_density_contract.py
          git diff --cached --check
          git commit -m 'fix(rhythm): persist complete density coverage'
          git push origin HEAD:fix/rhythm-density-full-coverage
