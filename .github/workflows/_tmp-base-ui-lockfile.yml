name: Temporary Base UI lockfile generator

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  generate:
    if: github.head_ref == 'frontend/base-ui-tabs'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: npm
      - name: Generate package lock with npm
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Store generated lockfile as an unattached Git blob
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          jq -Rs '{content: ., encoding: "utf-8"}' package-lock.json > /tmp/blob.json
          response="$(curl --fail-with-body -sS -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/blobs" \
            --data-binary @/tmp/blob.json)"
          sha="$(jq -r '.sha' <<<"$response")"
          test -n "$sha" && test "$sha" != "null"
          echo "Generated lockfile blob: $sha"
      - name: Upload generated lockfile
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: base-ui-generated-package-lock
          path: package-lock.json
          retention-days: 1
