name: Stage score reinterpretation UI

on:
  push:
    branches:
      - feat/workspace-score-reinterpretation

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/workspace-score-reinterpretation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Patch score reinterpretation UI
        run: python .github/scripts/stage-991.py
      - name: Place selector test in canonical test tree
        run: |
          mkdir -p tests
          sed -i 's|"./domain.types"|"../lib/domain.types"|' lib/score-artifacts.test.ts
          sed -i 's|"./score-artifacts"|"../lib/score-artifacts"|' lib/score-artifacts.test.ts
          mv lib/score-artifacts.test.ts tests/score-artifacts.test.ts
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- tests/score-artifacts.test.ts
      - name: Commit product changes and remove staging files
        run: |
          rm .github/workflows/stage-991.yml .github/scripts/stage-991.py
          git config user.name "listencloser-ci"
          git config user.email "actions@users.noreply.github.com"
          git add lib/api-client.ts lib/stores/workspace.tsx lib/score-artifacts.ts tests/score-artifacts.test.ts components/workspace/WorkspaceSession.tsx components/workspace/RepresentationStack.tsx .github/workflows/stage-991.yml .github/scripts/stage-991.py
          git commit -m "feat(score): reinterpret existing Work score"
          git push origin HEAD:feat/workspace-score-reinterpretation
