name: Verify rhythm density Work context

on:
  push:
    branches: [verify/rhythm-density-work-context]

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: '.python-version'
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.12.6'
          enable-cache: true
          cache-dependency-glob: 'backend/uv.lock'
      - name: Sync locked backend environment
        run: uv sync --project backend --locked
      - name: Ruff focused files
        working-directory: backend
        run: |
          uv run ruff check domain/rhythm_density_context.py tests/test_rhythm_density_work_context.py
          uv run ruff format domain/rhythm_density_context.py tests/test_rhythm_density_work_context.py --check
      - name: Focused relation tests
        run: >-
          uv run --project backend python -m pytest
          backend/tests/test_rhythm_density_work_context.py
          backend/tests/test_rhythm_density_relation_observations.py
          backend/tests/test_rhythm_density_relation_integrity.py
          -q
