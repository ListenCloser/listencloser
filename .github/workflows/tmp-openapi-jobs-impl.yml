name: Temporary OpenAPI jobs implementation

on:
  push:
    branches: [refactor/openapi-jobs-delete-work]

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refactor/openapi-jobs-delete-work
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: '.python-version'
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.12.6'
          enable-cache: true
          cache-dependency-glob: 'backend/uv.lock'
      - run: npm ci
      - run: uv sync --project backend --locked
      - name: Strengthen job response schema and migrate callers
        run: |
          python - <<'PY'
          from pathlib import Path

          backend = Path('backend/domain/api.py')
          text = backend.read_text()
          text = text.replace('    Job,\n    Project,', '    Job,\n    JobStage,\n    Project,', 1)
          text = text.replace('    stage: str\n', '    stage: JobStage\n', 1)
          text = text.replace('        stage=job.lifecycle.current.value,', '        stage=job.lifecycle.current,', 1)
          backend.write_text(text)

          client = Path('lib/api-client.ts')
          text = client.read_text()
          old = '''export async function deleteWork(workId: string): Promise<{ deleted: string }> {\n  const result = await apiFetch<{ deleted: string }>(`/api/v1/works/${workId}`, {\n    method: "DELETE",\n  });\n  invalidateWorkCache(cacheEpoch(), workId);\n  return result;\n}\n'''
          new = '''export async function deleteWork(workId: string): Promise<{ deleted: string }> {\n  const result = await openapiClient.DELETE("/api/v1/works/{work_id}", {\n    params: { path: { work_id: workId } },\n  });\n  const data = requireOpenApiData(result);\n  invalidateWorkCache(cacheEpoch(), workId);\n  return data;\n}\n'''
          if old not in text:
              raise SystemExit('deleteWork block not found')
          text = text.replace(old, new, 1)

          old = '''export async function getJob(jobId: string): Promise<JobStatus> {\n  return apiFetch<JobStatus>(`/api/v1/jobs/${jobId}`);\n}\n\nexport async function cancelJob(jobId: string): Promise<JobStatus> {\n  const result = await apiFetch<JobStatus>(`/api/v1/jobs/${jobId}/cancel`, {\n    method: "POST",\n  });\n  clearWorkDataCache();\n  return result;\n}\n\nexport async function retryJob(jobId: string): Promise<JobStatus> {\n  clearWorkDataCache();\n  return apiFetch<JobStatus>(`/api/v1/jobs/${jobId}/retry`, {\n    method: "POST",\n  });\n}\n'''
          new = '''export async function getJob(jobId: string): Promise<JobStatus> {\n  const result = await openapiClient.GET("/api/v1/jobs/{job_id}", {\n    params: { path: { job_id: jobId } },\n  });\n  return requireOpenApiData(result);\n}\n\nexport async function cancelJob(jobId: string): Promise<JobStatus> {\n  const result = await openapiClient.POST("/api/v1/jobs/{job_id}/cancel", {\n    params: { path: { job_id: jobId } },\n  });\n  const data = requireOpenApiData(result);\n  clearWorkDataCache();\n  return data;\n}\n\nexport async function retryJob(jobId: string): Promise<JobStatus> {\n  clearWorkDataCache();\n  const result = await openapiClient.POST("/api/v1/jobs/{job_id}/retry", {\n    params: { path: { job_id: jobId } },\n  });\n  return requireOpenApiData(result);\n}\n'''
          if old not in text:
              raise SystemExit('job transport block not found')
          client.write_text(text.replace(old, new, 1))

          domain_types = Path('lib/domain.types.ts')
          text = domain_types.read_text()
          old = '''export type JobStatus = Omit<Schemas["JobStateResponse"], "stage"> & {\n  stage: JobStage;\n};\n'''
          if old not in text:
              raise SystemExit('JobStatus compatibility shim not found')
          domain_types.write_text(text.replace(old, 'export type JobStatus = Schemas["JobStateResponse"];\n', 1))
          PY
      - name: Add focused transport tests
        run: |
          cat > tests/lib/api-client-jobs.test.ts <<'EOF'
          import { beforeEach, describe, expect, it, vi } from "vitest";

          const { get, post, del, apiFetch } = vi.hoisted(() => ({
            get: vi.fn(),
            post: vi.fn(),
            del: vi.fn(),
            apiFetch: vi.fn(),
          }));

          vi.mock("@/lib/openapi-client", () => ({
            openapiClient: { GET: get, POST: post, DELETE: del },
            requireOpenApiData: <T,>({ data, error, response }: { data?: T; error?: unknown; response: Response }): T => {
              if (data !== undefined) return data;
              const message =
                typeof error === "object" && error !== null && "error" in error
                  ? (error as { error?: unknown }).error
                  : undefined;
              throw new Error(typeof message === "string" ? message : `Request failed: ${response.status}`);
            },
          }));
          vi.mock("@/lib/api", () => ({ apiFetch }));
          vi.mock("@/lib/supabase", () => ({ supabase: null }));

          import { cancelJob, deleteWork, getJob, retryJob } from "@/lib/api-client";
          import { getQueryClient } from "@/lib/query-client";
          import type { JobStatus } from "@/lib/domain.types";

          const job: JobStatus = {
            id: "job-1",
            workflow_id: "workflow-1",
            capability: "understand",
            stage: "running",
            progress: 0.5,
            message: "Processing",
            error: null,
            input_version_ids: ["version-1"],
            output_version_ids: [],
          };

          const ok = <T,>(data: T) => ({
            data,
            response: new Response(JSON.stringify(data), { status: 200 }),
          });

          describe("generated job and Work-delete transport", () => {
            beforeEach(() => {
              get.mockReset();
              post.mockReset();
              del.mockReset();
              apiFetch.mockReset();
              getQueryClient().clear();
            });

            it("reads job state through the generated path operation", async () => {
              get.mockResolvedValueOnce(ok(job));
              await expect(getJob("job-1")).resolves.toEqual(job);
              expect(get).toHaveBeenCalledWith("/api/v1/jobs/{job_id}", {
                params: { path: { job_id: "job-1" } },
              });
              expect(apiFetch).not.toHaveBeenCalled();
            });

            it("cancels and retries through generated operations while preserving cache invalidation", async () => {
              post.mockResolvedValueOnce(ok({ ...job, stage: "cancelled" }));
              await expect(cancelJob("job-1")).resolves.toMatchObject({ stage: "cancelled" });
              expect(post).toHaveBeenNthCalledWith(1, "/api/v1/jobs/{job_id}/cancel", {
                params: { path: { job_id: "job-1" } },
              });
              expect(getQueryClient().getQueryData(["work-data-meta", "epoch"])).toBe(1);

              post.mockResolvedValueOnce(ok({ ...job, stage: "queued" }));
              await expect(retryJob("job-1")).resolves.toMatchObject({ stage: "queued" });
              expect(post).toHaveBeenNthCalledWith(2, "/api/v1/jobs/{job_id}/retry", {
                params: { path: { job_id: "job-1" } },
              });
              expect(getQueryClient().getQueryData(["work-data-meta", "epoch"])).toBe(2);
            });

            it("deletes a Work through the generated operation", async () => {
              del.mockResolvedValueOnce(ok({ deleted: "work-1" }));
              await expect(deleteWork("work-1")).resolves.toEqual({ deleted: "work-1" });
              expect(del).toHaveBeenCalledWith("/api/v1/works/{work_id}", {
                params: { path: { work_id: "work-1" } },
              });
              expect(apiFetch).not.toHaveBeenCalled();
            });
          });
          EOF
      - name: Regenerate generated API contract
        run: npm run api:generate
      - name: Verify generated job stage is typed
        run: |
          grep -F 'stage: components["schemas"]["JobStage"]' lib/api-types.ts
          grep -F 'export type JobStatus = Schemas["JobStateResponse"];' lib/domain.types.ts
      - name: Validate bounded slice
        run: |
          npm run typecheck
          npm run lint
          npm test -- tests/lib/api-client-jobs.test.ts tests/lib/api-client-projects.test.ts tests/lib/openapi-client.test.ts tests/lib/api-client-cache.test.ts tests/lib/job-tracking.test.ts
          npx openapi-typescript openapi/openapi.json -o lib/api-types.ts --check
          git diff --check
      - name: Remove temporary workflow and commit validated slice
        run: |
          rm .github/workflows/tmp-openapi-jobs-impl.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/domain/api.py openapi/openapi.json lib/api-types.ts lib/api-client.ts lib/domain.types.ts tests/lib/api-client-jobs.test.ts .github/workflows/tmp-openapi-jobs-impl.yml
          git commit -m 'refactor(frontend): migrate job and Work delete transport'
          git push origin HEAD:refactor/openapi-jobs-delete-work
