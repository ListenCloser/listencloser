name: Temporary format Basic Pitch cache

on:
  push:
    branches:
      - perf/reuse-basic-pitch-model-ready

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: perf/reuse-basic-pitch-model-ready
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: '.python-version'
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.12.6'
          enable-cache: true
          cache-dependency-glob: 'backend/uv.lock'
      - name: Sync locked backend environment
        run: uv sync --project backend --locked
      - name: Apply repository formatter
        run: uv run --project backend ruff format backend/music_features.py
      - name: Commit formatter output
        run: |
          if git diff --quiet -- backend/music_features.py; then
            echo "No formatter changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/music_features.py
          git commit -m "style: format Basic Pitch model cache"
          git push origin HEAD:perf/reuse-basic-pitch-model-ready
