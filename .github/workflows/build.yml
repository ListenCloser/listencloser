name: Build

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: compile
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    timeout-minutes: 15
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify GitHub Actions are pinned
        run: python3 scripts/check_actions_pinned.py
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: npm
      - name: Restore Next.js build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-prod-${{ hashFiles('package-lock.json') }}-${{ hashFiles('app/**/*', 'components/**/*', 'lib/**/*', 'next.config.mjs', 'package.json', 'tsconfig.json') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-prod-${{ hashFiles('package-lock.json') }}-
      - run: npm ci
      - name: Build proposed revision from Vercel-like source context
        if: github.event_name != 'push'
        shell: bash
        run: |
          set -euo pipefail
          deploy_dir="$(mktemp -d)"
          trap 'rm -rf "$deploy_dir"' EXIT

          # Vercel removes these paths before compiling. Building the full checkout
          # previously allowed runtime imports from tests/ to pass CI and fail only
          # after deployment packaging.
          rsync -a \
            --exclude-from=.vercelignore \
            --exclude='.git/' \
            --exclude='.next/' \
            --exclude='node_modules/' \
            ./ "$deploy_dir/"

          test ! -e "$deploy_dir/tests"
          test ! -e "$deploy_dir/backend"
          test -f "$deploy_dir/mocks/fixtures/sample-wav.ts"

          ln -s "$GITHUB_WORKSPACE/node_modules" "$deploy_dir/node_modules"
          (
            cd "$deploy_dir"
            npm run build
          )
      - name: Build main and upload Sentry source maps
        if: github.event_name == 'push'
        run: npm run build
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}

  frontend-tests:
    name: frontend-tests
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    timeout-minutes: 15
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - run: npm test

  merge-ci:
    if: github.event_name == 'merge_group'
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  merge-e2e:
    if: github.event_name == 'merge_group'
    uses: ./.github/workflows/e2e.yml
    secrets: inherit

  merge-real-stack:
    if: github.event_name == 'merge_group'
    uses: ./.github/workflows/real-stack-e2e.yml
    secrets: inherit

  merge-database:
    if: github.event_name == 'merge_group'
    uses: ./.github/workflows/database-integration.yml
    secrets: inherit

  merge-backend-image:
    if: github.event_name == 'merge_group'
    uses: ./.github/workflows/backend-image.yml
    secrets: inherit

  merge-codeql:
    if: github.event_name == 'merge_group'
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: ./.github/workflows/codeql.yml
    secrets: inherit

  merge-gitleaks:
    if: github.event_name == 'merge_group'
    uses: ./.github/workflows/gitleaks.yml
    secrets: inherit

  build:
    name: build
    if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
    needs:
      - compile
      - frontend-tests
      - merge-ci
      - merge-e2e
      - merge-real-stack
      - merge-database
      - merge-backend-image
      - merge-codeql
      - merge-gitleaks
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: read
    steps:
      - name: Require compile and frontend tests
        run: |
          test "${{ needs.compile.result }}" = "success"
          test "${{ needs.frontend-tests.result }}" = "success"
      - name: Require merge-group integration evidence
        if: github.event_name == 'merge_group'
        run: |
          test "${{ needs.merge-ci.result }}" = "success"
          test "${{ needs.merge-e2e.result }}" = "success"
          test "${{ needs.merge-real-stack.result }}" = "success"
          test "${{ needs.merge-database.result }}" = "success"
          test "${{ needs.merge-backend-image.result }}" = "success"
          test "${{ needs.merge-codeql.result }}" = "success"
          test "${{ needs.merge-gitleaks.result }}" = "success"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
      - name: Require risk-relevant workflow evidence on exact PR head
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/check_merge_evidence.py
          --repo "${{ github.repository }}"
          --pr "${{ github.event.pull_request.number }}"
          --sha "${{ github.event.pull_request.head.sha }}"
