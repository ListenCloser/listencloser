name: Build

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: classify
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      ci: ${{ steps.filter.outputs.ci }}
      docs: ${{ steps.filter.outputs.docs }}
      actions_hygiene: ${{ steps.filter.outputs.actions_hygiene }}
      dependencies: ${{ steps.filter.outputs.dependencies }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Classify changed surface once
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          predicate-quantifier: some-with-excludes
          filters: |
            ci:
              - '**'
              - '!*.md'
              - '!docs/**'
            docs:
              - '**/*.md'
              - '.lychee.toml'
              - '.github/workflows/docs.yml'
              - '.github/workflows/build.yml'
            actions_hygiene:
              - '.github/workflows/**'
              - 'scripts/check-actions.sh'
            dependencies:
              - 'package.json'
              - 'package-lock.json'
              - 'services/backend/pyproject.toml'
              - 'services/backend/uv.lock'
              - 'services/backend/requirements*.txt'
              - '.github/dependency-review.yml'

  preflight:
    name: preflight
    if: ${{ github.event_name != 'push' && (github.event_name == 'merge_group' || needs.classify.outputs.ci == 'true') }}
    needs: classify
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: '.python-version'
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.12.9'
          enable-cache: true
          cache-dependency-glob: 'services/backend/uv.lock'
      - name: Sync locked backend environment
        run: uv sync --project services/backend --locked
      - name: Run fail-fast repository preflight
        run: npm run check:preflight

  autofix:
    name: autofix
    if: ${{ always() && github.event_name == 'pull_request' && github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository && needs.preflight.result == 'failure' }}
    needs: preflight
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.QUEUE_BOT_TOKEN }}
          fetch-depth: 1
      - name: Resolve reconciler token availability
        id: token
        run: |
          if [ -n "${{ secrets.QUEUE_BOT_TOKEN }}" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "QUEUE_BOT_TOKEN is not configured; deterministic autofix is skipped."
          fi
      - name: Bail out when the head is already an autofix commit
        if: steps.token.outputs.ok == 'true'
        run: |
          if [ "$(git log -1 --format=%s)" = "ci: apply deterministic autofixes" ]; then
            echo "Head already contains an autofix commit; not looping."
            exit 0
          fi
      - name: Install frontend toolchain
        if: steps.token.outputs.ok == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: npm
      - name: Install locked frontend dependencies
        if: steps.token.outputs.ok == 'true'
        run: npm ci
      - name: Install Python toolchain
        if: steps.token.outputs.ok == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: '.python-version'
      - name: Install uv
        if: steps.token.outputs.ok == 'true'
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.12.9'
          enable-cache: true
          cache-dependency-glob: 'services/backend/uv.lock'
      - name: Sync locked backend environment
        if: steps.token.outputs.ok == 'true'
        run: uv sync --project services/backend --locked
      - name: Apply deterministic Python autofixes
        if: steps.token.outputs.ok == 'true'
        run: bash scripts/fix.sh python
      - name: Apply deterministic frontend autofixes
        if: steps.token.outputs.ok == 'true'
        run: bash scripts/fix.sh frontend
      - name: Regenerate generated API contract
        if: steps.token.outputs.ok == 'true'
        run: npm run api:generate
      - name: Commit and push autofixes
        if: steps.token.outputs.ok == 'true'
        run: |
          if git diff --quiet --exit-code; then
            echo "No deterministic fixes to apply."
            exit 0
          fi
          git config user.name "listencloser-ci[bot]"
          git config user.email "listencloser-ci[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ci: apply deterministic autofixes"
          git push origin "HEAD:${GITHUB_HEAD_REF}"

  compile:
    name: compile
    if: ${{ always() && (github.event_name == 'push' || (github.event_name == 'merge_group' && needs.classify.result == 'success' && needs.preflight.result == 'success')) }}
    needs:
      - classify
      - preflight
    timeout-minutes: 15
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: npm
      - name: Restore Next.js build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/web/.next/cache
          key: ${{ runner.os }}-nextjs-prod-${{ hashFiles('package-lock.json') }}-${{ hashFiles('apps/web/src/app/**/*', 'apps/web/src/components/**/*', 'apps/web/src/lib/**/*', 'apps/web/next.config.mjs', 'apps/web/package.json', 'apps/web/tsconfig.json') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-prod-${{ hashFiles('package-lock.json') }}-
      - run: npm ci
      - name: Build proposed revision from Vercel-like source context
        if: github.event_name != 'push'
        shell: bash
        run: |
          set -euo pipefail
          deploy_dir="$(mktemp -d)"
          trap 'rm -rf "$deploy_dir"' EXIT
          rsync -a --exclude-from=.vercelignore --exclude='.git/' --exclude='.next/' --exclude='apps/web/.next/' --exclude='node_modules/' ./ "$deploy_dir/"
          test ! -e "$deploy_dir/apps/web/tests"
          test ! -e "$deploy_dir/services/backend"
          test -f "$deploy_dir/apps/web/src/app/_test-support/msw/fixtures/sample-wav.ts"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$deploy_dir/node_modules"
          (cd "$deploy_dir" && npm run build)
      - name: Build main and upload Sentry source maps
        if: github.event_name == 'push'
        run: npm run build
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}

  ci:
    if: ${{ github.event_name != 'push' && (github.event_name == 'merge_group' || needs.classify.outputs.ci == 'true') }}
    needs:
      - classify
      - preflight
    uses: ./.github/workflows/ci.yml

  docs:
    if: ${{ github.event_name != 'push' && needs.classify.outputs.docs == 'true' }}
    needs: classify
    uses: ./.github/workflows/docs.yml

  actions_hygiene:
    name: actions-hygiene
    if: ${{ github.event_name != 'push' && needs.classify.outputs.actions_hygiene == 'true' }}
    needs: classify
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.12.9'
      - name: Check GitHub Actions correctness and security
        run: bash scripts/check-actions.sh

  e2e:
    if: github.event_name == 'merge_group'
    needs:
      - classify
      - preflight
    uses: ./.github/workflows/e2e.yml
    secrets:
      NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
      ARGOS_TOKEN: ${{ secrets.ARGOS_TOKEN }}

  real-stack:
    if: github.event_name == 'merge_group'
    needs:
      - classify
      - preflight
    uses: ./.github/workflows/real-stack-e2e.yml

  database:
    if: github.event_name == 'merge_group'
    needs:
      - classify
      - preflight
    uses: ./.github/workflows/database-integration.yml

  backend-image:
    if: github.event_name == 'merge_group'
    needs:
      - classify
      - preflight
    uses: ./.github/workflows/backend-image.yml

  codeql:
    if: ${{ github.event_name != 'push' && needs.preflight.result == 'success' }}
    needs:
      - classify
      - preflight
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: ./.github/workflows/codeql.yml

  gitleaks:
    if: ${{ github.event_name != 'push' && needs.preflight.result == 'success' }}
    needs:
      - classify
      - preflight
    uses: ./.github/workflows/gitleaks.yml

  dependency-review:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft == false && needs.preflight.result == 'success' && needs.classify.outputs.dependencies == 'true' }}
    needs:
      - classify
      - preflight
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/dependency-review.yml

  build:
    name: build
    if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
    needs:
      - classify
      - preflight
      - autofix
      - compile
      - ci
      - docs
      - actions_hygiene
      - e2e
      - real-stack
      - database
      - backend-image
      - codeql
      - gitleaks
      - dependency-review
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - name: Require the complete risk-relevant gate
        env:
          EVENT: ${{ github.event_name }}
          CLASSIFY: ${{ needs.classify.result }}
          PREFLIGHT: ${{ needs.preflight.result }}
          AUTOFIX: ${{ needs.autofix.result }}
          COMPILE: ${{ needs.compile.result }}
          CI: ${{ needs.ci.result }}
          DOCS: ${{ needs.docs.result }}
          ACTIONS_HYGIENE: ${{ needs.actions_hygiene.result }}
          E2E: ${{ needs.e2e.result }}
          REAL_STACK: ${{ needs.real-stack.result }}
          DATABASE: ${{ needs.database.result }}
          BACKEND_IMAGE: ${{ needs.backend-image.result }}
          CODEQL: ${{ needs.codeql.result }}
          GITLEAKS: ${{ needs.gitleaks.result }}
          DEPENDENCY_REVIEW: ${{ needs.dependency-review.result }}
        shell: bash
        run: |
          set -euo pipefail
          require_success_or_skip() {
            case "$2" in
              success|skipped) ;;
              *) echo "$1 did not pass: $2" >&2; exit 1 ;;
            esac
          }
          require_skipped() {
            test "$2" = skipped || { echo "$1 must be skipped in this event ($2)" >&2; exit 1; }
          }
          case "$EVENT" in
            push)
              test "$COMPILE" = success
              ;;
            pull_request)
              test "$CLASSIFY" = success
              require_success_or_skip PREFLIGHT "$PREFLIGHT"
              require_success_or_skip AUTOFIX "$AUTOFIX"
              require_success_or_skip CI "$CI"
              require_success_or_skip DOCS "$DOCS"
              require_success_or_skip ACTIONS_HYGIENE "$ACTIONS_HYGIENE"
              require_success_or_skip CODEQL "$CODEQL"
              require_success_or_skip GITLEAKS "$GITLEAKS"
              require_success_or_skip DEPENDENCY_REVIEW "$DEPENDENCY_REVIEW"
              require_skipped COMPILE "$COMPILE"
              require_skipped E2E "$E2E"
              require_skipped REAL_STACK "$REAL_STACK"
              require_skipped DATABASE "$DATABASE"
              require_skipped BACKEND_IMAGE "$BACKEND_IMAGE"
              ;;
            merge_group)
              test "$CLASSIFY" = success
              test "$PREFLIGHT" = success
              test "$COMPILE" = success
              test "$CI" = success
              require_success_or_skip DOCS "$DOCS"
              require_success_or_skip ACTIONS_HYGIENE "$ACTIONS_HYGIENE"
              test "$E2E" = success
              test "$REAL_STACK" = success
              test "$DATABASE" = success
              test "$BACKEND_IMAGE" = success
              test "$CODEQL" = success
              test "$GITLEAKS" = success
              require_success_or_skip AUTOFIX "$AUTOFIX"
              require_skipped DEPENDENCY_REVIEW "$DEPENDENCY_REVIEW"
              ;;
            *)
              echo "unexpected event: $EVENT" >&2
              exit 1
              ;;
          esac
