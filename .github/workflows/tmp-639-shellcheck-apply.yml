name: Temporary #639 ShellCheck ratchet validation

on:
  push:
    branches:
      - cleanup/639-shellcheck-ratchet
    paths:
      - .github/workflows/tmp-639-shellcheck-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.12.6'
      - name: Apply narrow ShellCheck ratchet
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          deploy = Path('scripts/deploy.sh')
          text = deploy.read_text()
          old = "git rev-parse --abbrev-ref @{upstream}"
          new = "git rev-parse --abbrev-ref '@{upstream}'"
          assert text.count(old) == 1
          deploy.write_text(text.replace(old, new, 1))

          check = Path('scripts/check.sh')
          text = check.read_text()
          marker = '''run_backend_sync() {
          '''
          assert text.count(marker) == 1
          shell_fn = '''run_shell_static() {
            echo ""
            echo "── Shell static checks ──"
            local started=$SECONDS
            local scripts=()
            mapfile -t scripts < <(git ls-files '*.sh')
            if [ "${#scripts[@]}" -eq 0 ]; then
              pass "shellcheck (no tracked shell scripts, $((SECONDS - started))s)"
            elif uvx --from shellcheck-py==0.11.0.1 shellcheck "${scripts[@]}"; then
              pass "shellcheck ($((SECONDS - started))s)"
            else
              fail "shellcheck ($((SECONDS - started))s)"
            fi
          }

          '''
          text = text.replace(marker, shell_fn + marker, 1)

          old_full = '''  full)
              run_backend_sync
              run_frontend_build
          '''
          new_full = '''  full)
              run_backend_sync
              run_shell_static
              run_frontend_build
          '''
          assert text.count(old_full) == 1
          text = text.replace(old_full, new_full, 1)

          old_fast = '''  fast)
              run_frontend_static
          '''
          new_fast = '''  fast)
              run_shell_static
              run_frontend_static
          '''
          assert text.count(old_fast) == 1
          text = text.replace(old_fast, new_fast, 1)

          old_usage = '''  full      Canonical local gate: build, lint, typecheck, architecture/API contracts,
                      backend/frontend tests, optional backend health, and Playwright.
            fast      Inner loop: lint, typecheck, architecture/API contracts, backend/frontend tests.
          '''
          new_usage = '''  full      Canonical local gate: build, lint, typecheck, shell/import architecture/API contracts,
                      backend/frontend tests, optional backend health, and Playwright.
            fast      Inner loop: lint, typecheck, shell/import architecture/API contracts, backend/frontend tests.
          '''
          assert text.count(old_usage) == 1
          check.write_text(text.replace(old_usage, new_usage, 1))
          PY

          mapfile -t scripts < <(git ls-files '*.sh')
          bash -n "${scripts[@]}"
          uvx --from shellcheck-py==0.11.0.1 shellcheck "${scripts[@]}"
          git diff --check
          uv sync --project backend --locked
          uv run --project backend --locked python -m pytest -q backend/tests/test_deploy_security.py

      - name: Commit validated ratchet
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/check.sh scripts/deploy.sh
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'ci: ratchet tracked shell scripts with ShellCheck'
          git push origin HEAD:cleanup/639-shellcheck-ratchet
