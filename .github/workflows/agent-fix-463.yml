name: Temporary #463 cache-race fix

on:
  push:
    branches:
      - feat/progressive-evidence-arrival
    paths:
      - .github/workflows/agent-fix-463.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/progressive-evidence-arrival
          fetch-depth: 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: package.json
          cache: npm
      - name: Apply workflow-commit cache invalidation regression fix
        run: |
          python - <<'PY'
          from pathlib import Path

          api = Path("lib/api-client.ts")
          text = api.read_text()
          old = '''  invalidateVersionWork(versionId);\n  return apiFetch<{ workflow: Workflow; job: Job }>("/api/v1/workflows/understand", {\n    method: "POST",\n    body: JSON.stringify({\n      version_id: versionId,\n      project_id: projectId,\n      ...(transcriptionProfile ? { transcription_profile: transcriptionProfile } : {}),\n    }),\n  });\n'''
          new = '''  // Invalidate before the mutation so an already-cached source-only bundle\n  // cannot mask workflow creation. Invalidate again after the server commits:\n  // selecting the Work can start a fetch while this POST is in flight, and that\n  // pre-commit response must not become the stable bundle after creation.\n  invalidateVersionWork(versionId);\n  const result = await apiFetch<{ workflow: Workflow; job: Job }>("/api/v1/workflows/understand", {\n    method: "POST",\n    body: JSON.stringify({\n      version_id: versionId,\n      project_id: projectId,\n      ...(transcriptionProfile ? { transcription_profile: transcriptionProfile } : {}),\n    }),\n  });\n  invalidateVersionWork(versionId);\n  return result;\n'''
          if text.count(old) != 1:
              raise SystemExit("understand workflow target changed; refusing blind patch")
          api.write_text(text.replace(old, new))

          test = Path("tests/lib/upload-work-invalidation.test.ts")
          text = test.read_text()
          marker = '''  it("preserves upload ownership when workflow start fails so a retry invalidates an in-flight source bundle", async () => {'''
          regression = '''  it("invalidates a source-only Work fetch that starts while workflow creation is in flight", async () => {\n    installUploadResult();\n    await uploadArtifact("project-1", new File(["audio"], "source.wav", { type: "audio/wav" }));\n\n    const workflow = deferred<{ workflow: object; job: object }>();\n    const stale = deferred<WorkBundle>();\n    let workFetches = 0;\n    mockApiFetch.mockImplementation(async (url, options) => {\n      if (url === "/api/v1/workflows/understand" && options?.method === "POST") {\n        return workflow.promise;\n      }\n      if (url === "/api/v1/works/work-1") {\n        workFetches += 1;\n        return workFetches === 1 ? stale.promise : sourceBundle("After workflow commit");\n      }\n      throw new Error(`Unexpected API call: ${url}`);\n    });\n\n    // Workflow creation has invalidated the previous generation, but the server\n    // has not committed the workflow yet. Selecting the newly uploaded Work can\n    // therefore legitimately start a source-only read in this window.\n    const workflowStart = startUnderstandWorkflow("source-1", "project-1", "auto");\n    const duringMutation = getWorkBundle("work-1");\n    expect(workFetches).toBe(1);\n\n    workflow.resolve({ workflow: {}, job: {} });\n    await workflowStart;\n\n    // Successful commit must invalidate the read that began during the POST, so\n    // the caller observes the active workflow instead of joining stale data.\n    const afterCommit = getWorkBundle("work-1");\n    expect(workFetches).toBe(2);\n    expect((await afterCommit).work.title).toBe("After workflow commit");\n\n    stale.resolve(sourceBundle("Before workflow commit"));\n    await duringMutation;\n    expect((await getWorkBundle("work-1")).work.title).toBe("After workflow commit");\n    expect(workFetches).toBe(2);\n  });\n\n'''
          if text.count(marker) != 1:
              raise SystemExit("test insertion target changed; refusing blind patch")
          test.write_text(text.replace(marker, regression + marker))
          PY
      - name: Install frontend dependencies
        run: npm ci
      - name: Verify focused cache regression
        run: npx vitest run tests/lib/upload-work-invalidation.test.ts
      - name: Commit verified patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- lib/api-client.ts tests/lib/upload-work-invalidation.test.ts
          git diff --cached --check
          git commit -m "fix: invalidate work cache after workflow commit"
          git push origin HEAD:feat/progressive-evidence-arrival
