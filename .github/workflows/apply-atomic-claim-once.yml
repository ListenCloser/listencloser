name: Apply atomic claim patch once

on:
  push:
    branches:
      - feat/platform-v3-atomic-job-claim
    paths:
      - '.github/workflows/apply-atomic-claim-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/platform-v3-atomic-job-claim
          fetch-depth: 0
      - name: Apply bounded patch
        run: |
          set -euo pipefail
          python scripts/apply_atomic_claim_patch_once.py
          python -m py_compile backend/domain/job_worker.py backend/tests/test_job_worker.py backend/tests/integration/test_atomic_job_claim.py
          git diff --check
      - name: Commit bounded patch and remove helpers
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- backend/domain/job_worker.py backend/tests/test_job_worker.py backend/tests/integration/test_atomic_job_claim.py supabase/migrations/202608280001_atomic_job_claim.sql
          git rm -- .github/workflows/apply-atomic-claim-once.yml scripts/apply_atomic_claim_patch_once.py
          git diff --cached --check
          git commit -m 'perf(queue): claim queued jobs atomically'
          git push origin HEAD:feat/platform-v3-atomic-job-claim
