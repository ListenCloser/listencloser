name: Apply atomic claim patch once

on:
  push:
    branches:
      - feat/platform-v3-atomic-job-claim
    paths:
      - '.github/workflows/apply-atomic-claim-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/platform-v3-atomic-job-claim
          fetch-depth: 0
      - name: Apply bounded patch
        run: |
          python - <<'PY'
          from pathlib import Path

          worker_path = Path('backend/domain/job_worker.py')
          text = worker_path.read_text()

          old = '''Uses the Supabase ``jobs`` table as the backing store with an atomic
          lease mechanism to ensure exactly-once processing across multiple worker
          instances.  No Redis, no Celery — just Postgres, threads, and polling.'''
          new = '''Uses the Supabase ``jobs`` table as the backing store with durable leases.
          Queue execution is at-least-once across worker crashes/recovery, so handlers must
          remain replay-safe/idempotent. No Redis, no Celery — just Postgres and threads.'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''    Polls the ``jobs`` table for ``queued`` rows, atomically claims them
              via an ``UPDATE … WHERE stage='queued'`` lease, and executes the
              matching capability handler in a thread pool.'''
          new = '''    Claims the oldest ``queued`` row through one Postgres RPC backed by
              ``FOR UPDATE SKIP LOCKED``, then executes the matching capability handler
              in a thread pool. Specific-id claims remain conditional and lease-protected.'''
          assert old in text
          text = text.replace(old, new, 1)

          marker = '''    def _mark_running(self, job_id: str) -> bool:
          '''
          assert marker in text
          method = '''    def _claim_next_job(self) -> dict | None:
              """Atomically claim and return the oldest queued job, if one exists.

              The database function selects and updates one row under
              ``FOR UPDATE SKIP LOCKED`` so concurrent workers do not all contend for
              the same queue head.
              """
              try:
                  result = self.client.rpc(
                      "claim_next_job",
                      {
                          "p_worker_id": self._worker_id,
                          "p_lease_seconds": self._lease_duration,
                      },
                  ).execute()
                  if result.data:
                      return result.data[0]
              except Exception:
                  logger.exception("claim_next_job_failed", extra={"worker_id": self._worker_id})
              return None

'''
          text = text.replace(marker, method + marker, 1)

          old = '''                job_row = self._poll_jobs() if has_capacity else None
                  if job_row is not None:
                      job_id = str(job_row["id"])
                      if self._claim_job(job_id):
                          with self._in_flight_lock:
                              self._in_flight.add(job_id)
                          future = executor.submit(self._execute_job, job_row, already_claimed=True)

                          def release_slot(_future, completed_job_id=job_id) -> None:
                              with self._in_flight_lock:
                                  self._in_flight.discard(completed_job_id)

                          future.add_done_callback(release_slot)
'''
          new = '''                job_row = self._claim_next_job() if has_capacity else None
                  if job_row is not None:
                      job_id = str(job_row["id"])
                      with self._in_flight_lock:
                          self._in_flight.add(job_id)
                      future = executor.submit(self._execute_job, job_row, already_claimed=True)

                      def release_slot(_future, completed_job_id=job_id) -> None:
                          with self._in_flight_lock:
                              self._in_flight.discard(completed_job_id)

                      future.add_done_callback(release_slot)
'''
          assert old in text
          text = text.replace(old, new, 1)
          worker_path.write_text(text)

          test_path = Path('backend/tests/test_job_worker.py')
          tests = test_path.read_text()
          marker = '''# ═══════════════════════════════════════════════════════════════════════════════
          # 2. Lease expiry / orphan recovery
          # ═══════════════════════════════════════════════════════════════════════════════
          '''
          assert marker in tests
          claim_tests = '''class TestClaimNextJob:
              def test_claim_next_job_uses_atomic_rpc(self, worker, mock_supabase):
                  job_row = make_job_row(stage="claimed", worker_id=worker._worker_id)
                  mock_supabase.rpc.return_value.execute.return_value = make_result([job_row])

                  claimed = worker._claim_next_job()

                  assert claimed == job_row
                  mock_supabase.rpc.assert_called_once_with(
                      "claim_next_job",
                      {
                          "p_worker_id": worker._worker_id,
                          "p_lease_seconds": worker._lease_duration,
                      },
                  )

              def test_claim_next_job_returns_none_for_empty_queue(self, worker, mock_supabase):
                  mock_supabase.rpc.return_value.execute.return_value = make_result([])

                  assert worker._claim_next_job() is None

              def test_claim_next_job_db_error_is_retryable_poll_miss(self, worker, mock_supabase):
                  mock_supabase.rpc.return_value.execute.side_effect = Exception("database unavailable")

                  assert worker._claim_next_job() is None


'''
          tests = tests.replace(marker, claim_tests + marker, 1)
          tests = tests.replace('patch.object(worker, "_poll_jobs", side_effect=_fake_poll)', 'patch.object(worker, "_claim_next_job", side_effect=_fake_poll)')
          tests = tests.replace('patch.object(worker, "_poll_jobs", side_effect=_stop_after_poll)', 'patch.object(worker, "_claim_next_job", side_effect=_stop_after_poll)')
          tests = tests.replace('patch.object(worker, "_poll_jobs", return_value=None)', 'patch.object(worker, "_claim_next_job", return_value=None)')
          assert tests.count('patch.object(worker, "_poll_jobs"') == 0
          test_path.write_text(tests)

          migration = '''-- Atomically claim the oldest queued job without queue-head collisions.
          -- Delivery remains at-least-once: expired leases are recovered and handlers must
          -- remain replay-safe/idempotent.
          begin;

          create or replace function public.claim_next_job(
            p_worker_id text,
            p_lease_seconds double precision default 30.0
          )
          returns setof public.jobs
          language sql
          security invoker
          set search_path = ''
          as $$
            with next_job as (
              select id
              from public.jobs
              where stage = 'queued'
              order by created_at, id
              for update skip locked
              limit 1
            )
            update public.jobs as jobs
            set stage = 'claimed',
                worker_id = p_worker_id,
                lease_expires_at = clock_timestamp()
                  + greatest(p_lease_seconds, 0.001) * interval '1 second'
            from next_job
            where jobs.id = next_job.id
              and jobs.stage = 'queued'
            returning jobs.*;
          $$;

          revoke all on function public.claim_next_job(text, double precision) from public;
          revoke all on function public.claim_next_job(text, double precision) from anon;
          revoke all on function public.claim_next_job(text, double precision) from authenticated;
          grant execute on function public.claim_next_job(text, double precision) to service_role;

          commit;
          '''
          Path('supabase/migrations/202608280001_atomic_job_claim.sql').write_text(migration)

          integration = '''from __future__ import annotations

          import os
          import subprocess
          from concurrent.futures import ThreadPoolExecutor
          from uuid import uuid4

          import pytest


          def _local_db_url() -> str:
              if db_url := os.environ.get("DB_URL"):
                  return db_url
              completed = subprocess.run(
                  ["supabase", "status", "-o", "env"],
                  check=True,
                  capture_output=True,
                  text=True,
              )
              for line in completed.stdout.splitlines():
                  if line.startswith("DB_URL="):
                      return line.split("=", 1)[1].strip().strip('"')
              raise RuntimeError("local Supabase status did not provide DB_URL")


          def _psql(db_url: str, sql: str) -> list[str]:
              completed = subprocess.run(
                  ["psql", db_url, "-X", "-qAt", "-v", "ON_ERROR_STOP=1", "-c", sql],
                  check=True,
                  capture_output=True,
                  text=True,
              )
              return [line for line in completed.stdout.splitlines() if line.strip()]


          @pytest.mark.real_stack
          def test_atomic_job_claim_skips_locked_queue_head() -> None:
              db_url = _local_db_url()
              suffix = uuid4().hex
              owner_id = str(uuid4())
              project_id = str(uuid4())
              workflow_id = str(uuid4())
              workers = [f"claim-test-{suffix}-{index}" for index in range(4)]

              _psql(
                  db_url,
                  f"""
                  insert into public.projects (id, owner_id, name)
                  values ('{project_id}', '{owner_id}', 'atomic claim test');
                  insert into public.workflows (id, project_id, kind)
                  values ('{workflow_id}', '{project_id}', 'understand');
                  insert into public.jobs (workflow_id, capability_name, capability_version)
                  select '{workflow_id}', 'test', '1.0' from generate_series(1, 4);
                  """,
              )
              try:
                  def claim(worker_id: str) -> str | None:
                      rows = _psql(
                          db_url,
                          "select id::text from public.claim_next_job("
                          f"'{worker_id}', 30.0);",
                      )
                      return rows[0] if rows else None

                  with ThreadPoolExecutor(max_workers=4) as executor:
                      claimed = list(executor.map(claim, workers))

                  assert all(claimed)
                  assert len(set(claimed)) == 4
                  assert claim("after-drain") is None

                  rows = _psql(
                      db_url,
                      f"select count(*) from public.jobs where workflow_id = '{workflow_id}' "
                      "and stage = 'claimed' and worker_id is not null and lease_expires_at > now();",
                  )
                  assert rows == ["4"]
              finally:
                  _psql(db_url, f"delete from public.projects where id = '{project_id}';")


          @pytest.mark.real_stack
          def test_atomic_job_claim_execute_privilege_is_service_role_only() -> None:
              db_url = _local_db_url()
              signature = "public.claim_next_job(text,double precision)"
              rows = _psql(
                  db_url,
                  "select "
                  f"has_function_privilege('service_role', '{signature}', 'EXECUTE'), "
                  f"has_function_privilege('authenticated', '{signature}', 'EXECUTE'), "
                  f"has_function_privilege('anon', '{signature}', 'EXECUTE');",
              )
              assert rows == ["t|f|f"]
          '''
          Path('backend/tests/integration/test_atomic_job_claim.py').write_text(integration)
          PY
          python -m py_compile backend/domain/job_worker.py backend/tests/test_job_worker.py backend/tests/integration/test_atomic_job_claim.py
          git diff --check
      - name: Commit bounded patch and remove helper
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- backend/domain/job_worker.py backend/tests/test_job_worker.py backend/tests/integration/test_atomic_job_claim.py supabase/migrations/202608280001_atomic_job_claim.sql
          git rm -- .github/workflows/apply-atomic-claim-once.yml
          git diff --cached --check
          git commit -m 'perf(queue): claim queued jobs atomically'
          git push origin HEAD:feat/platform-v3-atomic-job-claim
