name: Fix 1110 imports once

on:
  push:
    branches:
      - perf/1095-reuse-pulse-evidence

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: perf/1095-reuse-pulse-evidence
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: 0.12.6
      - name: Apply repository import fixer and publish
        shell: bash
        run: |
          set -euo pipefail
          uv sync --project backend --locked
          uv run --project backend ruff check --fix backend/tests/test_pulse_evidence_reuse.py
          uv run --project backend ruff format backend/tests/test_pulse_evidence_reuse.py
          rm .github/workflows/fix-1110-imports-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/tests/test_pulse_evidence_reuse.py .github/workflows/fix-1110-imports-once.yml
          git commit -m "style(perf): apply locked Ruff import fix"
          git push origin HEAD:perf/1095-reuse-pulse-evidence
