name: Deploy Backend

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'backend/Dockerfile'
      - 'backend/docker-compose.yml'
      - '.github/workflows/deploy-backend.yml'
      - 'scripts/deploy.sh'
      - 'supabase/migrations/**'

concurrency:
  group: deploy-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migrate:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.39.2
      - name: Apply and verify database migrations
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_DB_URL" || { echo "SUPABASE_DB_URL secret is required"; exit 1; }
          supabase db push --db-url "$SUPABASE_DB_URL"
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          fi
          job_columns="$(psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -Atc \
            "select count(*) from information_schema.columns where table_schema='public' and table_name='jobs' and column_name in ('workflow_id','capability_name','stage','lease_expires_at','output_version_ids')")"
          test "$job_columns" = "5" || { echo "durable jobs schema verification failed"; exit 1; }
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -Atc \
            "select to_regclass('public.worker_heartbeats') is not null" | grep -qx t

  deploy:
    needs: migrate
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.ORACLE_VM_HOST }}
          username: ${{ secrets.ORACLE_VM_USER }}
          key: ${{ secrets.ORACLE_VM_SSH_KEY }}
          envs: SUPABASE_URL,SUPABASE_SERVICE_ROLE_KEY,SUPABASE_ANON_KEY,SENTRY_DSN_BACKEND,SENTRY_ENV
          script: |
            set -euo pipefail
            if [ -f ~/hello-ai/scripts/deploy.sh ]; then
              sudo chmod +x ~/hello-ai/scripts/deploy.sh
              ~/hello-ai/scripts/deploy.sh
            else
              echo "[deploy] first boot — cloning repo"
              git clone https://github.com/gr-rr/hello-ai.git ~/hello-ai
              sudo chmod +x ~/hello-ai/scripts/deploy.sh
              ~/hello-ai/scripts/deploy.sh
            fi
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SENTRY_DSN_BACKEND: ${{ secrets.SENTRY_DSN_BACKEND }}
          SENTRY_ENV: ${{ vars.SENTRY_ENV || 'production' }}
