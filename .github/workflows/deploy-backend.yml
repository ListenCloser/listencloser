name: Deploy Backend

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'backend/Dockerfile'
      - 'backend/docker-compose.yml'
      - '.github/workflows/deploy-backend.yml'
      - 'scripts/deploy.sh'
      - 'supabase/migrations/**'

concurrency:
  group: deploy-backend-${{ github.ref }}
  # Never terminate an SSH deployment between container switch and health gate.
  cancel-in-progress: false

jobs:
  migrate:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.113.0
      - name: Apply and verify database migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          supabase link --project-ref cijhpddqvvzyzfzmkdnn
          supabase db push --linked --password "$SUPABASE_DB_PASSWORD"
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          fi
          psql "postgresql://postgres:${SUPABASE_DB_PASSWORD}@db.cijhpddqvvzyzfzmkdnn.supabase.co:5432/postgres" -f scripts/verify_database.sql

  deploy:
    needs: migrate
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.ORACLE_VM_HOST }}
          username: ${{ secrets.ORACLE_VM_USER }}
          key: ${{ secrets.ORACLE_VM_SSH_KEY }}
          envs: SUPABASE_URL,SUPABASE_SERVICE_ROLE_KEY,SUPABASE_ANON_KEY,SENTRY_DSN_BACKEND,SENTRY_ENV,DEPLOY_SHA
          script: |
            set -euo pipefail
            if [ ! -d ~/hello-ai/.git ]; then
              echo "[deploy] first boot — cloning repo"
              git clone https://github.com/gr-rr/hello-ai.git ~/hello-ai
              export DEPLOY_PREVIOUS_SHA=""
            else
              export DEPLOY_PREVIOUS_SHA="$(cd ~/hello-ai && git rev-parse HEAD)"
            fi
            cd ~/hello-ai
            git fetch --quiet origin main
            git cat-file -e "${DEPLOY_SHA}^{commit}"
            git reset --hard "$DEPLOY_SHA"
            test "$(git rev-parse HEAD)" = "$DEPLOY_SHA"
            sudo chmod +x scripts/deploy.sh
            exec scripts/deploy.sh
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SENTRY_DSN_BACKEND: ${{ secrets.SENTRY_DSN_BACKEND }}
          SENTRY_ENV: ${{ vars.SENTRY_ENV || 'production' }}
          DEPLOY_SHA: ${{ github.sha }}
