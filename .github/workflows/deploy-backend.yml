name: Deploy Backend

# POST-TRANSITION (2026-08-18): automatic backend deployment restored.
# The one-time migration-history correction has succeeded and its workflow
# was deleted. Steady-state deploy = `supabase link` + `supabase db push`
# only. Migration history is never mutated here and applied migrations are
# never force-replayed.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'backend/Dockerfile'
      - 'backend/docker-compose.yml'
      - '.github/workflows/deploy-backend.yml'
      - 'scripts/deploy.sh'
      - 'supabase/migrations/**'

concurrency:
  group: deploy-backend-${{ github.ref }}
  # Never terminate an SSH deployment between container switch and health gate.
  cancel-in-progress: false

jobs:
  migrate:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.113.0
      - name: Apply and verify database migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          # Steady-state deploy invariant: migration history is never mutated
          # here. `db push` applies only genuinely pending migrations; already
          # applied migrations stay applied. The one-time 2026-08-18 history
          # correction for the 20260716/20260728 rename transition has
          # completed and its workflow was removed; it must not be
          # re-introduced during steady-state deploys.
          supabase link --project-ref cijhpddqvvzyzfzmkdnn
          supabase db push --linked --password "$SUPABASE_DB_PASSWORD"

  deploy:
    needs: migrate
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.ORACLE_VM_HOST }}
          username: ${{ secrets.ORACLE_VM_USER }}
          key: ${{ secrets.ORACLE_VM_SSH_KEY }}
          envs: SUPABASE_URL,SUPABASE_SERVICE_ROLE_KEY,SUPABASE_ANON_KEY,SENTRY_DSN_BACKEND,SENTRY_ENV,DEPLOY_SHA
          script: |
            set -euo pipefail
            if [ ! -d ~/hello-ai/.git ]; then
              echo "[deploy] first boot — cloning repo"
              git clone https://github.com/gr-rr/hello-ai.git ~/hello-ai
              export DEPLOY_PREVIOUS_SHA=""
            else
              export DEPLOY_PREVIOUS_SHA="$(cd ~/hello-ai && git rev-parse HEAD)"
            fi
            cd ~/hello-ai
            git fetch --quiet origin main
            git cat-file -e "${DEPLOY_SHA}^{commit}"
            git reset --hard "$DEPLOY_SHA"
            test "$(git rev-parse HEAD)" = "$DEPLOY_SHA"
            sudo chmod +x scripts/deploy.sh
            exec scripts/deploy.sh
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SENTRY_DSN_BACKEND: ${{ secrets.SENTRY_DSN_BACKEND }}
          SENTRY_ENV: ${{ vars.SENTRY_ENV || 'production' }}
          DEPLOY_SHA: ${{ github.sha }}
