name: Deploy Backend

# Zero-cost deployment path:
# - classify backend runtime separately from database/Storage releases
# - build the production image once on free GitHub-hosted runners when runtime changes
# - publish arch-specific images to GHCR
# - apply Supabase migrations/bucket config without rebuilding an unchanged runtime
# - deploy the exact git SHA to Oracle without rebuilding on the VM
# - keep the existing VM build path as a migration/rollback fallback

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '!backend/evaluation/**'
      - '!backend/tests/**'
      - 'backend/Dockerfile'
      - 'backend/docker-compose.yml'
      - '.github/workflows/deploy-backend.yml'
      - 'scripts/classify_production_scope.py'
      - 'scripts/deploy.sh'
      - 'scripts/deploy-preflight.sh'
      - 'supabase/config.toml'
      - 'supabase/migrations/**'

concurrency:
  group: deploy-backend-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}-backend

jobs:
  scope:
    name: Classify release scope
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.scope.outputs.backend }}
      database: ${{ steps.scope.outputs.database }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Classify backend and database release requirements
        id: scope
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            backend=true
            database=true
          else
            before="${{ github.event.before }}"
            changed="$(mktemp)"
            trap 'rm -f "$changed"' EXIT

            if [[ -z "$before" || "$before" =~ ^0+$ ]]; then
              git show --pretty='' --name-only "$GITHUB_SHA" >"$changed"
            else
              git diff --name-only --no-renames "$before" "$GITHUB_SHA" >"$changed"
            fi

            echo "Changed paths:"
            sed 's/^/  - /' "$changed"
            release_scope="$(python3 scripts/classify_production_scope.py --production-scope <"$changed")"
            backend=false
            database=false
            if grep -qx 'backend' <<<"$release_scope"; then
              backend=true
            fi
            if grep -qx 'database' <<<"$release_scope"; then
              database=true
            fi
          fi

          # GitHub concurrency may replace a pending database-only run with a newer
          # backend run. Reconcile Supabase on every runtime deployment so checked-in
          # migrations cannot be stranded by event-level release classification.
          if [[ "$backend" == "true" ]]; then
            database=true
          fi

          echo "backend=$backend" >>"$GITHUB_OUTPUT"
          echo "database=$database" >>"$GITHUB_OUTPUT"
          echo "Release scope: backend=$backend database=$database"

  publish-image:
    name: Publish backend image (${{ matrix.arch }})
    needs: scope
    if: needs.scope.outputs.backend == 'true'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Log in to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Build exact-SHA image natively
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          image_name="$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')"
          image_ref="${image_name}:${GITHUB_SHA}-${ARCH}"
          docker build \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --tag "$image_ref" \
            backend
          docker push "$image_ref"
          echo "Published $image_ref"

  migrate:
    needs: [scope, publish-image]
    if: >-
      ${{ always()
          && needs.scope.outputs.database == 'true'
          && (needs.publish-image.result == 'success' || needs.publish-image.result == 'skipped') }}
    permissions:
      contents: read
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.113.0
      - name: Apply database migrations and Storage bucket config
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          supabase link --project-ref cijhpddqvvzyzfzmkdnn
          # Merge queue can land independently authored migration timestamps out of order.
          # Apply every missing history entry rather than rejecting older pending migrations.
          supabase db push --linked --include-all --password "$SUPABASE_DB_PASSWORD"
          supabase seed buckets --linked

      - name: Enforce Google-only hosted Auth contract
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: cijhpddqvvzyzfzmkdnn
        shell: bash
        run: |
          set -euo pipefail
          endpoint="https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/config/auth"

          read_auth_config() {
            curl --fail --silent --show-error \
              --header "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
              "$endpoint"
          }

          read_bool() {
            local key="$1"
            local value
            value="$(
              jq -r --arg key "$key" \
                'if has($key) and (.[$key] | type == "boolean") then (.[$key] | tostring) else "invalid" end' \
                <<<"$auth_config"
            )"
            if [[ "$value" != "true" && "$value" != "false" ]]; then
              echo "Hosted Auth config did not expose boolean ${key}; refusing to mutate provider state." >&2
              return 1
            fi
            printf '%s' "$value"
          }

          auth_config="$(read_auth_config)"
          google_enabled="$(read_bool external_google_enabled)"
          email_enabled="$(read_bool external_email_enabled)"
          signup_disabled="$(read_bool disable_signup)"

          if [[ "$google_enabled" != "true" ]]; then
            echo "Google OAuth is not enabled; refusing to change hosted Auth configuration." >&2
            exit 1
          fi
          if [[ "$signup_disabled" != "false" ]]; then
            echo "Global signup is disabled; refusing to risk first-time Google OAuth onboarding." >&2
            exit 1
          fi

          echo "Hosted Auth before sync: google=${google_enabled} email=${email_enabled} global_signup=true"
          if [[ "$email_enabled" == "true" ]]; then
            curl --fail --silent --show-error \
              --request PATCH \
              --header "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
              --header 'Content-Type: application/json' \
              --data '{"external_email_enabled":false}' \
              "$endpoint" >/dev/null
          fi

          auth_config="$(read_auth_config)"
          google_enabled="$(read_bool external_google_enabled)"
          email_enabled="$(read_bool external_email_enabled)"
          signup_disabled="$(read_bool disable_signup)"
          if [[ "$google_enabled" != "true" || "$email_enabled" != "false" || "$signup_disabled" != "false" ]]; then
            echo "Hosted Auth contract verification failed after sync." >&2
            exit 1
          fi
          echo "Hosted Auth verified: google=true email=false global_signup=true"

  deploy:
    needs: [scope, publish-image, migrate]
    if: >-
      ${{ always()
          && needs.scope.outputs.backend == 'true'
          && needs.publish-image.result == 'success'
          && (needs.scope.outputs.database != 'true' || needs.migrate.result == 'success') }}
    permissions:
      contents: read
      packages: read
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Deploy exact image via SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.ORACLE_VM_HOST }}
          username: ${{ secrets.ORACLE_VM_USER }}
          key: ${{ secrets.ORACLE_VM_SSH_KEY }}
          command_timeout: 18m
          envs: SUPABASE_URL,SUPABASE_SERVICE_ROLE_KEY,SUPABASE_ANON_KEY,SENTRY_DSN_BACKEND,SENTRY_ENV,DEPLOY_SHA,LLM_BASE_URL,LLM_API_KEY,LLM_MODEL,OTEL_EXPORTER_OTLP_ENDPOINT,OTEL_EXPORTER_OTLP_HEADERS,BACKEND_IMAGE_REPOSITORY,GHCR_USERNAME,GHCR_TOKEN
          script: |
            set -euo pipefail
            if [ ! -d ~/hello-ai/.git ]; then
              echo "[deploy] first boot — cloning repo"
              git clone https://github.com/gr-rr/hello-ai.git ~/hello-ai
              export DEPLOY_PREVIOUS_SHA=""
            else
              export DEPLOY_PREVIOUS_SHA="$(cd ~/hello-ai && git rev-parse HEAD)"
            fi
            cd ~/hello-ai
            git fetch --quiet origin main
            git cat-file -e "${DEPLOY_SHA}^{commit}"
            git reset --hard "$DEPLOY_SHA"
            test "$(git rev-parse HEAD)" = "$DEPLOY_SHA"
            sudo chmod +x scripts/deploy-preflight.sh scripts/deploy.sh
            scripts/deploy-preflight.sh
            exec scripts/deploy.sh
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SENTRY_DSN_BACKEND: ${{ secrets.SENTRY_DSN_BACKEND }}
          SENTRY_ENV: ${{ vars.SENTRY_ENV || 'production' }}
          DEPLOY_SHA: ${{ github.sha }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}
          OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}
          BACKEND_IMAGE_REPOSITORY: ${{ env.IMAGE_NAME }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  verify-production:
    needs: [scope, deploy]
    if: needs.scope.outputs.backend == 'true' && needs.deploy.result == 'success'
    permissions:
      contents: read
    uses: ./.github/workflows/production-verify.yml
    secrets:
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
