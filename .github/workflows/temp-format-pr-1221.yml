name: Temporary format PR 1221

on:
  push:
    branches:
      - agent/1179-production-spatial-lens

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: 0.12.9
      - name: Apply locked Ruff formatter
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          uv sync --project backend --locked
          backend/.venv/bin/ruff format backend/domain/production_spatial_capability.py backend/production_spatial.py
          if git diff --quiet -- backend/domain/production_spatial_capability.py backend/production_spatial.py; then
            echo 'Already formatted.'
            exit 0
          fi
          git add backend/domain/production_spatial_capability.py backend/production_spatial.py
          git commit -m 'fix(ci): format production spatial implementation'
          git push origin HEAD:${GITHUB_REF_NAME}
