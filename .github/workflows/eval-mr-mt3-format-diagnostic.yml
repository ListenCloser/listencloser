name: MR-MT3 formatter diagnostic

on:
  push:
    branches:
      - eval/mr-mt3-format-diagnostic
    paths:
      - '.github/workflows/eval-mr-mt3-format-diagnostic.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: '.python-version'
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.12.6'
          enable-cache: true
          cache-dependency-glob: 'backend/uv.lock'
      - name: Sync locked backend
        run: uv sync --project backend --locked
      - name: Persist exact Ruff formatter output
        shell: bash
        run: |
          set -euo pipefail
          cd backend
          uv run ruff format evaluation/analysis_v3/multitrack_transcription/persistent_runtime.py
          git diff --check
          git diff -- evaluation/analysis_v3/multitrack_transcription/persistent_runtime.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add evaluation/analysis_v3/multitrack_transcription/persistent_runtime.py
          git commit -m 'chore(eval): apply exact Ruff formatter'
          git push origin HEAD:eval/mr-mt3-format-diagnostic
