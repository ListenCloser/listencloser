name: Repair #1215 source-position synchronization

on:
  push:
    branches:
      - "integrate/1082-score-source-fresh-main"

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Synchronize source swap before attached-score assertion
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/e2e/real-stack-golden.spec.ts")
          text = path.read_text()
          old = '''    await page.getByRole("tab", { name: "Score" }).click();
              await selectSource(page, "Original");
              const positionBeforeSourceScore = await transportPosition(page);

              await attachSourceScore(page);
          '''
          new = '''    await page.getByRole("tab", { name: "Score" }).click();
              const positionBeforeOriginalSourceSwap = await transportPosition(page);
              await selectSource(page, "Original");
              await expectPositionPreserved(page, positionBeforeOriginalSourceSwap);
              const positionBeforeSourceScore = await transportPosition(page);

              await attachSourceScore(page);
          '''
          # The triple-quoted indentation above includes this workflow's YAML
          # indentation. Normalize it to the actual TypeScript source block.
          old = old.replace("              ", "    ")
          new = new.replace("              ", "    ")
          if old not in text:
              raise SystemExit("target source block not found exactly")
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check
      - name: Commit repair and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/repair-1215-source-position.yml
          git add tests/e2e/real-stack-golden.spec.ts
          git commit -m "Synchronize source switch before score attachment assertion"
          git push origin HEAD:"integrate/1082-score-source-fresh-main"
