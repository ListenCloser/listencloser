name: Temporary sync PR 1221 into PR 1219

on:
  push:
    branches:
      - agent/1178-symbolic-detail

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/1178-symbolic-detail
          fetch-depth: 0
      - name: Merge current Production Spatial parent
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin agent/1179-production-spatial-lens
          git merge --no-edit origin/agent/1179-production-spatial-lens
          git push origin HEAD:agent/1178-symbolic-detail
