name: Reconcile #1228 with current main

on:
  push:
    branches:
      - "feat/588-rhythm-density-breakdown-context"

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: package.json
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc
        with:
          version: "0.12.9"
      - name: Merge current main and resolve generated-only conflicts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          set +e
          git merge --no-commit --no-ff origin/main
          merge_status=$?
          set -e
          if [ "$merge_status" -ne 0 ]; then
            unresolved="$(git diff --name-only --diff-filter=U)"
            echo "Unresolved paths:"
            printf '%s\n' "$unresolved"
            unexpected="$(printf '%s\n' "$unresolved" | grep -Ev '^(openapi/openapi\.json|lib/api-types\.ts|docs/generated/frontend-dependencies\.md)$' || true)"
            if [ -n "$unexpected" ]; then
              echo "Unexpected semantic conflicts; refusing automatic resolution:" >&2
              printf '%s\n' "$unexpected" >&2
              exit 1
            fi
            for path in openapi/openapi.json lib/api-types.ts docs/generated/frontend-dependencies.md; do
              if git ls-files -u -- "$path" | grep -q .; then
                git checkout --ours -- "$path"
                git add "$path"
              fi
            done
          fi
          test -z "$(git diff --name-only --diff-filter=U)"
      - run: npm ci
      - run: uv sync --project backend --locked
      - name: Regenerate combined OpenAPI and TypeScript contract
        run: |
          npm run api:generate
          git add openapi/openapi.json lib/api-types.ts
      - name: Regenerate combined frontend dependency graph
        run: |
          out="$(mktemp -d)"
          npx --yes --package=dependency-cruiser@18.2.0 --package=typescript@5.7.3 depcruise \
            --config .dependency-cruiser.cjs \
            --output-type mermaid \
            --include-only '^(app|components|lib)/' \
            --collapse 2 \
            --output-to "$out/frontend-dependencies.mmd" \
            app components lib
          {
            cat <<'EOF'
          # Frontend dependency graph

          > Generated by dependency-cruiser 18.2.0 with TypeScript 5.7.3 from `.dependency-cruiser.cjs`. Do not hand-edit this graph; regenerate it through the architecture check when frontend imports change.

          This is an orientation view of `app/`, `components/`, and `lib/`. Deeper folders are collapsed to keep the graph reviewable. The architecture rules in `.dependency-cruiser.cjs`, not the picture alone, are the enforceable contract.

          ```mermaid
          EOF
            cat "$out/frontend-dependencies.mmd"
            echo '```'
          } > docs/generated/frontend-dependencies.md
          git add docs/generated/frontend-dependencies.md
          git diff --check --cached
      - name: Commit reconciliation and remove helper
        run: |
          git rm .github/workflows/reconcile-1228-main.yml
          git add -A
          git commit -m "Reconcile rhythm-density context with current main"
          git push origin HEAD:"feat/588-rhythm-density-breakdown-context"
