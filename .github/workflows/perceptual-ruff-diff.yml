name: Perceptual Ruff Diff

on:
  pull_request:
    branches: [main]
    paths:
      - "backend/evaluation/analysis_v3/perceptual/features.py"
      - "backend/tests/test_perceptual_evidence.py"
      - ".github/workflows/perceptual-ruff-diff.yml"

permissions:
  contents: read

jobs:
  ruff-diff:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: 0.12.6
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --project backend --locked
      - name: Show Ruff check fixes
        run: |
          cd backend
          uv run ruff check evaluation/analysis_v3/perceptual/features.py tests/test_perceptual_evidence.py --fix --diff || true
      - name: Show Ruff formatter diff
        run: |
          cd backend
          uv run ruff format evaluation/analysis_v3/perceptual/features.py tests/test_perceptual_evidence.py --diff || true
