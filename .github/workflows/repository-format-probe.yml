name: Repository Format Probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    if: github.event.pull_request.number == 1105
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6.0.0
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.12.6'
      - name: Sync locked backend environment
        run: uv sync --project backend --locked
      - name: Print exact Ruff formatter diff
        run: uv run --project backend ruff format --diff backend/domain/repositories/evidence.py backend/domain/repositories/workflows_jobs.py
