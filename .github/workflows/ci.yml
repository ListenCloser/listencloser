name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - '*.md'
      - 'docs/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Typecheck (frontend)
        run: npm run typecheck
      - uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.6'
          enable-cache: true
          cache-dependency-glob: 'backend/uv.lock'
      - name: Sync locked backend environment
        run: uv sync --project backend --locked
      - name: Ruff (Python)
        working-directory: backend
        run: |
          uv run ruff check . --output-format=github
          uv run ruff format . --check
      - name: Run required Python unit tests
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          uv run --project backend python -m pytest backend/tests/ -m "not integration and not real_stack and not benchmark and not external_provider" -v
