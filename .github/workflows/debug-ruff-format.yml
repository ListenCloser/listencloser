name: Debug Ruff Format

on:
  pull_request:
    paths:
      - "backend/evaluation/analysis_v3/audio_language/**"
      - "backend/tests/test_analysis_v3_audio_language.py"
      - ".github/workflows/debug-ruff-format.yml"

jobs:
  diff:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.6"
      - run: uv sync --locked
      - name: Print canonical Ruff diff
        run: |
          uv run ruff format evaluation/analysis_v3/audio_language tests/test_analysis_v3_audio_language.py
          git diff -- evaluation/analysis_v3/audio_language tests/test_analysis_v3_audio_language.py
          test -z "$(git status --short -- evaluation/analysis_v3/audio_language tests/test_analysis_v3_audio_language.py)"
