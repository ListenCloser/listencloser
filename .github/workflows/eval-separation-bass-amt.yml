name: Separation Bass AMT Downstream Probe

on:
  push:
    branches:
      - eval/separation-bass-amt-v2
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  babyslakh-bass-amt:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: '.python-version'
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.12.6'
          enable-cache: true
          cache-dependency-glob: 'backend/uv.lock'
      - name: Sync locked backend
        run: uv sync --project backend --locked
      - name: Add evaluation-only Demucs package
        run: uv pip install --python backend/.venv/bin/python 'demucs==4.1.0'
      - name: Run fixed BabySlakh separation-to-bass-AMT gate
        env:
          MUSIC_EVAL_CACHE_DIR: ${{ runner.temp }}/music-eval-cache
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/backend
        run: |
          backend/.venv/bin/python -m backend.evaluation.analysis_v3.separation.run_bass_amt \
            --device cpu \
            --excerpt-seconds 30 \
            --output backend/evaluation/analysis_v3/separation/results/bass_amt_babyslakh_v2.json
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: separation-bass-amt-result
          path: backend/evaluation/analysis_v3/separation/results/bass_amt_babyslakh_v2.json
          if-no-files-found: warn
          retention-days: 7
