name: Apply PR 1070 execution boundary

on:
  push:
    branches:
      - backend/1070-sync-route-boundary
    paths:
      - .github/workflows/repair-1070-sync-boundary.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: backend/1070-sync-route-boundary
          fetch-depth: 1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version-file: .python-version

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: 0.12.6

      - name: Apply explicit sync/async route boundaries
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          persistence_modules = (
              "backend/domain/api/projects_works.py",
              "backend/domain/api/artifacts_versions.py",
              "backend/domain/api/evidence.py",
              "backend/domain/api/workflows_jobs.py",
              "backend/domain/relation_api.py",
              "backend/domain/upload_api.py",
          )

          artifacts = Path("backend/domain/api/artifacts_versions.py")
          text = artifacts.read_text()
          async_read = "raw = await file.read(max_upload_bytes + 1)"
          sync_read = "raw = file.file.read(max_upload_bytes + 1)"
          if async_read in text:
              if text.count(async_read) != 1:
                  raise SystemExit("expected at most one UploadFile async read")
              text = text.replace(async_read, sync_read)
          elif text.count(sync_read) != 1:
              raise SystemExit("expected one UploadFile read boundary")
          artifacts.write_text(text)

          for filename in persistence_modules:
              path = Path(filename)
              text = re.sub(r"^async def ", "def ", path.read_text(), flags=re.MULTILINE)
              if re.search(r"\bawait\b", text):
                  raise SystemExit(f"unexpected await remains in persistence-only router {filename}")
              path.write_text(text)

          ask = Path("backend/ask/api.py")
          text = ask.read_text()
          import_anchor = "from fastapi import APIRouter, Depends, HTTPException, Request\n"
          threadpool_import = "from starlette.concurrency import run_in_threadpool\n"
          if threadpool_import not in text:
              if text.count(import_anchor) != 1:
                  raise SystemExit("unexpected Ask import shape")
              text = text.replace(import_anchor, import_anchor + threadpool_import)

          work_lookup = "work = WorkRepo(sb).get(body.context.workId, owner_id)"
          work_offload = (
              "work = await run_in_threadpool("
              "WorkRepo(sb).get, body.context.workId, owner_id)"
          )
          if work_lookup in text:
              if text.count(work_lookup) != 1:
                  raise SystemExit("unexpected Ask Work lookup shape")
              text = text.replace(work_lookup, work_offload)
          elif text.count(work_offload) != 1:
              raise SystemExit("expected one Ask Work threadpool boundary")

          context_lookup = "canonical_context = load_canonical_ask_context(sb, body.context)"
          context_offload = (
              "canonical_context = await run_in_threadpool("
              "load_canonical_ask_context, sb, body.context)"
          )
          if context_lookup in text:
              if text.count(context_lookup) != 1:
                  raise SystemExit("unexpected Ask evidence lookup shape")
              text = text.replace(context_lookup, context_offload)
          elif text.count(context_offload) != 1:
              raise SystemExit("expected one Ask evidence threadpool boundary")
          ask.write_text(text)

          Path("backend/tests/test_api_execution_boundary.py").write_text(
              '''"""FastAPI execution-boundary invariants for synchronous persistence clients."""\n\nfrom __future__ import annotations\n\nimport importlib\nimport inspect\n\nfrom ask.api import create_ask\n\nPERSISTENCE_MODULES = (\n    "domain.api.projects_works",\n    "domain.api.artifacts_versions",\n    "domain.api.evidence",\n    "domain.api.workflows_jobs",\n    "domain.relation_api",\n    "domain.upload_api",\n)\n\n\ndef test_persistence_router_endpoints_are_sync() -> None:\n    async_endpoints = []\n    for module_name in PERSISTENCE_MODULES:\n        router = importlib.import_module(module_name).router\n        async_endpoints.extend(\n            route.endpoint.__name__\n            for route in router.routes\n            if inspect.iscoroutinefunction(route.endpoint)\n        )\n    assert async_endpoints == []\n\n\ndef test_ask_keeps_real_async_provider_boundary_and_offloads_sync_reads() -> None:\n    assert inspect.iscoroutinefunction(create_ask)\n    assert inspect.getsource(create_ask).count("await run_in_threadpool(") == 2\n'''
          )
          PY

          uv sync --project backend --locked
          (
            cd backend
            files=(
              ask/api.py
              domain/api/projects_works.py
              domain/api/artifacts_versions.py
              domain/api/evidence.py
              domain/api/workflows_jobs.py
              domain/relation_api.py
              domain/upload_api.py
              tests/test_api_execution_boundary.py
            )
            uv run ruff check --fix "${files[@]}"
            uv run ruff format "${files[@]}"
            uv run ruff check "${files[@]}"
            uv run ruff format --check "${files[@]}"
            uv run pytest -q tests/test_api_execution_boundary.py
          )

          rm .github/workflows/repair-1070-sync-boundary.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            backend/ask/api.py \
            backend/domain/api/projects_works.py \
            backend/domain/api/artifacts_versions.py \
            backend/domain/api/evidence.py \
            backend/domain/api/workflows_jobs.py \
            backend/domain/relation_api.py \
            backend/domain/upload_api.py \
            backend/tests/test_api_execution_boundary.py \
            .github/workflows/repair-1070-sync-boundary.yml
          git commit -m "fix(api): make persistence execution boundary explicit"
          git push origin HEAD:backend/1070-sync-route-boundary
