name: Temporary sync CLaMP3 with main

on:
  push:
    branches:
      - feat/1254-clamp3-text-passage

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Merge current main and preserve CLaMP3 registrations
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          if ! git merge --no-commit --no-ff origin/main; then
            conflicts=$(git diff --name-only --diff-filter=U)
            expected=$'backend/domain/api/router.py\nbackend/worker.py'
            if [ "$conflicts" != "$expected" ]; then
              echo "Unexpected conflicts:"
              printf '%s\n' "$conflicts"
              exit 1
            fi
            git checkout --theirs backend/domain/api/router.py backend/worker.py
            python - <<'PY'
          from pathlib import Path

          router = Path('backend/domain/api/router.py')
          text = router.read_text()
          imp = 'from domain.api.text_passage_find import router as text_passage_find_router\n'
          if imp not in text:
              anchor = 'from domain.api.projects_works import router as projects_works_router\n'
              text = text.replace(anchor, anchor + imp)
          include = 'router.include_router(text_passage_find_router)\n'
          if include not in text:
              text += include
          router.write_text(text)

          worker = Path('backend/worker.py')
          text = worker.read_text()
          imp = 'from domain.text_passage_find_capability import register_text_passage_find_capability\n'
          if imp not in text:
              anchor = 'from domain.structure_map_capability import register_structure_map_capability\n'
              text = text.replace(anchor, anchor + imp)
          register = '    register_text_passage_find_capability(worker)\n'
          if register not in text:
              anchor = '    register_harmony_interpretation_capability(worker)\n'
              text = text.replace(anchor, anchor + register)
          worker.write_text(text)
          PY
            git add backend/domain/api/router.py backend/worker.py
          fi
          git rm .github/workflows/temp-probe-clamp3-main-sync.yml
          git add -A
          git commit -m 'merge main into CLaMP3 text passage lane'
          git push origin HEAD:feat/1254-clamp3-text-passage
