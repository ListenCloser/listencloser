name: Database Integration

on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'backend/domain/**'
      - 'backend/music_features.py'
      - 'backend/tests/integration/**'
      - 'scripts/verify_database.sql'
      - '.github/workflows/database-integration.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'backend/domain/**'
      - 'backend/music_features.py'
      - 'backend/tests/integration/**'
      - 'scripts/verify_database.sql'

concurrency:
  group: database-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.113.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Start local Supabase and apply every migration from zero
        run: |
          set -euo pipefail
          supabase start
          supabase db reset
      - name: Verify database schema contracts (SQL)
        run: |
          set -euo pipefail
          eval "$(supabase status -o env | grep '^DB_URL=')"
          psql "$DB_URL" -f scripts/verify_database.sql
      - name: Install backend dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install -r backend/requirements.txt
      - name: Run backend integration tests against the fresh database
        run: |
          set -euo pipefail
          eval "$(supabase status -o env)"
          # The CLI exposes these under version-dependent names; normalize to the
          # names the backend/backend tests expect.
          export SUPABASE_URL="${SUPABASE_URL:-${API_URL:-http://127.0.0.1:54321}}"
          export SUPABASE_SERVICE_ROLE_KEY="${SUPABASE_SERVICE_ROLE_KEY:-${SERVICE_ROLE_KEY}}"
          export SUPABASE_ANON_KEY="${SUPABASE_ANON_KEY:-${ANON_KEY}}"
          python -m pytest backend/tests/integration -m integration -v
      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup || true
