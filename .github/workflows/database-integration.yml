name: Database Integration

on:
  workflow_call:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/tests/**'
      - 'backend/domain/**'
      - 'backend/music_features.py'
      - 'backend/tests/integration/**'
      - 'backend/tests/test_rls_domain.py'
      - 'backend/pyproject.toml'
      - 'backend/uv.lock'
      - 'scripts/verify_database.sql'

concurrency:
  group: database-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.113.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: '.python-version'
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.12.6'
          enable-cache: true
          cache-dependency-glob: 'backend/uv.lock'
      - name: Start fresh local Supabase and apply every migration
        run: |
          set -euo pipefail
          # Hosted runners start with no local Supabase database. `supabase start`
          # creates it and applies the migration history once; immediately running
          # `db reset` repeats the same destructive bootstrap and has intermittently
          # failed with Docker exit 125 while containers are still settling.
          supabase start
      - name: Verify database schema contracts (SQL)
        run: |
          set -euo pipefail
          eval "$(supabase status -o env | grep '^DB_URL=')"
          psql "$DB_URL" -f scripts/verify_database.sql
      - name: Verify RLS policies with pgTAP
        run: supabase test db
      - name: Sync locked backend environment
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          uv sync --project backend --locked
      - name: Run backend integration tests against the fresh database
        run: |
          set -euo pipefail
          eval "$(supabase status -o env)"
          # The CLI exposes these under version-dependent names; normalize to the
          # names the backend/backend tests expect.
          export SUPABASE_URL="${SUPABASE_URL:-${API_URL:-http://127.0.0.1:54321}}"
          export SUPABASE_SERVICE_ROLE_KEY="${SUPABASE_SERVICE_ROLE_KEY:-${SERVICE_ROLE_KEY}}"
          export SUPABASE_ANON_KEY="${SUPABASE_ANON_KEY:-${ANON_KEY}}"
          uv run --project backend python -m pytest backend/tests/ -m real_stack -v
      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup || true
