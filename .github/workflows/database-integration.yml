name: Database Integration

on:
  workflow_call:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/tests/**'
      - 'supabase/tbls.yml'
      - 'docs/generated/database/**'
      - 'backend/domain/**'
      - 'backend/music_features.py'
      - 'backend/tests/integration/**'
      - 'backend/pyproject.toml'
      - 'backend/uv.lock'
      - 'scripts/check-database.sh'

permissions:
  contents: read

concurrency:
  group: database-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.113.0
      - uses: k1LoW/setup-tbls@f25e3d013a596865b2db90dac7ee19e9f15b5780 # v1.4.0
        with:
          version: v1.95.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: '.python-version'
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.12.6'
          enable-cache: true
          cache-dependency-glob: 'backend/uv.lock'
      - name: Install system dependencies for backend integration tests
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Run canonical database verification
        run: bash scripts/check-database.sh
