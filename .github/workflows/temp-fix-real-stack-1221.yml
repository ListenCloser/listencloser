name: Temporary fix real-stack locator for PR 1221

on:
  push:
    branches:
      - agent/1179-production-spatial-lens

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/1179-production-spatial-lens
      - name: Disambiguate shared Add analysis control in real-stack
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/e2e/real-stack-golden.spec.ts')
          text = path.read_text()
          old = '''    const addAnalysis = page.getByRole("region", { name: "Add analysis" });
              await expect(addAnalysis.getByRole("button", { name: "+ Add analysis", exact: true })).toBeVisible();
              await addAnalysis.getByRole("button", { name: "+ Add analysis", exact: true }).click();'''
          old = old.replace('              await', '    await')
          new = '''    const addAnalysis = page.getByRole("region", { name: "Add analysis" });
              const sharedAddAnalysisButton = addAnalysis.getByRole("button", { name: "+ Add analysis", exact: true }).first();
              await expect(sharedAddAnalysisButton).toBeVisible();
              await sharedAddAnalysisButton.click();'''
          new = new.replace('              const', '    const').replace('              await', '    await')
          if old not in text:
              raise SystemExit('expected real-stack Add analysis block not found')
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/e2e/real-stack-golden.spec.ts
          git commit -m "fix(ci): disambiguate shared Add analysis in real-stack"
          git push origin HEAD:agent/1179-production-spatial-lens
