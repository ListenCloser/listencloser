name: Temporary lightweight backend dependency resolver

# Temporary characterization only; delete before opening the implementation PR.
on:
  push:
    branches: [devex/backend-worker-dependency-group-287]
    paths:
      - '.github/workflows/temp-backend-base-resolver-287.yml'

permissions:
  contents: write

jobs:
  resolve-lightweight:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: '.python-version'
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.12.6'
          enable-cache: true
      - name: Resolve canonical lock and sync lightweight environment
        shell: bash
        run: |
          set -euo pipefail
          uv lock --project backend
          rm -rf backend/.venv
          started="$(python -c 'import time; print(time.time())')"
          uv sync --project backend --locked --no-group worker
          ended="$(python -c 'import time; print(time.time())')"
          export SYNC_SECONDS="$(python - "$started" "$ended" <<'PY'
          import sys
          print(round(float(sys.argv[2]) - float(sys.argv[1]), 3))
          PY
          )"
          export PACKAGES="$(backend/.venv/bin/python - <<'PY'
          import importlib.metadata
          print(len(list(importlib.metadata.distributions())))
          PY
          )"
          export VENV_BYTES="$(du -sb backend/.venv | cut -f1)"
          backend/.venv/bin/python - <<'PY'
          import importlib.util
          import supabase_auth

          heavy = ['basic_pitch', 'beat_this', 'torch', 'torchaudio', 'transkun', 'moduleconf', 'lv_chordia']
          leaked = [name for name in heavy if importlib.util.find_spec(name) is not None]
          if leaked:
              raise SystemExit(f'worker modules leaked into lightweight environment: {leaked}')
          assert supabase_auth
          PY
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          Path('docs/generated/backend-dependency-base.json').write_text(json.dumps({
              'schema_version': 1,
              'issue': 287,
              'runner': 'ubuntu-24.04-arm',
              'sync_seconds': float(os.environ['SYNC_SECONDS']),
              'installed_distributions': int(os.environ['PACKAGES']),
              'venv_bytes': int(os.environ['VENV_BYTES']),
              'baseline_observed_pre_split': {
                  'installed_distributions': 163,
                  'uv_cache_bytes_approx': 865_000_000,
              },
              'worker_group_excluded': True,
              'expected_shared_transitive_modules': ['soxr via librosa'],
          }, indent=2, sort_keys=True) + '\n')
          PY
      - name: Run required unit suite without worker group
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          uv run --project backend --no-group worker python -m pytest backend/tests/ -m "not integration and not real_stack and not benchmark and not external_provider" -q
      - name: Persist lock and lightweight measurement
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/uv.lock docs/generated/backend-dependency-base.json
          git commit -m 'chore: lock lightweight backend dependency split'
          git push origin HEAD:devex/backend-worker-dependency-group-287
