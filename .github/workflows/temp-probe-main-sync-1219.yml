name: Temporary reconcile Symbolic Detail 1219

on:
  push:
    branches:
      - agent/1178-symbolic-detail

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Merge current main and compose worker registrations
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'listencloser-ci'
          git config user.email 'listencloser-ci@users.noreply.github.com'
          git fetch origin main
          if ! git merge --no-commit --no-ff origin/main; then
            conflicts=$(git diff --name-only --diff-filter=U)
            if [ "$conflicts" != "backend/worker.py" ]; then
              echo "Unexpected conflicts:"
              printf '%s\n' "$conflicts"
              exit 1
            fi
            git checkout --theirs backend/worker.py
            python - <<'PY'
          from pathlib import Path
          path = Path('backend/worker.py')
          text = path.read_text()
          import_line = 'from domain.symbolic_detail_capability import register_symbolic_detail_capability\n'
          if import_line not in text:
              anchor = 'from domain.structure_map_capability import register_structure_map_capability\n'
              if anchor not in text:
                  raise SystemExit('symbolic worker import anchor missing')
              text = text.replace(anchor, anchor + import_line, 1)
          register_line = '    register_symbolic_detail_capability(worker)\n'
          if register_line not in text:
              anchor = '    register_structure_map_capability(worker)\n'
              if anchor not in text:
                  raise SystemExit('symbolic worker registration anchor missing')
              text = text.replace(anchor, anchor + register_line, 1)
          path.write_text(text)
          PY
            git add backend/worker.py
          fi
          rm .github/workflows/temp-probe-main-sync-1219.yml
          git add -A
          git diff --check --cached
          git commit --no-edit
          git push origin HEAD:agent/1178-symbolic-detail
