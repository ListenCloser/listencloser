name: Temporary probe main sync 1219

on:
  push:
    branches:
      - agent/1178-symbolic-detail

permissions:
  contents: read

jobs:
  probe:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Probe merge with current main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'listencloser-sync-probe'
          git config user.email 'sync-probe@users.noreply.github.com'
          git fetch origin main
          if git merge --no-commit --no-ff origin/main; then
            echo MERGE_CLEAN
            git diff --check
            exit 0
          fi
          echo CONFLICTS
          git diff --name-only --diff-filter=U
          git status --short
          exit 1
