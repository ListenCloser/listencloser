name: Issue 812 real-music recurrence probe

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'backend/evaluation/issue_812_recurrence_probe.py'
      - '.github/workflows/issue-812-recurrence-probe.yml'

permissions:
  contents: read

concurrency:
  group: issue-812-recurrence-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    name: real-music-probe
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: '.python-version'
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.12.6'
          enable-cache: true
          cache-dependency-glob: 'backend/uv.lock'
      - name: Sync locked backend environment
        run: uv sync --project backend --locked
      - name: Install audio decoder
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Run frozen issue 812 probe
        env:
          PYTHONPATH: backend
        run: >-
          uv run --project backend python
          backend/evaluation/issue_812_recurrence_probe.py
          --output issue-812-probe-output
      - name: Show machine-readable result
        run: cat issue-812-probe-output/results.json
      - name: Upload result and audition clips
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: issue-812-recurrence-probe
          path: issue-812-probe-output
          if-no-files-found: error
          retention-days: 7
