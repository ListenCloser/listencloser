name: Repair PR 1037 Ruff formatting

on:
  push:
    branches:
      - codex/651-pgmq-cutover
    paths:
      - .github/workflows/repair-1037-ruff.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: codex/651-pgmq-cutover
          fetch-depth: 1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version-file: .python-version

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: 0.12.6

      - name: Apply exact repository formatter and remove repair workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          uv sync --project backend --locked
          (
            cd backend
            uv run ruff format tests/integration/test_pgmq_job_delivery.py
            uv run ruff check tests/integration/test_pgmq_job_delivery.py
            uv run ruff format tests/integration/test_pgmq_job_delivery.py --check
          )

          rm .github/workflows/repair-1037-ruff.yml

          mapfile -t changed < <(git status --short | awk '{print $2}')
          printf 'Changed files after repair:\n'
          printf '  %s\n' "${changed[@]}"
          if [[ "${#changed[@]}" -ne 2 ]]; then
            echo "Expected only PGMQ integration test plus self-deleting workflow"
            exit 1
          fi
          printf '%s\n' "${changed[@]}" | grep -Fxq 'backend/tests/integration/test_pgmq_job_delivery.py'
          printf '%s\n' "${changed[@]}" | grep -Fxq '.github/workflows/repair-1037-ruff.yml'

          git add backend/tests/integration/test_pgmq_job_delivery.py .github/workflows/repair-1037-ruff.yml
          git commit -m "style(queue): apply locked Ruff formatting"
          git push origin HEAD:codex/651-pgmq-cutover
