name: Regenerate API contract once

on:
  push:
    branches:
      - feat/platform-v3-direct-artifact-upload
    paths:
      - '.github/workflows/regenerate-api-once.yml'

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/platform-v3-direct-artifact-upload
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: 0.12.6
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install dependencies
        run: |
          npm ci
          uv sync --project backend --locked
      - name: Regenerate and commit API contract
        run: |
          set -euo pipefail
          npm run api:generate
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- openapi/openapi.json lib/api-types.ts
          git rm -- .github/workflows/regenerate-api-once.yml
          git diff --cached --check
          git commit -m 'chore(api): regenerate upload contract'
          git push origin HEAD:feat/platform-v3-direct-artifact-upload
