name: Structure SongFormBench BC8 All-In-One

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/eval-structure-songformbench-bc8-allin1.yml'
      - 'backend/evaluation/analysis_v3/structure/**'
      - 'backend/evaluation/structure_metrics.py'
      - 'backend/evaluation/models.py'
      - 'backend/tests/test_structure_*.py'

permissions:
  contents: read

concurrency:
  group: structure-songformbench-bc8-allin1-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  bc8-allin1:
    name: songformbench-bc8-allin1
    if: github.event.pull_request.head.ref == 'eval-structure-songformbench-bc8-allin1'
    timeout-minutes: 180
    runs-on: ubuntu-latest
    env:
      SFB_REPO: ASLP-lab/SongFormBench
      SFB_REVISION: acd574ecbf666be535b0d051b71936f6ec9956ec
      ALLIN1_COMMIT: c04f37609e2c7ba5d3b333d6d69a7e3c429dafc9
      MADMOM_COMMIT: 27f032e8947204902c675e5e341a3faf5dc86dae
      STRUCTURE_ALLIN1_MODEL: harmonix-all

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.12.6'
          enable-cache: true

      - name: Prepare research paths
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/structure-bc8"
          mkdir -p "$root/dataset" "$root/results" "$root/provenance"
          echo "STRUCTURE_ROOT=$root" >> "$GITHUB_ENV"
          echo "AIO_VENV=$root/allin1-venv" >> "$GITHUB_ENV"
          echo "HF_HOME=$root/hf-home" >> "$GITHUB_ENV"
          echo "TORCH_HOME=$root/torch-home" >> "$GITHUB_ENV"

      - name: Install pinned All-In-One research environment
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg libsndfile1

          uv venv "$AIO_VENV" --python 3.11
          python_bin="$AIO_VENV/bin/python"

          uv pip install --python "$python_bin" \
            --index-url https://download.pytorch.org/whl/cpu \
            'torch==2.5.0+cpu' \
            'torchaudio==2.5.0+cpu'

          uv pip install --python "$python_bin" \
            'natten==0.17.4+torch250cpu' \
            -f https://whl.natten.org/old

          uv pip install --python "$python_bin" \
            "git+https://github.com/CPJKU/madmom@${MADMOM_COMMIT}" \
            "git+https://github.com/mir-aidj/all-in-one@${ALLIN1_COMMIT}" \
            'mir_eval==0.8.2'

          "$python_bin" - <<'PY'
          import allin1
          import natten
          import torch

          print('torch', torch.__version__)
          print('natten', natten.__version__)
          print('allin1', getattr(allin1, '__version__', 'unknown'))
          PY

      - name: Record machine and environment
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '## uname'
            uname -a
            echo
            echo '## cpu'
            lscpu
            echo
            echo '## memory'
            free -h
            echo
            echo '## python'
            "$AIO_VENV/bin/python" --version
            echo
            echo '## packages'
            uv pip freeze --python "$AIO_VENV/bin/python"
          } > "$STRUCTURE_ROOT/provenance/environment.txt"

      - name: Acquire pinned SongFormBench index
        shell: bash
        run: |
          set -euo pipefail
          "$AIO_VENV/bin/python" - <<'PY'
          import os
          from huggingface_hub import hf_hub_download

          root = os.environ['STRUCTURE_ROOT'] + '/dataset'
          path = hf_hub_download(
              repo_id=os.environ['SFB_REPO'],
              repo_type='dataset',
              revision=os.environ['SFB_REVISION'],
              filename='data/SongFormBench.jsonl',
              local_dir=root,
          )
          print(path)
          PY

      - name: Freeze deterministic BC8 selection
        shell: bash
        run: |
          set -euo pipefail
          cd backend
          "$AIO_VENV/bin/python" -m evaluation.analysis_v3.structure.datasets.songformbench_subset \
            --index "$STRUCTURE_ROOT/dataset/data/SongFormBench.jsonl" \
            --subset BC \
            --count 8 \
            --upstream-revision "$SFB_REVISION" \
            --output-index "$STRUCTURE_ROOT/provenance/songformbench-bc8.jsonl" \
            --provenance "$STRUCTURE_ROOT/provenance/songformbench-bc8-selection.json"

      - name: Acquire exact BC8 dataset-published audio and hash it
        shell: bash
        run: |
          set -euo pipefail
          "$AIO_VENV/bin/python" - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          from huggingface_hub import hf_hub_download

          root = Path(os.environ['STRUCTURE_ROOT'])
          dataset_root = root / 'dataset'
          selected = [
              json.loads(line)
              for line in (root / 'provenance/songformbench-bc8.jsonl').read_text().splitlines()
              if line.strip()
          ]

          def sha256(path: Path) -> str:
              digest = hashlib.sha256()
              with path.open('rb') as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b''):
                      digest.update(chunk)
              return digest.hexdigest()

          files = []
          for entry in selected:
              relative = str(entry['audio_path'])
              downloaded = Path(
                  hf_hub_download(
                      repo_id=os.environ['SFB_REPO'],
                      repo_type='dataset',
                      revision=os.environ['SFB_REVISION'],
                      filename=relative,
                      local_dir=str(dataset_root),
                  )
              )
              files.append(
                  {
                      'source_id': entry['id'],
                      'relative_path': relative,
                      'sha256': sha256(downloaded),
                      'size_bytes': downloaded.stat().st_size,
                  }
              )

          provenance = {
              'schema_version': 1,
              'dataset': os.environ['SFB_REPO'],
              'dataset_revision': os.environ['SFB_REVISION'],
              'acquisition': 'huggingface_dataset_published_audio',
              'semantic_audio_provenance': 'local_unknown',
              'files': files,
          }
          destination = root / 'provenance/songformbench-bc8-audio.json'
          destination.write_text(json.dumps(provenance, indent=2) + '\n')
          print(json.dumps(provenance, indent=2))
          PY

      - name: Build fixed BC8 manifest
        shell: bash
        run: |
          set -euo pipefail
          cd backend
          "$AIO_VENV/bin/python" -m evaluation.analysis_v3.structure.datasets.songformbench \
            --index "$STRUCTURE_ROOT/provenance/songformbench-bc8.jsonl" \
            --audio-dir "$STRUCTURE_ROOT/dataset" \
            --subset BC \
            --audio-provenance local_unknown \
            --output "$STRUCTURE_ROOT/provenance/songformbench-bc8-manifest.json"

      - name: Run All-In-One on identical BC8 manifest
        shell: bash
        run: |
          set -euo pipefail
          cd backend
          "$AIO_VENV/bin/python" -m evaluation.analysis_v3.structure.run \
            --candidate allin1 \
            --manifest "$STRUCTURE_ROOT/provenance/songformbench-bc8-manifest.json" \
            --device cpu \
            --output-dir "$STRUCTURE_ROOT/results"

      - name: Record downloaded model artifacts
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          "$AIO_VENV/bin/python" - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path(os.environ['STRUCTURE_ROOT'])
          suffixes = {'.pth', '.pt', '.th', '.bin', '.safetensors'}

          def sha256(path: Path) -> str:
              digest = hashlib.sha256()
              with path.open('rb') as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b''):
                      digest.update(chunk)
              return digest.hexdigest()

          rows = []
          for cache_name, cache_root in (
              ('hf_home', Path(os.environ['HF_HOME'])),
              ('torch_home', Path(os.environ['TORCH_HOME'])),
          ):
              if not cache_root.exists():
                  continue
              for path in sorted(cache_root.rglob('*')):
                  if not path.is_file() or path.suffix.lower() not in suffixes:
                      continue
                  rows.append(
                      {
                          'cache': cache_name,
                          'relative_path': str(path.relative_to(cache_root)),
                          'sha256': sha256(path),
                          'size_bytes': path.stat().st_size,
                      }
                  )

          provenance = {
              'allin1_git_commit': os.environ['ALLIN1_COMMIT'],
              'madmom_git_commit': os.environ['MADMOM_COMMIT'],
              'configured_checkpoint': os.environ['STRUCTURE_ALLIN1_MODEL'],
              'artifacts': rows,
          }
          destination = root / 'provenance/allin1-model-artifacts.json'
          destination.write_text(json.dumps(provenance, indent=2) + '\n')
          print(json.dumps(provenance, indent=2))
          PY

      - name: Require complete 8-of-8 evidence
        shell: bash
        run: |
          set -euo pipefail
          "$AIO_VENV/bin/python" - <<'PY'
          import json
          import os
          from pathlib import Path

          results = list((Path(os.environ['STRUCTURE_ROOT']) / 'results').glob('allin1_*.json'))
          if len(results) != 1:
              raise SystemExit(f'expected exactly one All-In-One result, found {len(results)}')
          payload = json.loads(results[0].read_text())
          aggregate = payload.get('aggregate', {})
          rows = payload.get('rows', [])

          assert payload.get('status') == 'completed', payload
          assert aggregate.get('clips_total') == 8, aggregate
          assert aggregate.get('clips_scored') == 8, aggregate
          assert len(rows) == 8, len(rows)
          assert all(row.get('status') == 'scored' for row in rows), rows
          assert all(row.get('evaluation_validity') == 'no_declared_overlap' for row in rows), rows
          print(json.dumps(payload, indent=2))
          PY

      - name: Print machine-readable outputs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            "$STRUCTURE_ROOT"/provenance/*.json \
            "$STRUCTURE_ROOT"/results/*.json; do
            [ -e "$file" ] || continue
            echo "===== $file ====="
            cat "$file"
          done

      - name: Upload evaluation evidence (no audio)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: structure-songformbench-bc8-allin1-${{ github.event.pull_request.head.sha }}
          path: |
            ${{ runner.temp }}/structure-bc8/provenance/**
            ${{ runner.temp }}/structure-bc8/results/*.json
          if-no-files-found: warn
          retention-days: 14
