name: Refresh API contract for 1181

on:
  push:
    branches:
      - feat/1181-supplied-text-alignment
    paths:
      - .github/workflows/refresh-api-contract-1181.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/1181-supplied-text-alignment
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.12.9'
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: npm ci
      - run: uv sync --project backend --locked
      - run: npm run api:generate
      - name: Commit generated contract
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add openapi/openapi.json lib/api-types.ts
          git commit -m "chore: refresh generated API contract"
          git push origin HEAD:feat/1181-supplied-text-alignment
