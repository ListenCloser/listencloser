name: Temporary C2 format tail

on:
  push:
    branches:
      - feat/1254-clamp3-text-passage

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: 0.12.9
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --project backend --locked
      - name: Format exact tail
        run: |
          uv run --project backend --locked ruff format \
            backend/engines/retrieval/clamp3_c2.py \
            backend/tests/test_text_passage_find_workflow.py
          uv run --project backend --locked ruff check \
            backend/engines/retrieval/clamp3_c2.py \
            backend/tests/test_text_passage_find_workflow.py
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet -- backend/engines/retrieval/clamp3_c2.py backend/tests/test_text_passage_find_workflow.py; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/engines/retrieval/clamp3_c2.py backend/tests/test_text_passage_find_workflow.py
          git commit -m "style(find): canonicalize C2 tail"
          git push origin HEAD:${GITHUB_REF_NAME}
