name: Temporary Similar Moments Formatter

on:
  push:
    branches:
      - feat/812-similar-moments

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/812-similar-moments
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - name: Apply repository Ruff formatting
        run: |
          python -m pip install --disable-pip-version-check ruff==0.5.7
          ruff format \
            backend/domain/relation_api.py \
            backend/domain/similar_moments.py \
            backend/domain/similar_moments_contract.py \
            backend/tests/test_similar_moments.py
      - name: Commit formatting only
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            backend/domain/relation_api.py \
            backend/domain/similar_moments.py \
            backend/domain/similar_moments_contract.py \
            backend/tests/test_similar_moments.py
          git commit -m "style(similar-moments): apply ruff formatting"
          git push origin HEAD:feat/812-similar-moments
