name: Issue 1179 browser integration

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  integrate:
    if: github.head_ref == 'agent/1179-production-spatial-lens'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: agent/1179-production-spatial-lens
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - name: Wire isolated mock overlay and real-stack acceptance
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if new in text:
                  return
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one patch anchor, found {count}")
              file.write_text(text.replace(old, new, 1))

          replace_once(
              "app/_test-support/msw/handlers.ts",
              'import { sampleWavBase64, sampleWavOutputBase64 } from "@/app/_test-support/msw/fixtures/sample-wav";\n',
              'import { sampleWavBase64, sampleWavOutputBase64 } from "@/app/_test-support/msw/fixtures/sample-wav";\nimport {\n  productionSpatialHandlers,\n  productionSpatialReportArtifact,\n  productionSpatialReportReady,\n} from "@/app/_test-support/msw/production-spatial";\n',
          )
          replace_once(
              "app/_test-support/msw/handlers.ts",
              'export const handlers = [\n',
              'export const handlers = [\n  ...productionSpatialHandlers,\n',
          )
          replace_once(
              "app/_test-support/msw/handlers.ts",
              '      item("mock-rendered-score-version", "rendered_score", `data:audio/wav;base64,${sampleWavOutputBase64}`, { measure_starts_seconds: measureStartsSeconds }),\n    ];',
              '      item("mock-rendered-score-version", "rendered_score", `data:audio/wav;base64,${sampleWavOutputBase64}`, { measure_starts_seconds: measureStartsSeconds }),\n      ...(productionSpatialReportReady()\n        ? [productionSpatialReportArtifact(now, sourceVersionId)]\n        : []),\n    ];',
          )

          inspector = Path("components/workspace/inspector/Inspector.tsx")
          text = inspector.read_text()
          text = text.replace(
              '      <MeasuredChanges />\n        <ProductionSpatial />\n      <PassageCompare />',
              '      <MeasuredChanges />\n      <ProductionSpatial />\n      <PassageCompare />',
          )
          inspector.write_text(text)

          real_stack = Path("tests/e2e/real-stack-golden.spec.ts")
          text = real_stack.read_text()
          marker = '''\n  // ── Annotations and Inspector ────────────────────────────────────────\n'''
          if 'test.step("experimental production / space"' not in text:
              if text.count(marker) != 1:
                  raise SystemExit("real-stack-golden.spec.ts: acceptance insertion marker drifted")
              block = '''\n  // ── Experimental Production / Space ─────────────────────────────────\n  await test.step("experimental production / space", async () => {\n    await page.getByRole("tab", { name: "Breakdown" }).click();\n    const inspector = page.locator("aside.inspector");\n    const lens = inspector.getByRole("region", { name: "Production and spatial analysis" });\n    await expect(lens).toBeVisible({ timeout: 20_000 });\n    await lens.getByRole("button", { name: "+ Add analysis", exact: true }).click();\n    await expect(lens.getByText("Production / Space", { exact: true })).toBeVisible();\n    await expect(lens.getByText("Experimental", { exact: true })).toBeVisible();\n    await lens.getByRole("button", { name: "Add", exact: true }).click();\n\n    // This is the real API -> durable job -> worker -> storage -> Work bundle\n    // path. The fixture is allowed to be mono; stereo mid/side truthfulness is\n    // covered separately by the focused backend stereo control.\n    await expect(lens.getByText("Spectral centroid", { exact: true })).toBeVisible({\n      timeout: 180_000,\n    });\n    await expect(lens.getByText("Onset strength", { exact: true })).toBeVisible();\n    await expect(lens.getByText(/Mid\/side evidence is unavailable|Side energy share/)).toBeVisible();\n\n    const spectral = lens.locator("article").filter({ hasText: "Spectral centroid" });\n    await spectral.getByText("Method", { exact: true }).click();\n    await expect(spectral.getByText(/librosa spectral centroid mean per fixed window/)).toBeVisible();\n    await expect(spectral.getByText(/Source Version:/)).toBeVisible();\n    await spectral.getByRole("button", { name: "Inspect", exact: true }).click();\n    await expect(inspector.getByRole("button", { name: "Clear selection" })).toBeVisible({\n      timeout: 10_000,\n    });\n  });\n'''
              real_stack.write_text(text.replace(marker, f"{block}{marker}", 1))
      - name: Regenerate frontend dependency authority
        run: npx tsx scripts/architecture/generate-frontend-dependencies.ts
      - name: Run frontend static checks
        run: |
          npm run lint
          npm run typecheck
          npx tsx scripts/architecture/generate-frontend-dependencies.ts --check
      - name: Commit integration edits
        run: |
          if git diff --quiet; then
            echo "No browser integration changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/_test-support/msw/handlers.ts components/workspace/inspector/Inspector.tsx \
            docs/generated/frontend-dependencies.md tests/e2e/real-stack-golden.spec.ts
          git commit -m "test: integrate production spatial browser coverage"
          git push origin HEAD:agent/1179-production-spatial-lens
