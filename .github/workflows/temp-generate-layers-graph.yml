name: Temporary generate Layers dependency graph

on:
  push:
    branches:
      - feat/1176-layers-current-main

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: package.json
          cache: npm
      - name: Generate exact dependency graph and self-clean
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'listencloser-ci'
          git config user.email 'listencloser-ci@users.noreply.github.com'
          npm ci
          out=$(mktemp -d)
          npx --yes --package=dependency-cruiser@18.2.0 --package=typescript@5.7.3 depcruise \
            --config .dependency-cruiser.cjs \
            --output-type mermaid \
            --include-only '^(app|components|lib)/' \
            --collapse 2 \
            --output-to "$out/frontend-dependencies.mmd" \
            app components lib
          {
            cat <<'EOF'
          # Frontend dependency graph

          > Generated by dependency-cruiser 18.2.0 with TypeScript 5.7.3 from `.dependency-cruiser.cjs`. Do not hand-edit this graph; regenerate it through the architecture check when frontend imports change.

          This is an orientation view of `app/`, `components/`, and `lib/`. Deeper folders are collapsed to keep the graph reviewable. The architecture rules in `.dependency-cruiser.cjs`, not the picture alone, are the enforceable contract.

          ```mermaid
          EOF
            cat "$out/frontend-dependencies.mmd"
            echo '```'
          } > docs/generated/frontend-dependencies.md
          rm .github/workflows/temp-generate-layers-graph.yml
          git diff --check
          git add docs/generated/frontend-dependencies.md .github/workflows/temp-generate-layers-graph.yml
          git commit -m 'chore(ci): regenerate Layers dependency graph'
          git push origin HEAD:feat/1176-layers-current-main
