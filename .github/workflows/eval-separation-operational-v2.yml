name: Separation HTDemucs CPU Operational Probe

on:
  push:
    branches:
      - eval/separation-operational-v2
    paths:
      - '.github/workflows/eval-separation-operational-v2.yml'
      - 'backend/evaluation/analysis_v3/separation/run_operational_v2.py'
      - 'backend/tests/test_analysis_v3_separation_operational.py'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cpu-operational:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: '.python-version'
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.12.6'
          enable-cache: true
          cache-dependency-glob: 'backend/uv.lock'
      - name: Sync locked backend
        run: uv sync --project backend --locked
      - name: Add evaluation-only Demucs package
        run: uv pip install --python backend/.venv/bin/python 'demucs==4.1.0'
      - name: Run focused helper tests
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/backend
        run: |
          backend/.venv/bin/python -m pytest \
            backend/tests/test_analysis_v3_separation_operational.py -q
      - name: Run 10s/30s/180s CPU operational gate
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/backend
        run: |
          backend/.venv/bin/python -m backend.evaluation.analysis_v3.separation.run_operational_v2 \
            --device cpu \
            --output backend/evaluation/analysis_v3/separation/results/operational_cpu_v2.json
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: separation-operational-cpu-result
          path: backend/evaluation/analysis_v3/separation/results/operational_cpu_v2.json
          if-no-files-found: warn
          retention-days: 7
