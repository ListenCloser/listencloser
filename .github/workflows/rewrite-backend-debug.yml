name: Temporary backend rewrite diagnostic

on:
  push:
    branches: [rewrite/monorepo-foundation]
    paths: [.github/workflows/rewrite-backend-debug.yml]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: '.python-version'
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.12.9'
          enable-cache: true
          cache-dependency-glob: 'backend/uv.lock'
      - run: uv sync --project backend --locked
      - run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Run backend tests and annotate failure
        shell: bash
        run: |
          set +e
          (cd backend && uv run --project . --locked python -m pytest tests/ -v --tb=short --durations=20 --durations-min=1.0) 2>&1 | tee /tmp/pytest.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            python3 - <<'PY'
          from pathlib import Path
          text = Path('/tmp/pytest.log').read_text(errors='replace')
          marker = '=================================== FAILURES ==================================='
          if marker in text:
              text = text[text.index(marker):]
          else:
              text = '\n'.join(text.splitlines()[-180:])
          text = '\n'.join(text.splitlines()[:220])
          text = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print(f'::error title=Flattened backend pytest failure::{text}')
          PY
          fi
          exit "$status"
