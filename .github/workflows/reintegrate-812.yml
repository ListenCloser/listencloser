name: reintegrate-812

on:
  push:
    branches:
      - feat/812-similar-moments

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Probe merge conflicts
        shell: bash
        run: |
          set -uo pipefail
          git config user.name "812 reintegration probe"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin main
          set +e
          git merge --no-commit --no-ff origin/main
          status=$?
          set -e
          echo "merge_status=$status"
          echo "conflicts:"
          git diff --name-only --diff-filter=U
          echo "status:"
          git status --short
          git merge --abort || true
          exit "$status"
