name: reintegrate-812-prep

on:
  push:
    branches:
      - reintegrate/812-similar-moments

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.12.9'
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Replay bounded #812 implementation onto current main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ListenCloser delivery agent"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin feat/812-similar-moments
          git checkout origin/feat/812-similar-moments -- \
            'app/api/v1/works/[work_id]/relations/similar-moments/route.ts' \
            backend/domain/api_schemas.py \
            backend/domain/similar_moments.py \
            backend/domain/similar_moments_contract.py \
            backend/domain/similar_moments_query.py \
            backend/tests/test_similar_moments.py \
            backend/tests/test_similar_moments_api.py \
            backend/tests/test_similar_moments_query.py \
            components/workspace/inspector/SimilarMoments.tsx \
            tests/components/SimilarMoments.test.tsx

          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f"expected exactly one match in {path}: {old!r}; got {text.count(old)}")
              p.write_text(text.replace(old, new, 1))

          path = "backend/domain/relation_api.py"
          replace_once(path, "from pydantic import BaseModel\n", "from pydantic import BaseModel, Field\n")
          replace_once(
              path,
              "from domain.api_schemas import PerceptualSpanComparisonResponse\n",
              "from domain.api_schemas import PerceptualSpanComparisonResponse, SimilarMomentsResponse\n",
          )
          replace_once(
              path,
              "from domain.repositories import get_supabase\n",
              "from domain.repositories import get_supabase\nfrom domain.similar_moments_contract import MAX_MATCHES\n",
          )
          replace_once(
              path,
              "    comparison_end_seconds: float\n\n\ndef _owner_id(auth) -> str:\n",
              "    comparison_end_seconds: float\n\n\nclass SimilarMomentsBody(BaseModel):\n    \"\"\"Find bounded experimental neighbors for one exact selected passage.\"\"\"\n\n    source_version_id: UUID\n    query_start_seconds: float\n    query_end_seconds: float\n    max_matches: int = Field(default=3, ge=1, le=MAX_MATCHES)\n\n\ndef _owner_id(auth) -> str:\n",
          )
          replace_once(
              path,
              "\n\n@router.get(\n    \"/works/{work_id}/relations/measured-changes\",\n",
              "\n\ndef find_persisted_similar_moments(*args, **kwargs):\n    \"\"\"Lazy test seam that keeps worker/DSP dependencies out of API imports.\"\"\"\n\n    from domain.similar_moments_query import (\n        find_persisted_similar_moments as implementation,\n    )\n\n    return implementation(*args, **kwargs)\n\n\n@router.get(\n    \"/works/{work_id}/relations/measured-changes\",\n",
          )
          p = Path(path)
          text = p.read_text()
          endpoint = '''\n\n@router.post(\n    "/works/{work_id}/relations/similar-moments",\n    response_model=SimilarMomentsResponse,\n)\ndef similar_moments(\n    work_id: UUID,\n    body: SimilarMomentsBody,\n    auth=Depends(verify_token),\n):\n    """Propose inspectable same-Work passages under one declared experimental method."""\n\n    # Keep NumPy/perceptual matcher imports behind the on-demand endpoint so\n    # importing the HTTP application does not require worker/DSP dependencies.\n    from domain.similar_moments_query import SimilarMomentsQuery\n\n    sb, owner_id, snapshot = _authorized_work_snapshot(work_id, auth)\n    source_version = _source_version(snapshot, body.source_version_id)\n    if source_version is None:\n        raise HTTPException(status_code=404, detail="Source version not found in work")\n\n    result = find_persisted_similar_moments(\n        snapshot,\n        source_version=source_version,\n        query=SimilarMomentsQuery(\n            query_start_seconds=body.query_start_seconds,\n            query_end_seconds=body.query_end_seconds,\n            max_matches=body.max_matches,\n        ),\n        load_report=_authorized_report_loader(snapshot, sb, owner_id),\n    )\n    return SimilarMomentsResponse.model_validate(result.model_dump())\n'''
          if "/relations/similar-moments" in text:
              raise SystemExit("similar moments endpoint already present")
          p.write_text(text.rstrip() + endpoint)

          path = "lib/relation-api-client.ts"
          replace_once(
              path,
              'export type PerceptualSpanComparisonResponse =\n  components["schemas"]["PerceptualSpanComparisonResponse"];\n',
              'export type PerceptualSpanComparisonResponse =\n  components["schemas"]["PerceptualSpanComparisonResponse"];\nexport type SimilarMomentMatch = components["schemas"]["SimilarMomentMatch"];\nexport type SimilarMomentsMethod = components["schemas"]["SimilarMomentsMethod"];\nexport type SimilarMomentsObservation = components["schemas"]["SimilarMomentsObservation"];\nexport type SimilarMomentsBody = components["schemas"]["SimilarMomentsBody"];\nexport type SimilarMomentsResponse = components["schemas"]["SimilarMomentsResponse"];\n',
          )
          p = Path(path)
          text = p.read_text()
          insertion = '''\n\n/** Query bounded experimental same-Work neighbors for one exact selected passage. */\nexport async function getSimilarMoments(\n  workId: string,\n  body: SimilarMomentsBody,\n): Promise<SimilarMomentsResponse> {\n  const result = await openapiClient.POST(\n    "/api/v1/works/{work_id}/relations/similar-moments",\n    {\n      params: { path: { work_id: workId } },\n      body,\n    },\n  );\n  return requireOpenApiData(result);\n}\n'''
          marker = "\n\n/** Discover a bounded experimental top set for one immutable source Version. */"
          if text.count(marker) != 1:
              raise SystemExit("measured changes client marker drifted")
          p.write_text(text.replace(marker, insertion + marker, 1))

          path = "components/workspace/inspector/Inspector.tsx"
          replace_once(path, 'import PassageCompare from "./PassageCompare";\n', 'import PassageCompare from "./PassageCompare";\nimport SimilarMoments from "./SimilarMoments";\n')
          p = Path(path)
          text = p.read_text()
          old = "        <MeasuredChanges />\n        <PassageCompare />\n"
          if text.count(old) != 1:
              raise SystemExit(f"empty Inspector insertion drifted: {text.count(old)}")
          text = text.replace(old, old + "        <SimilarMoments />\n", 1)
          old = "      <MeasuredChanges />\n      <PassageCompare />\n"
          if text.count(old) != 1:
              raise SystemExit(f"Inspector insertion drifted: {text.count(old)}")
          p.write_text(text.replace(old, old + "      <SimilarMoments />\n", 1))

          path = "components/workspace/StructureMap.tsx"
          replace_once(path, "  const openChanges = useCallback(() => {\n", "  const openAnalysisInspector = useCallback(() => {\n")
          replace_once(
              path,
              "  const busy = status === \"loading\" || status === \"generating\";\n  const analysisOptions: AddAnalysisOption[] = [];\n",
              "  const busy = status === \"loading\" || status === \"generating\";\n  const selectedPassage = workspace.selection?.timeRange;\n  const hasExactSelectedPassage = Boolean(\n    selectedPassage\n    && selectedPassage.domain === \"performance\"\n    && workspace.selection?.provenance.timeExact === true\n    && Number.isFinite(selectedPassage.start)\n    && Number.isFinite(selectedPassage.end)\n    && selectedPassage.start >= 0\n    && selectedPassage.end > selectedPassage.start,\n  );\n  const analysisOptions: AddAnalysisOption[] = [];\n",
          )
          replace_once(
              path,
              "  if (workspace.analysisState !== \"idle\") {\n",
              "  if (hasExactSelectedPassage) {\n    analysisOptions.push({\n      id: \"similar-moments\",\n      title: \"Similar moments\",\n      description: \"Find method-qualified candidate passages like this exact selection.\",\n      maturity: \"Experimental\",\n      actionLabel: \"Open\",\n      onAction: openAnalysisInspector,\n    });\n  }\n  if (workspace.analysisState !== \"idle\") {\n",
          )
          replace_once(path, "      onAction: openChanges,\n", "      onAction: openAnalysisInspector,\n")

          path = "tests/components/AddAnalysis.test.tsx"
          p = Path(path)
          text = p.read_text()
          marker = '    expect(screen.getByText("Changes")).toBeInTheDocument();\n'
          if marker not in text:
              raise SystemExit("AddAnalysis test marker drifted")
          text = text.replace(
              marker,
              marker + '    expect(screen.getAllByRole("region", { name: "Add analysis" })).toHaveLength(1);\n',
              1,
          )
          p.write_text(text)
          PY

      - name: Regenerate API contract and run focused verification
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          uv sync --project backend --locked
          npm run api:generate
          uv run --project backend pytest -q \
            backend/tests/test_similar_moments.py \
            backend/tests/test_similar_moments_api.py \
            backend/tests/test_similar_moments_query.py
          npm test -- --run tests/components/SimilarMoments.test.tsx tests/components/AddAnalysis.test.tsx
          test "$(grep -R --include='*.tsx' -l '<AddAnalysis' components/workspace | wc -l)" -eq 1

      - name: Commit clean reintegration
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/reintegrate-812-prep.yml
          git add -A
          git diff --cached --check
          git commit -m "feat(relations): reintegrate experimental similar moments (#812)"
          git push origin HEAD:reintegrate/812-similar-moments
