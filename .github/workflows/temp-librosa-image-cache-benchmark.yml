name: Temporary librosa image-cache benchmark

on:
  push:
    branches:
      - bench/librosa-numba-image-cache

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build production-shaped backend image
        run: docker build --tag hello-ai-librosa-cache-bench backend
      - name: Inspect baked Numba cache
        run: docker run --rm hello-ai-librosa-cache-bench sh -lc 'find "$NUMBA_CACHE_DIR" -type f | wc -l'
      - name: Measure fresh process with native runtime CPU target
        run: docker run --rm hello-ai-librosa-cache-bench python /app/scripts/temp_librosa_image_benchmark.py
      - name: Measure fresh process with generic runtime CPU target
        run: docker run --rm -e NUMBA_CPU_NAME=generic hello-ai-librosa-cache-bench python /app/scripts/temp_librosa_image_benchmark.py
