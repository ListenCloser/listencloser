name: Temporary sync symbolic fix into PR 1217

on:
  push:
    branches:
      - feat/1176-layers-current-main

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Merge latest Symbolic Detail head
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin agent/1178-symbolic-detail
          target='origin/agent/1178-symbolic-detail'
          if git merge-base --is-ancestor "$target" HEAD; then
            echo 'Latest Symbolic Detail head already integrated.'
            exit 0
          fi
          git merge --no-edit "$target"
          git push origin HEAD:${GITHUB_REF_NAME}
