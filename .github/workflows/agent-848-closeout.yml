name: Agent 848 closeout

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: agent-848-closeout-${{ github.ref }}
  cancel-in-progress: true

jobs:
  closeout:
    timeout-minutes: 25
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: '.python-version'
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.12.9'
          enable-cache: true
          cache-dependency-glob: 'backend/uv.lock'
      - run: npm ci
      - name: Sync locked backend environment
        run: uv sync --project backend --locked
      - name: Install audio decoder
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Generate exact API artifacts
        id: contracts
        continue-on-error: true
        run: npm run api:generate

      - name: Commit generated API authority when changed
        id: generated_commit
        if: steps.contracts.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git add openapi/openapi.json lib/api-types.ts
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(api): sync measured-change generated contracts'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Run canonical fast verification
        id: fast
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p closeout-artifacts
          npm run check:fast 2>&1 | tee closeout-artifacts/check-fast.log

      - name: Stage generated artifacts
        if: always()
        env:
          CONTRACTS_OUTCOME: ${{ steps.contracts.outcome }}
          FAST_OUTCOME: ${{ steps.fast.outcome }}
          GENERATED_CHANGED: ${{ steps.generated_commit.outputs.changed }}
        run: |
          mkdir -p closeout-artifacts
          cp openapi/openapi.json closeout-artifacts/openapi.json
          cp lib/api-types.ts closeout-artifacts/api-types.ts
          cat > closeout-artifacts/outcomes.txt <<EOF
          contracts=${CONTRACTS_OUTCOME}
          generated_changed=${GENERATED_CHANGED}
          check_fast=${FAST_OUTCOME}
          EOF

      - name: Upload closeout artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agent-848-closeout-${{ github.run_attempt }}
          path: closeout-artifacts/
          if-no-files-found: error
          retention-days: 1

      - name: Require repository closeout correctness
        if: always()
        env:
          CONTRACTS_OUTCOME: ${{ steps.contracts.outcome }}
          FAST_OUTCOME: ${{ steps.fast.outcome }}
        run: |
          test "$CONTRACTS_OUTCOME" = success
          test "$FAST_OUTCOME" = success
