name: Agent 848 closeout

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: agent-848-closeout-${{ github.ref }}
  cancel-in-progress: true

jobs:
  closeout:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: '.python-version'
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.12.9'
          enable-cache: true
          cache-dependency-glob: 'backend/uv.lock'
      - run: npm ci
      - name: Sync locked backend environment
        run: uv sync --project backend --locked
      - name: Install audio decoder
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Generate exact API artifacts
        id: contracts
        continue-on-error: true
        run: npm run api:generate

      - name: Run focused measured-change and relation tests
        id: focused
        continue-on-error: true
        run: |
          uv run --project backend --locked python -m pytest \
            backend/tests/test_measured_changes.py \
            backend/tests/test_relation_query.py \
            backend/tests/test_relation_observations.py \
            -v

      - name: Inspect branch method on public-domain recordings
        id: real
        continue-on-error: true
        env:
          PYTHONPATH: backend
        run: |
          mkdir -p closeout-artifacts
          uv run --project backend --locked python - <<'PY'
          import json
          import urllib.request
          from uuid import uuid4

          from perceptual_evidence import extract_perceptual_evidence_from_bytes
          from domain.measured_changes import discover_measured_changes

          FILES = [
              (
                  "Maple Leaf Rag",
                  "Maple Leaf Rag.ogg",
                  "https://upload.wikimedia.org/wikipedia/commons/f/fe/Maple_Leaf_Rag.ogg",
              ),
              (
                  "El Choclo",
                  "El Choclo-Villoldo.ogg",
                  "https://upload.wikimedia.org/wikipedia/commons/1/12/El_Choclo-Villoldo.ogg",
              ),
              (
                  "How Long, How Long Blues",
                  "How Long, How Long Blues.ogg",
                  "https://upload.wikimedia.org/wikipedia/commons/e/e8/How_Long%2C_How_Long_Blues.ogg",
              ),
          ]
          headers = {"User-Agent": "ListenCloser/848-experimental-closeout"}
          output = []
          for title, file_title, media_url in FILES:
              with urllib.request.urlopen(
                  urllib.request.Request(media_url, headers=headers), timeout=60
              ) as response:
                  audio_bytes = response.read()

              source_version_id = uuid4()
              report_version_id = uuid4()
              report = extract_perceptual_evidence_from_bytes(
                  audio_bytes,
                  source_version_id=source_version_id,
                  fmt="ogg",
              )
              discovery = discover_measured_changes(
                  report,
                  evidence_report_version_id=report_version_id,
              )
              feature_floor = float(discovery.method_parameters.get("feature_change_floor", 0.0))
              output.append({
                  "title": title,
                  "file_title": file_title,
                  "duration_seconds": report.duration_seconds,
                  "status": discovery.status,
                  "method": discovery.method,
                  "method_parameters": discovery.method_parameters,
                  "candidate_count": len(discovery.candidates),
                  "candidates": [
                      {
                          "rank": candidate.rank,
                          "boundary_seconds": candidate.boundary_seconds,
                          "before_span_seconds": candidate.before_span_seconds,
                          "after_span_seconds": candidate.after_span_seconds,
                          "ranking_score": candidate.ranking_score,
                          "changed_feature_count": candidate.changed_feature_count,
                          "changed_feature_groups": [
                              name
                              for name, value in candidate.normalized_feature_changes.items()
                              if value >= feature_floor
                          ],
                          "normalized_feature_changes": candidate.normalized_feature_changes,
                          "measurement_summaries": [
                              measurement.summary
                              for measurement in candidate.finding.measurements
                          ],
                      }
                      for candidate in discovery.candidates
                  ],
              })

          with open("closeout-artifacts/real-recordings.json", "w", encoding="utf-8") as handle:
              json.dump(output, handle, indent=2, sort_keys=True)
          PY

      - name: Stage diagnostic artifacts
        if: always()
        env:
          CONTRACTS_OUTCOME: ${{ steps.contracts.outcome }}
          FOCUSED_OUTCOME: ${{ steps.focused.outcome }}
          REAL_OUTCOME: ${{ steps.real.outcome }}
        run: |
          mkdir -p closeout-artifacts
          if [ -f openapi/openapi.json ]; then
            cp openapi/openapi.json closeout-artifacts/openapi.json
          fi
          if [ -f lib/api-types.ts ]; then
            cp lib/api-types.ts closeout-artifacts/api-types.ts
          fi
          cat > closeout-artifacts/outcomes.txt <<EOF
          contracts=${CONTRACTS_OUTCOME}
          focused_tests=${FOCUSED_OUTCOME}
          real_recordings=${REAL_OUTCOME}
          EOF

      - name: Upload closeout artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agent-848-closeout-${{ github.run_attempt }}
          path: closeout-artifacts/
          if-no-files-found: error
          retention-days: 1

      - name: Require closeout correctness
        if: always()
        env:
          CONTRACTS_OUTCOME: ${{ steps.contracts.outcome }}
          FOCUSED_OUTCOME: ${{ steps.focused.outcome }}
          REAL_OUTCOME: ${{ steps.real.outcome }}
        run: |
          test "$CONTRACTS_OUTCOME" = success
          test "$FOCUSED_OUTCOME" = success
          test "$REAL_OUTCOME" = success
