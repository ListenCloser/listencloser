name: Backend Image

on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/Dockerfile'
      - 'backend/pyproject.toml'
      - 'backend/uv.lock'
      - '.github/workflows/backend-image.yml'
  push:
    branches: [main]
    paths:
      - 'backend/Dockerfile'
      - 'backend/pyproject.toml'
      - 'backend/uv.lock'
      - '.github/workflows/backend-image.yml'

concurrency:
  group: backend-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build production backend image from locked dependencies
        run: docker build --tag hello-ai-backend:${{ github.sha }} backend
