name: Platform Audit

on:
  push:
    branches: [audit/platform-v3-dead-code]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Knip report
        run: npx --yes knip@6.32.2 --reporter compact || true
      - uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.6'
      - name: Sync backend
        run: uv sync --project backend --locked
      - name: deptry report
        working-directory: backend
        run: uvx --from deptry==0.25.1 deptry . || true
      - name: High-confidence Vulture report
        run: uvx --from vulture vulture backend --exclude 'backend/.venv/**' --min-confidence 100 --sort-by-size || true
