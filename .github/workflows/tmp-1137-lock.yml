name: Temporary #1137 lock regeneration

on:
  push:
    branches:
      - security/1137-python-multipart

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.12.6'
      - name: Regenerate only the requested dependency
        run: |
          set -euo pipefail
          cd backend
          uv lock --upgrade-package python-multipart
          uv lock --check
          grep -A3 '^name = "python-multipart"$' uv.lock
      - name: Publish resolver-owned lock and delete this temporary workflow
        run: |
          set -euo pipefail
          git rm .github/workflows/tmp-1137-lock.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add backend/pyproject.toml backend/uv.lock
          git diff --cached --check
          git commit -m 'security: lock python-multipart 0.0.30'
          git push
