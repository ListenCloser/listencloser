name: Refine score reinterpretation UI

on:
  push:
    branches:
      - feat/workspace-score-reinterpretation

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/workspace-score-reinterpretation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Refine score switching behavior
        run: python .github/scripts/refine-991.py
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- tests/score-artifacts.test.ts
      - name: Commit refinement and remove staging files
        run: |
          rm .github/workflows/refine-991.yml .github/scripts/refine-991.py
          git config user.name "listencloser-ci"
          git config user.email "actions@users.noreply.github.com"
          git add lib/stores/workspace.tsx components/workspace/WorkspaceSession.tsx components/workspace/RepresentationStack.tsx .github/workflows/refine-991.yml .github/scripts/refine-991.py
          git commit -m "refactor(score): make engine selection drive reinterpretation"
          git push origin HEAD:feat/workspace-score-reinterpretation
