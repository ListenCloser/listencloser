name: Temporary validate PR 1259

on:
  push:
    branches:
      - feat/1258-analysis-discovery-parity

permissions:
  contents: read

concurrency:
  group: temp-validate-1259-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - name: Frontend canonical check
        run: npm run check:frontend
      - name: Production build
        run: npm run build
