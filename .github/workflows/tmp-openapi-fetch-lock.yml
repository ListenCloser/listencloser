name: Temporary openapi-fetch lockfile generator

on:
  push:
    branches:
      - refactor/openapi-transport-project-work-lock
    paths:
      - .github/workflows/tmp-openapi-fetch-lock.yml

permissions:
  contents: write

jobs:
  generate-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: refactor/openapi-transport-project-work-lock
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - name: Generate npm-authored dependency state
        run: npm install --save-exact openapi-fetch@0.17.0
      - name: Remove temporary workflow and commit generated files
        run: |
          rm .github/workflows/tmp-openapi-fetch-lock.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json .github/workflows/tmp-openapi-fetch-lock.yml
          git commit -m "chore: add openapi-fetch dependency"
          git push
