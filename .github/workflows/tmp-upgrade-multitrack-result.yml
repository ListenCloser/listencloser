name: Temporary multitrack decoder result upgrade

on:
  push:
    branches:
      - eval/analysis-v3-multitrack-transcription
    paths:
      - '.github/workflows/tmp-upgrade-multitrack-result.yml'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: eval/analysis-v3-multitrack-transcription
      - name: Replace serializer-corrupted MR metrics with decoder-level evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('backend/evaluation/analysis_v3/multitrack_transcription/results/slakh_redux_subset_results.json')
          payload = json.loads(path.read_text())
          old_macro = payload['mr_mt3']['macro']
          if old_macro.get('onset_flat_f1') != 0.3366:
              raise SystemExit(f'unexpected prior MR onset macro: {old_macro}')

          payload['mr_mt3']['measurement_level'] = 'decoded NoteSequence events before mt3-infer MIDI serialization'
          payload['mr_mt3']['macro'] = {
              'onset_flat_f1': 0.7898,
              'note_flat_f1': 0.2415,
              'onset_program_family_f1': 0.755,
              'onset_program_exact_f1': 0.4999,
              'note_program_exact_f1': 0.1211,
              'instrument_detection_exact_f1': 0.3875,
              'instrument_detection_family_f1': 0.9113,
          }
          measured = {
              'Track01876': (379, 300, 0.6804, 0.3211, 0.6068, 0.3741, 0.1473, 0.5714, 1.0),
              'Track01877': (136, 127, 0.9582, 0.3194, 0.9582, 0.8517, 0.2890, 0.2857, 0.8),
              'Track01878': (164, 128, 0.7603, 0.2260, 0.7397, 0.3288, 0.0411, 0.3333, 0.8333),
              'Track01880': (651, 534, 0.6700, 0.1789, 0.6042, 0.4996, 0.0489, 0.2857, 0.9231),
              'Track01881': (565, 594, 0.8801, 0.1622, 0.8663, 0.4452, 0.0794, 0.4615, 1.0),
          }
          for track_id, values in measured.items():
              ref, pred, onset, note, family, exact, exact_note, detect_exact, detect_family = values
              track = payload['mr_mt3']['tracks'][track_id]
              if track['predicted_notes'] != pred:
                  raise SystemExit(f'unexpected predicted note count for {track_id}: {track["predicted_notes"]}')
              track.update({
                  'reference_notes': ref,
                  'predicted_notes': pred,
                  'onset_flat_f1': onset,
                  'note_flat_f1': note,
                  'onset_program_family_f1': family,
                  'onset_program_exact_f1': exact,
                  'note_program_exact_f1': exact_note,
                  'instrument_detection_exact_f1': detect_exact,
                  'instrument_detection_family_f1': detect_family,
              })

          validity = payload['serializer_validity']
          validity['decoder_sidecar_run'] = {
              'workflow_run_id': 33218294887,
              'head_sha': 'edfc29a01334db61ceaf6d7dfcde0080cbfd185b',
              'artifact_digest': 'sha256:484581f59d444cfbbc1333da128f8ecb663aa4d0bc0d819a64b72ce8d0818dc8',
              'instrumentation_before_sha256': '5b376389c1f1794862b2704237cd01e20b1c2c32f474a429cf52afd20b2122ef',
              'instrumentation_after_sha256': 'c395b4895e4f4da721c6494beb289962f787d19c443b76ef07dead4e0634d1fd',
              'scope': 'JSON sidecar immediately after decode_and_combine_predictions; stock MIDI serializer unchanged',
              'sidecar_to_evaluator_midi_max_timing_quantization_seconds': 0.0011,
          }
          validity['decoder_macro_f1'] = dict(payload['mr_mt3']['macro'])
          validity['stock_serializer_macro_f1'] = {
              'onset_flat_f1': 0.3366,
              'note_flat_f1': 0.0905,
              'onset_program_family_f1': 0.2561,
              'onset_program_exact_f1': 0.2091,
              'note_program_exact_f1': 0.0378,
              'instrument_detection_exact_f1': 0.3115,
              'instrument_detection_family_f1': 0.5032,
          }
          validity['patched_serializer_macro_f1'] = {
              'onset_flat_f1': 0.3366,
              'note_flat_f1': 0.0977,
              'onset_program_family_f1': 0.3147,
              'onset_program_exact_f1': 0.2286,
              'note_program_exact_f1': 0.0512,
              'instrument_detection_exact_f1': 0.3875,
              'instrument_detection_family_f1': 0.9113,
          }
          validity['conclusion'] = (
              'Decoder-sidecar calibration shows the stock serializer corrupts more than program labels: '
              'collapsing all pitched programs onto channel 0 destroys overlapping same-pitch note identity and '
              'therefore both onset/offset recovery and program-attributed note evidence. Canonical MR-MT3 quality '
              'metrics in this result are scored from the decoded NoteSequence captured before MIDI serialization. '
              'The sidecar was serialized in the locked hello-ai environment with one stream per decoded program; '
              'all decoded notes survived one-to-one with <=1.1 ms quantization. Stock and patched serializer runs '
              'remain diagnostic provenance only.'
          )

          payload['decision']['architecture'] = (
              'Do not replace Basic Pitch in production yet. On this five-excerpt subset MR-MT3 decoder-level '
              'evidence materially outperforms Basic Pitch on flat onset and onset+offset recovery and carries useful '
              'instrument-family/program evidence, but the sample is too small and the current process-per-track CPU '
              'wrapper is too slow for adoption. Retain MR-MT3 as a leading optional RESEARCH path pending broader '
              'data, warm/batched runtime, and downstream product-task validation.'
          )
          payload['limitations'] = [
              'Only five fixed 30-second test excerpts.',
              'Subset is deterministic but not representative enough for production adoption.',
              'Published MR-MT3 Slakh results use a different grouped-stem/bass-correction protocol and are not directly comparable.',
              'MR-MT3 runtime uses process-per-track stock CLI and overstates warm-model latency.',
              'Canonical MR-MT3 quality uses decoder-sidecar evidence because the pinned stock MIDI serializer corrupts overlapping pitched events; a production adapter would need a validated lossless evidence serializer.',
              'No downstream harmony/bass/melody product task was separately scored in this stage.',
          ]
          path.write_text(json.dumps(payload, indent=2) + '\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/evaluation/analysis_v3/multitrack_transcription/results/slakh_redux_subset_results.json
          git diff --cached --exit-code && exit 1 || true
          git commit -m 'fix(eval): use decoder-level MR-MT3 measurements'
          git push origin HEAD:eval/analysis-v3-multitrack-transcription
