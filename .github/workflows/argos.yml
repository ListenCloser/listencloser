name: Argos

# Visual review loop for PRs.
# Argos captures the design mockup (SOT) + the real built app and diffs every
# PR build against the `main` baseline, posting results on the PR.
# Requires: a project at https://app.argos-ci.com and ARGOS_TOKEN in repo secrets.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - '*.md'
      - 'docs/**'
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  argos:
    if: github.event.pull_request.draft == false
    timeout-minutes: 15
    runs-on: ubuntu-latest
    # Visual QA is an informational signal only — it must never fail the pipeline
    # or block a merge (only the `build` and `e2e` jobs are required by branch protection).
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('**/*.ts', '**/*.tsx') }}
          restore-keys: |
            nextjs-${{ hashFiles('package-lock.json') }}-
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
        env:
          NEXT_PUBLIC_MOCK_ENABLED: "true"
      - run: npm run start &
      - name: wait for server
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000 && break
            sleep 1
          done
      - name: visual tests
        run: npx playwright test tests/visual
        env:
          ARGOS_TOKEN: ${{ secrets.ARGOS_TOKEN }}
