name: Argos

# Visual review loop for PRs.
# Argos captures the design mockup (SOT) + the real built app and diffs every
# PR build against the `main` baseline, posting results on the PR.
# Requires: a project at https://app.argos-ci.com and ARGOS_TOKEN in repo secrets.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - '*.md'
      - 'docs/**'
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  argos:
    if: github.event.pull_request.draft == false
    timeout-minutes: 15
    runs-on: ubuntu-latest
    # Visual QA is an informational signal only — it must never fail the pipeline
    # or block a merge (only the `build` and `e2e` jobs are required by branch protection).
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
        env:
          NEXT_PUBLIC_MOCK_ENABLED: "true"
          NEXT_PUBLIC_SUPABASE_URL: "https://cijhpddqvvzyzfzmkdnn.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "e2e-anon-key"
      - run: npm run start &
        env:
          NODE_ENV: test
          NEXT_PUBLIC_MOCK_ENABLED: "true"
          NEXT_PUBLIC_SUPABASE_URL: "https://cijhpddqvvzyzfzmkdnn.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "e2e-anon-key"
      - name: wait for server
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000 && break
            sleep 1
          done
      - name: visual tests
        run: npx playwright test tests/visual
        env:
          ARGOS_TOKEN: ${{ secrets.ARGOS_TOKEN }}
