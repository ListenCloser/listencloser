name: Temporary probe Layers replay

on:
  push:
    branches:
      - reconstruct/1176-layers-source

permissions:
  contents: read

jobs:
  probe:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Probe bounded Layers replay on current main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'listencloser-replay-probe'
          git config user.email 'replay-probe@users.noreply.github.com'
          git fetch origin main
          git checkout -B replay origin/main
          for commit in $(git rev-list --reverse ebc30d055934d20b5925012c47fa9a71968371c0..b67f74b98718f2147edbf8f39e34462da6116ed6); do
            echo "=== cherry-pick $commit ==="
            if git cherry-pick "$commit"; then
              continue
            fi
            conflicts=$(git diff --name-only --diff-filter=U)
            if [ "$commit" = "aadfc3e74aae7bcaa1e88f56468ac1e8cb756c65" ] && [ "$conflicts" = "backend/worker.py" ]; then
              git checkout --ours backend/worker.py
              python - <<'PY'
          from pathlib import Path
          path = Path('backend/worker.py')
          text = path.read_text()
          import_line = 'from domain.source_separation import register_source_separation\n'
          if import_line not in text:
              anchor = 'from domain.production_spatial_capability import register_production_spatial_capability\n'
              text = text.replace(anchor, anchor + import_line)
          register_line = '    register_source_separation(worker)\n'
          if register_line not in text:
              anchor = '    register_structure_map_capability(worker)\n'
              text = text.replace(anchor, anchor + register_line)
          path.write_text(text)
          PY
              git add backend/worker.py
              GIT_EDITOR=true git cherry-pick --continue
              continue
            fi
            if [ "$commit" = "694bb3687bf962a03f833a6dd0639cf88ec8c1ad" ] && [ "$conflicts" = "backend/domain/api/workflows_jobs.py" ]; then
              git show "$commit:backend/domain/api/workflows_jobs.py" > /tmp/layers-workflows-jobs.py
              git checkout --ours backend/domain/api/workflows_jobs.py
              python - <<'PY'
          from pathlib import Path
          path = Path('backend/domain/api/workflows_jobs.py')
          text = path.read_text()
          theirs = Path('/tmp/layers-workflows-jobs.py').read_text()
          if '        "separate",\n' not in text:
              anchor = '        "production_spatial",\n'
              text = text.replace(anchor, anchor + '        "separate",\n')
          if '_SEPARATION_MODEL_SIGNATURE = "955717e8"' not in text:
              anchor = ')\n\n\nclass UnderstandWorkflowBody'
              text = text.replace(anchor, ')\n_SEPARATION_MODEL_SIGNATURE = "955717e8"\n\n\nclass UnderstandWorkflowBody')
          their_fn = theirs.split('def create_create_workflow(', 1)[1]
          start = their_fn.index('        version = _require_version_in_project')
          end_marker = '            return {"workflow": workflow, "job": job}\n'
          end = their_fn.index(end_marker, start) + len(end_marker)
          separation_block = their_fn[start:end]
          fn_prefix, fn_body = text.split('def create_create_workflow(', 1)
          old = '        _require_version_in_project(sb, version_id, project_id, owner)\n'
          if old not in fn_body:
              raise SystemExit('create workflow anchor not found')
          fn_body = fn_body.replace(old, separation_block, 1)
          path.write_text(fn_prefix + 'def create_create_workflow(' + fn_body)
          PY
              git add backend/domain/api/workflows_jobs.py
              GIT_EDITOR=true git cherry-pick --continue
              continue
            fi
            if [ "$commit" = "aacd592a21b9f83a57c2ca01c0b1570d5f92988d" ] && [ "$conflicts" = "backend/Dockerfile" ]; then
              git checkout --ours backend/Dockerfile
              python - <<'PY'
          from pathlib import Path
          path = Path('backend/Dockerfile')
          text = path.read_text()
          block = '''
          # Experimental Layers keeps the already-characterized HTDemucs candidate from
          # #1191. Demucs stays worker-image-only; acquire the exact checkpoint at build
          # time, verify its digest, and refuse any runtime model download.
          RUN uv pip install --python /app/.venv/bin/python 'cmake==3.31.10' \\
              && CMAKE=/app/.venv/bin/cmake uv pip install --python /app/.venv/bin/python 'demucs==4.1.0' \\
              && uv pip uninstall --python /app/.venv/bin/python cmake

          RUN HF_HOME=/app/.cache/huggingface /app/.venv/bin/python -c "import hashlib, importlib.metadata as md; from pathlib import Path; import numpy, torch; from demucs.pretrained import get_model; assert md.version('demucs') == '4.1.0'; assert numpy.__version__ == '1.26.4'; assert torch.__version__.split('+')[0] == '2.6.0'; model=get_model('htdemucs'); assert tuple(model.sources) == ('drums','bass','other','vocals'); matches=list(Path('/app/.cache/huggingface').rglob('955717e8.safetensors')); assert matches, 'verified HTDemucs checkpoint not found'; assert hashlib.sha256(matches[0].read_bytes()).hexdigest() == 'd9fa14133cfcc034a6758923bb3a8ca9f8dfd0b582134643bbf83f72c17576dd'"

          RUN printf '%s\\n' \\
                "Demucs package 4.1.0" \\
                "Wrapper code license: MIT" \\
                "Wrapper source: https://github.com/adefossez/demucs" \\
                "Model: htdemucs / signature 955717e8" \\
                "Checkpoint: adefossez/HTDemucs/955717e8.safetensors" \\
                "Checkpoint SHA256: d9fa14133cfcc034a6758923bb3a8ca9f8dfd0b582134643bbf83f72c17576dd" \\
                "Checkpoint license: MIT (author-hosted adefossez/HTDemucs repository)" \\
                "Inference parameters: CPU, shifts=0" \\
                > /app/.cache/HTDEMUCS_LISTENCLOSER_PROVENANCE.txt

          '''
          block = ''.join(line[10:] if line.startswith('          ') else line for line in block.splitlines(keepends=True))
          if 'HTDEMUCS_LISTENCLOSER_PROVENANCE.txt' not in text:
              anchor = '    && echo "8c328b45f59d8dd3dff219253ff6a8d6482be57d0133a29140e2febbf8eb8331  /app/.cache/torch/hub/checkpoints/beat_this-final0.ckpt" | sha256sum --check -\n\n'
              if anchor not in text:
                  raise SystemExit('Beat This checksum anchor not found')
              text = text.replace(anchor, anchor + block, 1)
          if '    HF_HOME=/app/.cache/huggingface \\\n' not in text:
              anchor = '    TORCH_HOME=/app/.cache/torch \\\n'
              if anchor not in text:
                  raise SystemExit('TORCH_HOME env anchor not found')
              text = text.replace(anchor, anchor + '    HF_HOME=/app/.cache/huggingface \\\n    HF_HUB_OFFLINE=1 \\\n', 1)
          path.write_text(text)
          PY
              git add backend/Dockerfile
              GIT_EDITOR=true git cherry-pick --continue
              continue
            fi
            if [ "$commit" = "1c7aecede661d365b06fed8b25b8870c9c0e3ccf" ] && [ "$conflicts" = "components/workspace/StructureMap.tsx" ]; then
              git checkout --ours components/workspace/StructureMap.tsx
              python - <<'PY'
          from pathlib import Path
          path = Path('components/workspace/StructureMap.tsx')
          text = path.read_text()
          def replace_once(old: str, new: str, label: str) -> None:
              global text
              if old not in text:
                  raise SystemExit(f'StructureMap anchor not found: {label}')
              text = text.replace(old, new, 1)

          import_line = 'import { useLayerAnalysis } from "@/components/workspace/useLayerAnalysis";\n'
          if import_line not in text:
              anchor = 'import AddAnalysis, { type AddAnalysisOption } from "@/components/workspace/AddAnalysis";\n'
              replace_once(anchor, anchor + import_line, 'layer import')

          replace_once(
              'export default function StructureMap() {\n',
              'export default function StructureMap({ canProcess = false }: { canProcess?: boolean }) {\n',
              'component signature',
          )
          transport = '  const { transport, seek, play, setActiveSource, audioRef } = useTransport();\n'
          if '  const layerAnalysis = useLayerAnalysis(canProcess);\n' not in text:
              replace_once(transport, transport + '  const layerAnalysis = useLayerAnalysis(canProcess);\n', 'layer hook')

          effect_anchor = '''  useEffect(() => {
            const workId = workspace.activeWorkId;
            const jobId = activeJobId;
          '''
          layer_effect = '''  // Layers owns its durable job state but discovery remains in the shared chooser.
            useEffect(() => {
              if (layerAnalysis.option?.busy || layerAnalysis.notice) setChooserOpen(true);
            }, [layerAnalysis.notice, layerAnalysis.option?.busy]);

          '''
          if 'Layers owns its durable job state' not in text:
              replace_once(effect_anchor, layer_effect + effect_anchor, 'layer lifecycle effect')

          if '    analysisOptions.push(layerAnalysis.option);\n' not in text:
              replace_once(
                  '  if (hasExactSelectedPassage) {\n',
                  '  if (layerAnalysis.option) {\n    analysisOptions.push(layerAnalysis.option);\n  }\n  if (hasExactSelectedPassage) {\n',
                  'chooser option',
              )

          replace_once(
              '  const notice = [error, pitchError].filter(Boolean).join(" · ") || null;\n',
              '  const notice = [error, pitchError, layerAnalysis.notice].filter(Boolean).join(" · ") || null;\n'
              '  const noticeRole = (\n'
              '    busy\n'
              '    || pitchBusy\n'
              '    || observationLost\n'
              '    || pitchObservationLost\n'
              '    || (Boolean(layerAnalysis.notice) && layerAnalysis.noticeRole === "status")\n'
              '  ) ? "status" : "alert";\n',
              'notice composition',
          )
          replace_once(
              '      noticeRole={busy || pitchBusy || observationLost || pitchObservationLost ? "status" : "alert"}\n',
              '      noticeRole={noticeRole}\n',
              'notice role',
          )
          replace_once(
              '    if (status === "loading" && pitchStatus === "loading" && !chooserOpen && !pitchReady) return null;\n',
              '    if (status === "loading" && pitchStatus === "loading" && !chooserOpen && !pitchReady && !layerAnalysis.option) return null;\n',
              'loading visibility',
          )
          path.write_text(text)
          PY
              git add components/workspace/StructureMap.tsx
              GIT_EDITOR=true git cherry-pick --continue
              continue
            fi
            echo "CONFLICT_COMMIT=$commit"
            printf '%s\n' "$conflicts"
            git status --short
            exit 1
          done
          echo "REPLAY_OK"
