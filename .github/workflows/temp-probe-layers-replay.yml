name: Temporary probe Layers replay

on:
  push:
    branches:
      - reconstruct/1176-layers-source

permissions:
  contents: read

jobs:
  probe:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Probe bounded Layers replay on current main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'listencloser-replay-probe'
          git config user.email 'replay-probe@users.noreply.github.com'
          git fetch origin main
          git checkout -B replay origin/main
          for commit in $(git rev-list --reverse ebc30d055934d20b5925012c47fa9a71968371c0..b67f74b98718f2147edbf8f39e34462da6116ed6); do
            echo "=== cherry-pick $commit ==="
            if git cherry-pick "$commit"; then
              continue
            fi
            conflicts=$(git diff --name-only --diff-filter=U)
            if [ "$commit" = "aadfc3e74aae7bcaa1e88f56468ac1e8cb756c65" ] && [ "$conflicts" = "backend/worker.py" ]; then
              git checkout --ours backend/worker.py
              python - <<'PY'
          from pathlib import Path
          path = Path('backend/worker.py')
          text = path.read_text()
          import_line = 'from domain.source_separation import register_source_separation\n'
          if import_line not in text:
              anchor = 'from domain.production_spatial_capability import register_production_spatial_capability\n'
              text = text.replace(anchor, anchor + import_line)
          register_line = '    register_source_separation(worker)\n'
          if register_line not in text:
              anchor = '    register_structure_map_capability(worker)\n'
              text = text.replace(anchor, anchor + register_line)
          path.write_text(text)
          PY
              git add backend/worker.py
              GIT_EDITOR=true git cherry-pick --continue
              continue
            fi
            if [ "$commit" = "694bb3687bf962a03f833a6dd0639cf88ec8c1ad" ] && [ "$conflicts" = "backend/domain/api/workflows_jobs.py" ]; then
              git checkout --ours backend/domain/api/workflows_jobs.py
              python - <<'PY'
          from pathlib import Path
          path = Path('backend/domain/api/workflows_jobs.py')
          text = path.read_text()
          if '        "separate",\n' not in text:
              anchor = '        "production_spatial",\n'
              text = text.replace(anchor, anchor + '        "separate",\n')
          if '_SEPARATION_MODEL_SIGNATURE = "955717e8"' not in text:
              anchor = ')\n\n\nclass UnderstandWorkflowBody'
              text = text.replace(anchor, ')\n_SEPARATION_MODEL_SIGNATURE = "955717e8"\n\n\nclass UnderstandWorkflowBody')
          old = '        _require_version_in_project(sb, version_id, project_id, owner)\n\n        workflow = Workflow(\n'
          separation = '''        version = _require_version_in_project(sb, version_id, project_id, owner)

        if capability_name == "separate":
            artifact = ArtifactRepo(sb).get(version.artifact_id, owner)
            if not artifact:
                raise HTTPException(status_code=404, detail="Artifact not found")
            if artifact.kind != ArtifactKind.audio_original:
                raise HTTPException(
                    status_code=400,
                    detail="Layer separation requires an Original audio Version",
                )

            # Optional separation targets the exact Original so its durable Job
            # is discoverable from the Work bundle on reload. Product isolation
            # is enforced by the workspace's optional-capability state filter,
            # not by hiding the Job from durable Work truth.
            separation_identity = f"{owner}:{version_id}:{_SEPARATION_MODEL_SIGNATURE}"
            job_id = uuid5(
                NAMESPACE_URL,
                f"listencloser:separate:1.0:{separation_identity}",
            )
            job_repo = JobRepo(sb)
            existing_job = job_repo.get(job_id, owner)
            if existing_job:
                workflow = WorkflowRepo(sb).get(existing_job.workflow_id, owner)
                if not workflow:
                    raise RuntimeError("idempotent separation job references a missing workflow")
                return {"workflow": workflow, "job": existing_job}

            workflow = Workflow(
                id=uuid5(
                    NAMESPACE_URL,
                    f"listencloser:separate-workflow:1.0:{separation_identity}",
                ),
                project_id=project_id,
                kind=WorkflowKind.create,
                target_version_id=version_id,
                parameters={
                    "action": "separate",
                    "source_version_id": str(version_id),
                    "model": "htdemucs",
                    "model_signature": _SEPARATION_MODEL_SIGNATURE,
                    "shifts": 0,
                },
            )
            workflow_repo = WorkflowRepo(sb)
            try:
                workflow = workflow_repo.create(workflow, owner)
            except Exception:
                concurrent_job = job_repo.get(job_id, owner)
                if concurrent_job:
                    concurrent_workflow = workflow_repo.get(concurrent_job.workflow_id, owner)
                    if concurrent_workflow:
                        return {"workflow": concurrent_workflow, "job": concurrent_job}
                workflow = workflow_repo.get(workflow.id, owner)
                if not workflow:
                    raise

            parameters = {
                "fmt": Path(version.label).suffix.lstrip(".").lower() or "wav",
                "model": "htdemucs",
                "model_signature": _SEPARATION_MODEL_SIGNATURE,
                "shifts": 0,
            }
            job = Job(
                id=job_id,
                workflow_id=workflow.id,
                capability=Capability(name="separate", version="1.0"),
                input_version_ids=[version_id],
                parameters=parameters,
                cache_key=f"separate:1.0:{separation_identity}:shifts=0",
                created_by=owner,
            )
            try:
                job = job_repo.create(job, owner)
            except Exception:
                job = job_repo.get(job_id, owner)
                if not job:
                    raise
            return {"workflow": workflow, "job": job}

        workflow = Workflow(
'''
          if old not in text:
              raise SystemExit('create workflow anchor not found')
          text = text.replace(old, separation, 1)
          path.write_text(text)
          PY
              git add backend/domain/api/workflows_jobs.py
              GIT_EDITOR=true git cherry-pick --continue
              continue
            fi
            echo "CONFLICT_COMMIT=$commit"
            printf '%s\n' "$conflicts"
            git status --short
            exit 1
          done
          echo "REPLAY_OK"
