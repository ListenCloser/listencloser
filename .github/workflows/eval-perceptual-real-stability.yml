name: Perceptual Real Audio Stability

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/eval-perceptual-real-stability.yml'
      - 'backend/evaluation/analysis_v3/perceptual/**'
      - 'backend/tests/test_analysis_v3_perceptual_*.py'
      - 'backend/tests/test_perceptual_evaluation.py'

permissions:
  contents: read

concurrency:
  group: perceptual-real-stability-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  real-stability:
    name: real-audio-stability
    if: github.event.pull_request.head.ref == 'eval-perceptual-evidence-v3'
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: '.python-version'

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.12.6'
          enable-cache: true
          cache-dependency-glob: 'backend/uv.lock'

      - name: Sync locked backend environment
        run: uv sync --project backend --locked

      - name: Install codec tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Prepare real recordings and codec variants
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/perceptual-real"
          mkdir -p "$root"

          candombe="$root/csic.1995_ansina1_03.flac"
          curl --fail --location --retry 4 --retry-all-errors \
            'https://www.eumus.edu.uy/candombe/datasets/ISMIR2015/csic.1995_ansina1_03.flac' \
            --output "$candombe"
          echo 'fffe0c4677d994cbc16e7009b7cad982  '"$candombe" | md5sum --check --strict -

          ffmpeg -y -loglevel error \
            -i tests/fixtures/real-piano.m4a \
            -codec:a libmp3lame -b:a 128k \
            "$root/real-piano-128k.mp3"
          ffmpeg -y -loglevel error \
            -i "$candombe" \
            -codec:a libmp3lame -b:a 128k \
            "$root/candombe-128k.mp3"

          cat > "$root/provenance.json" <<'JSON'
          {
            "tracks": [
              {
                "id": "repo_real_piano",
                "path": "tests/fixtures/real-piano.m4a",
                "role": "existing real-stack acoustic/piano fixture",
                "rights_note": "repository fixture; not used to claim external corpus diversity or licensing generalization"
              },
              {
                "id": "candombe_ansina1_03",
                "source": "https://www.eumus.edu.uy/candombe/datasets/ISMIR2015/dataset.html",
                "license": "CC BY 4.0",
                "md5": "fffe0c4677d994cbc16e7009b7cad982",
                "role": "public rhythm-first real-recording stability probe"
              }
            ],
            "codec_variant": "ffmpeg libmp3lame 128 kbps",
            "scope": "stability probe only; two recordings do not establish cross-style diversity"
          }
          JSON

          echo "PERCEPTUAL_REAL_ROOT=$root" >> "$GITHUB_ENV"

      - name: Run literal descriptor stability probe
        run: |
          uv run --project backend python -m backend.evaluation.analysis_v3.perceptual.run_real_stability \
            --track repo_real_piano tests/fixtures/real-piano.m4a \
            --codec-variant repo_real_piano "$PERCEPTUAL_REAL_ROOT/real-piano-128k.mp3" \
            --track candombe_ansina1_03 "$PERCEPTUAL_REAL_ROOT/csic.1995_ansina1_03.flac" \
            --codec-variant candombe_ansina1_03 "$PERCEPTUAL_REAL_ROOT/candombe-128k.mp3" \
            --output "$PERCEPTUAL_REAL_ROOT/results.json"

      - name: Upload evaluation outputs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: perceptual-real-stability-${{ github.event.pull_request.head.sha }}
          path: |
            ${{ runner.temp }}/perceptual-real/results.json
            ${{ runner.temp }}/perceptual-real/provenance.json
          if-no-files-found: warn
          retention-days: 14
