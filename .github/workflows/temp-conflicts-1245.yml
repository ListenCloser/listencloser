name: Temporary sync 1245

on:
  push:
    branches: [refactor/1211-ui-system-convergence]

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: package.json
          cache: npm
      - name: Merge current main, preserve newer runtime seams, and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git merge --no-commit --no-ff origin/main || true

          conflicts="$(git diff --name-only --diff-filter=U)"
          expected=$'components/workspace/PitchContourLane.tsx\ncomponents/workspace/RepresentationStack.tsx\ncomponents/workspace/representations/registry.tsx\ntests/e2e/pitch-contour.spec.ts'
          if [[ "$conflicts" != "$expected" ]]; then
            echo "Unexpected conflict set:" >&2
            printf '%s\n' "$conflicts" >&2
            exit 1
          fi

          git checkout --theirs -- components/workspace/PitchContourLane.tsx components/workspace/RepresentationStack.tsx components/workspace/representations/registry.tsx tests/e2e/pitch-contour.spec.ts
          git add components/workspace/PitchContourLane.tsx components/workspace/RepresentationStack.tsx components/workspace/representations/registry.tsx tests/e2e/pitch-contour.spec.ts

          npm ci
          output_dir="$(mktemp -d)"
          npx --yes --package=dependency-cruiser@18.2.0 --package=typescript@5.7.3 depcruise --config .dependency-cruiser.cjs --output-type mermaid --include-only '^(app|components|lib)/' --collapse 2 --output-to "$output_dir/frontend-dependencies.mmd" app components lib
          printf '%s\n' '# Frontend dependency graph' '' '> Generated by dependency-cruiser 18.2.0 with TypeScript 5.7.3 from `.dependency-cruiser.cjs`. Do not hand-edit this graph; regenerate it through the architecture check when frontend imports change.' '' 'This is an orientation view of `app/`, `components/`, and `lib/`. Deeper folders are collapsed to keep the graph reviewable. The architecture rules in `.dependency-cruiser.cjs`, not the picture alone, are the enforceable contract.' '' '```mermaid' > docs/generated/frontend-dependencies.md
          cat "$output_dir/frontend-dependencies.mmd" >> docs/generated/frontend-dependencies.md
          printf '%s\n' '```' >> docs/generated/frontend-dependencies.md
          rm -rf "$output_dir"
          git add docs/generated/frontend-dependencies.md

          rm .github/workflows/temp-conflicts-1245.yml
          git add .github/workflows/temp-conflicts-1245.yml
          test -z "$(git diff --name-only --diff-filter=U)"
          git diff --cached --check
          git commit -m "chore: sync UI convergence with current main"
          git push origin HEAD:refactor/1211-ui-system-convergence
