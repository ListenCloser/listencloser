name: Score engine switching bootstrap

on:
  push:
    branches: [feat/991-score-engine-switching]
    paths:
      - .github/workflows/score-engine-switching-bootstrap.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/991-score-engine-switching
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - name: Apply loaded-score switching changes
        run: python scripts/_apply_score_engine_switching.py
      - name: Lint and typecheck
        run: |
          npm run lint
          npm run typecheck
      - name: Test score artifact selection
        run: npm test -- tests/lib/score-artifacts.test.ts
      - name: Verify repository identity
        run: python scripts/check_repo_identity.py
      - name: Commit frontend score switching slice
        run: |
          git add \
            components/workspace/RepresentationStack.tsx \
            components/workspace/WorkspaceSession.tsx \
            lib/api-client.ts \
            lib/stores/workspace.tsx \
            lib/score-artifacts.ts \
            tests/lib/score-artifacts.test.ts
          git config user.name 'listencloser-ci'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'feat(score): switch interpretations without retranscription'
          git push origin HEAD:feat/991-score-engine-switching
