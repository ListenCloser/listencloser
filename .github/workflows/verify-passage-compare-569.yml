name: Verify passage compare 569

on:
  push:
    branches: [verify/passage-compare-569]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- tests/components/PassageCompare.test.tsx tests/components/InspectorLifecycle.test.tsx tests/components/RepresentationSelectionContinuity.test.tsx
      - run: npm run build
