name: Probe 1233 MidiBERT dependency

on:
  push:
    branches:
      - agent/1233-midibert-runtime

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: 0.12.9
      - name: Resolve Transformers against the real worker graph
        shell: bash
        run: |
          set -euo pipefail
          cd backend
          uv add --group worker 'transformers>=4.40,<5'
          uv sync --group worker --frozen
          uv run --group worker python - <<'PY'
          import torch
          import tensorflow as tf
          import transformers
          from transformers import BertConfig, BertModel

          model = BertModel(BertConfig(
              vocab_size=32,
              hidden_size=32,
              num_hidden_layers=1,
              num_attention_heads=4,
              intermediate_size=64,
          ))
          assert model.config.hidden_size == 32
          print('torch', torch.__version__)
          print('tensorflow', tf.__version__)
          print('transformers', transformers.__version__)
          PY
          cd ..
          git diff --check
      - name: Keep only the verified lock and remove probe scaffolding
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/probe-1233-midibert-deps.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/pyproject.toml backend/uv.lock .github/workflows/probe-1233-midibert-deps.yml
          git commit -m 'chore(midibert): lock verified Transformers runtime'
          git push origin "HEAD:${GITHUB_REF_NAME}"
