name: Verify perceptual comparison client

on:
  push:
    branches: [verify/perceptual-span-comparison-client]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - name: Typecheck generated-contract client
        run: npm run typecheck
      - name: Run focused relation client tests
        run: npm test -- tests/lib/relation-api-client.test.ts
      - name: Lint frontend
        run: npm run lint
