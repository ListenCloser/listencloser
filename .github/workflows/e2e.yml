name: E2E

on:
  workflow_call:
    secrets:
      NEXT_PUBLIC_SENTRY_DSN:
        required: false
      ARGOS_TOKEN:
        required: false
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'backend/**'
      - 'supabase/**'

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: npm
      - name: Restore Next.js build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-mock-${{ hashFiles('package-lock.json') }}-${{ hashFiles('app/**/*', 'components/**/*', 'lib/**/*', 'next.config.mjs', 'package.json', 'tsconfig.json') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-mock-${{ hashFiles('package-lock.json') }}-
      - run: npm ci
      - name: Install Playwright
        run: npx playwright install chromium --with-deps
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_MOCK_ENABLED: "true"
          NEXT_PUBLIC_SUPABASE_URL: "https://cijhpddqvvzyzfzmkdnn.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "e2e-anon-key"
      - name: Start Next.js
        run: npm run start &
        env:
          NODE_ENV: test
          NEXT_PUBLIC_MOCK_ENABLED: "true"
          NEXT_PUBLIC_SUPABASE_URL: "https://cijhpddqvvzyzfzmkdnn.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "e2e-anon-key"
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
      - name: Wait for server
        run: npx wait-on http://localhost:3000
      - name: Run E2E tests
        run: npx playwright test tests/e2e
      - name: Run visual review captures
        run: npx playwright test tests/visual
      - name: Upload visual review screenshots
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-review-screenshots-${{ github.run_attempt }}
          path: screenshots/
          if-no-files-found: error
          retention-days: 7
      - name: Run hosted visual regression
        if: success()
        continue-on-error: true
        run: npx playwright test tests/visual
        env:
          ARGOS_TOKEN: ${{ secrets.ARGOS_TOKEN }}
      - name: Upload Playwright failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-playwright-diagnostics-${{ github.run_attempt }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
