name: Temporary mark multitrack PR ready

on:
  push:
    branches:
      - eval/analysis-v3-multitrack-transcription
    paths:
      - '.github/workflows/tmp-ready-multitrack.yml'

permissions:
  pull-requests: write
  contents: read

jobs:
  ready:
    runs-on: ubuntu-latest
    steps:
      - name: Mark PR 376 ready for review
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr ready 376 --repo gr-rr/hello-ai
