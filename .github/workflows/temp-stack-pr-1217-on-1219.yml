name: Temporary stack PR 1217 on 1219

on:
  push:
    branches:
      - feat/1176-layers-current-main

permissions:
  contents: write

jobs:
  stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Merge cleaned Symbolic Detail head
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin agent/1178-symbolic-detail
          target='origin/agent/1178-symbolic-detail'
          if git merge-base --is-ancestor "$target" HEAD; then
            echo 'Symbolic Detail head already integrated.'
            exit 0
          fi
          set +e
          git merge --no-edit "$target"
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo 'Conflicts:'
            git diff --name-only --diff-filter=U
            exit "$rc"
          fi
          git push origin HEAD:${GITHUB_REF_NAME}
