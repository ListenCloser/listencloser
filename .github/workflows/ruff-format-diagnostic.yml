name: Ruff format diagnostic

on:
  pull_request:

permissions:
  contents: write

jobs:
  format-branch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/product-ui-polish-v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply canonical formatter output
        run: |
          pip install ruff==0.5.7
          ruff format backend/domain/api.py backend/engines/melody/feature_provider.py
          if git diff --quiet -- backend/domain/api.py backend/engines/melody/feature_provider.py; then
            echo "Already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- backend/domain/api.py backend/engines/melody/feature_provider.py
          git commit -m "style: apply canonical ruff formatting"
          git push origin HEAD:design/product-ui-polish-v4
