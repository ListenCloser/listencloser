name: Ruff format diagnostic

on:
  push:
    branches:
      - agent/1235-chordmini-runtime

permissions:
  contents: read

jobs:
  format-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: 0.12.9
      - run: uv sync --project backend --locked
      - name: Show canonical formatter diff
        run: backend/.venv/bin/ruff format --diff backend/engines/harmony/_chordmini_runtime.py backend/engines/registry.py
