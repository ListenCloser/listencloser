name: Repair #1228 frontend dependency snapshot

on:
  push:
    branches:
      - "feat/588-rhythm-density-breakdown-context"

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - name: Regenerate frontend dependency graph
        run: |
          out="$(mktemp -d)"
          npx --yes --package=dependency-cruiser@18.2.0 --package=typescript@5.7.3 depcruise \
            --config .dependency-cruiser.cjs \
            --output-type mermaid \
            --include-only '^(app|components|lib)/' \
            --collapse 2 \
            --output-to "$out/frontend-dependencies.mmd" \
            app components lib
          {
            cat <<'EOF'
          # Frontend dependency graph

          > Generated by dependency-cruiser 18.2.0 with TypeScript 5.7.3 from `.dependency-cruiser.cjs`. Do not hand-edit this graph; regenerate it through the architecture check when frontend imports change.

          This is an orientation view of `app/`, `components/`, and `lib/`. Deeper folders are collapsed to keep the graph reviewable. The architecture rules in `.dependency-cruiser.cjs`, not the picture alone, are the enforceable contract.

          ```mermaid
          EOF
            cat "$out/frontend-dependencies.mmd"
            echo '```'
          } > docs/generated/frontend-dependencies.md
          git diff --check
      - name: Commit generated snapshot and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/repair-1228-frontend-deps.yml
          git add docs/generated/frontend-dependencies.md
          git commit -m "Regenerate frontend dependency graph"
          git push origin HEAD:"feat/588-rhythm-density-breakdown-context"
