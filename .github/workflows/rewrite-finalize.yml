name: One-shot monorepo flatten

on:
  push:
    branches: [rewrite/monorepo-foundation]
    paths: [.github/workflows/rewrite-finalize.yml]

permissions:
  contents: write

concurrency:
  group: rewrite-finalize
  cancel-in-progress: false

jobs:
  flatten:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: rewrite/monorepo-foundation
          token: ${{ secrets.QUEUE_BOT_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: npm

      - name: Flatten backend, reconcile main, and lock architecture tooling
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "listencloser-ci[bot]"
          git config user.email "listencloser-ci[bot]@users.noreply.github.com"
          git fetch origin main
          git merge -s ours --no-commit origin/main

          test -d services/backend
          test ! -e backend
          git mv services/backend backend
          rmdir services

          # Carry the one current-main slice (#1264) into the rewrite's paths.
          git show origin/main:backend/domain/correction_entity_sync.py > backend/domain/correction_entity_sync.py
          mkdir -p backend/tests/integration
          git show origin/main:backend/tests/integration/test_correction_lineage.py > backend/tests/integration/test_correction_lineage.py
          git show origin/main:backend/tests/test_correction_entity_sync.py > backend/tests/test_correction_entity_sync.py

          mkdir -p apps/web/src/components/workspace apps/web/src/components/workspace/representations apps/web/src/lib/stores apps/web/tests
          git show origin/main:components/workspace/PianoRollCorrectionCoordinator.tsx > apps/web/src/components/workspace/PianoRollCorrectionCoordinator.tsx
          git show origin/main:components/workspace/PianoRollCorrectionPanel.tsx > apps/web/src/components/workspace/PianoRollCorrectionPanel.tsx
          git show origin/main:components/workspace/representations/registry.tsx > apps/web/src/components/workspace/representations/registry.tsx
          git show origin/main:lib/correction-client.ts > apps/web/src/lib/correction-client.ts
          git show origin/main:lib/piano-roll-correction.ts > apps/web/src/lib/piano-roll-correction.ts
          git show origin/main:lib/stores/workspace.tsx > apps/web/src/lib/stores/workspace.tsx
          git show origin/main:tests/piano-roll-correction-panel.test.tsx > apps/web/tests/piano-roll-correction-panel.test.tsx
          git show origin/main:tests/piano-roll-correction.test.ts > apps/web/tests/piano-roll-correction.test.ts

          python3 - <<'PY'
          from pathlib import Path

          panel = Path("apps/web/tests/piano-roll-correction-panel.test.tsx")
          text = panel.read_text()
          text = text.replace('../components/workspace/PianoRollCorrectionPanel', '@/components/workspace/PianoRollCorrectionPanel')
          text = text.replace('../lib/piano-roll-correction', '@/lib/piano-roll-correction')
          text = text.replace('../lib/stores/workspace', '@/lib/stores/workspace')
          panel.write_text(text)

          logic = Path("apps/web/tests/piano-roll-correction.test.ts")
          logic.write_text(logic.read_text().replace('../lib/piano-roll-correction', '@/lib/piano-roll-correction'))
          PY

          # Make root backend canonical everywhere; no compatibility path survives.
          while IFS= read -r -d '' file; do
            sed -i 's#services/backend#backend#g' "$file"
          done < <(git grep -Il -z 'services/backend' -- . || true)

          # The temporary services/ namespace added one level to repo-root lookups.
          python3 - <<'PY'
          from pathlib import Path
          import re

          markers = ("REPO_ROOT", "_REPO_ROOT", "ROOT = Path(__file__)", "MIGRATIONS = Path(__file__)", "_FIXTURE = Path(__file__)")
          for path in Path("backend").rglob("*.py"):
              text = path.read_text()
              if any(marker in text for marker in markers):
                  text = re.sub(
                      r"Path\(__file__\)(\.resolve\(\))?\.parents\[(\d+)\]",
                      lambda m: f"Path(__file__){m.group(1) or ''}.parents[{max(0, int(m.group(2)) - 1)}]",
                      text,
                  )
                  path.write_text(text)

          export = Path("backend/export_openapi.py")
          export.write_text(export.read_text().replace(
              'Path(__file__).resolve().parents[2] / "openapi"',
              'Path(__file__).resolve().parents[1] / "openapi"',
          ))
          PY

          # Lock the architecture checker into the web workspace.
          npm install --workspace @listencloser/web --save-dev --save-exact dependency-cruiser@18.2.0 --ignore-scripts --no-audit --no-fund

          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/check.sh")
          text = path.read_text()
          start = text.index("  local depcruise=(")
          end = text.index("\n\n  if (cd apps/web", start)
          replacement = '''  # dependency-cruiser is a locked apps/web dev dependency. --offline makes
          # this required architecture gate fail rather than reaching the registry.
          local depcruise=(npm exec --offline -- depcruise)'''
          path.write_text(text[:start] + replacement + text[end:])

          package = Path("package.json")
          package.write_text(package.read_text().replace("Python services", "Python backend"))
          PY

          # Regenerate the checked dependency graph using the locked binary.
          tmp_graph="$(mktemp)"
          (
            cd apps/web
            npm exec --offline -- depcruise \
              --config .dependency-cruiser.cjs \
              --output-type mermaid \
              --include-only '^src/(app|components|lib)/' \
              --collapse 2 \
              --output-to "$tmp_graph" \
              src/app src/components src/lib
          )
          {
            cat <<'EOF'
          # Frontend dependency graph

          > Generated by dependency-cruiser 18.2.0 with TypeScript 5.7.3 from `apps/web/.dependency-cruiser.cjs`. Do not hand-edit this graph; regenerate it through the architecture check when frontend imports change.

          This is an orientation view of `apps/web/src/app/`, `apps/web/src/components/`, and `apps/web/src/lib/`. Deeper folders are collapsed to keep the graph reviewable. The architecture rules in `apps/web/.dependency-cruiser.cjs`, not the picture alone, are the enforceable contract.

          ```mermaid
          EOF
            cat "$tmp_graph"
            echo '```'
          } > docs/generated/frontend-dependencies.md
          rm -f "$tmp_graph"

          rm -f backend/tests/test_backend_dependency_inventory.py scripts/backend_dependency_inventory.py
          git rm .github/workflows/rewrite-finalize.yml

          if git grep -n 'services/backend' -- .; then
            echo "stale services/backend references remain" >&2
            exit 1
          fi
          test -d backend
          test ! -e services

          git add -A
          git status --short
          git commit -m "refactor: flatten backend and reconcile current main"
          git push origin HEAD:rewrite/monorepo-foundation
