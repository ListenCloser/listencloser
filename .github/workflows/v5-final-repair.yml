name: Apply final V5 E2E repairs

on:
  push:
    branches:
      - design/v5-visual-language-cleanup
    paths:
      - .github/workflows/v5-final-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/v5-visual-language-cleanup
          fetch-depth: 0
      - name: Apply scoped repairs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          css = Path('app/visual-language-v5.css')
          text = css.read_text()
          old = '@media (max-width: 1180px) {\n  .transport-ctrl-text {\n    display: none;\n  }\n}'
          new = '@media (max-width: 980px) {\n  .transport-ctrl-text {\n    display: none;\n  }\n}'
          if old not in text:
              raise SystemExit('expected transport label breakpoint not found')
          css.write_text(text.replace(old, new, 1))

          spec = Path('tests/e2e/real-stack-golden.spec.ts')
          text = spec.read_text()
          old = '    await expect(page.getByText("Selection", { exact: true }).first()).toBeVisible({ timeout: 20_000 });'
          new = '''    const inspectorScope = page.locator("aside.inspector");\n    await expect(inspectorScope.getByRole("button", { name: "Clear selection" })).toBeVisible({ timeout: 20_000 });\n    await expect(inspectorScope.locator(".inspector-scope-value")).toHaveText(/\\d+:\\d{2}–\\d+:\\d{2}/);'''
          if old not in text:
              raise SystemExit('expected stale Selection assertion not found')
          spec.write_text(text.replace(old, new, 1))
          PY
      - name: Commit repairs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/visual-language-v5.css tests/e2e/real-stack-golden.spec.ts
          git diff --cached --check
          git commit -m "fix: align V5 desktop labels and real-stack selection contract"
          git push origin HEAD:design/v5-visual-language-cleanup
