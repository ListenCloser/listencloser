name: Temporary backend validate PR 1259

on:
  push:
    branches:
      - feat/1258-analysis-discovery-parity

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version-file: .python-version
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: '0.12.9'
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install locked backend environment
        working-directory: backend
        run: uv sync --locked
      - name: Ruff
        working-directory: backend
        run: uv run ruff check .
      - name: Harmony registry parity suite
        working-directory: backend
        run: >-
          uv run pytest -q
          tests/test_harmony_engine_registry.py
          tests/test_chordmini_engine.py
          tests/test_engines/test_registry.py
          tests/test_engines/test_lv_chordia.py
