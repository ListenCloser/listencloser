name: Format PR 970 once

on:
  push:
    branches:
      - fix/966-strict-fluidsynth-rendering

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/966-strict-fluidsynth-rendering
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply repository-pinned Ruff formatter and remove this one-shot workflow
        run: |
          python -m pip install 'ruff==0.5.7'
          cd backend
          ruff format music_features.py
          cd ..
          git rm .github/workflows/format-970-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/music_features.py
          git diff --cached --check
          git diff --cached --quiet && exit 1
          git commit -m 'style: apply pinned Ruff formatter'
          git push origin HEAD:fix/966-strict-fluidsynth-rendering
