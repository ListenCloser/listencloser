name: Audit issue 965 once

on:
  push:
    branches:
      - fix/965-delete-describe

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Locate legacy describe capability and consumers
        run: |
          echo '=== describe-related references ==='
          git grep -n -E 'handle_describe|_extract_audio_descriptors|_extract_essentia|_extract_librosa|_KS_MAJOR|_KS_MINOR|_ESSENTIA_UNSUPPORTED_OS|describe:1\.0|"describe"|name=.describe.' -- ':!uv.lock' ':!package-lock.json' || true
          echo '=== neighboring helper references ==='
          git grep -n -E '_merge_adjacent_identical_chords|_NOTES' -- backend || true
          echo '=== loudness / LUFS references in backend ==='
          git grep -n -E 'loudness_lufs|integrated_lufs|Integrated loudness|LUFS|result\["loudness"\]' -- backend || true
          echo '=== capability registrations ==='
          git grep -n -E 'register.*describe|"describe".*handle_describe|handle_describe' -- backend || true
