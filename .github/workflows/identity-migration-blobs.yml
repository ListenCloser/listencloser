name: Identity Migration Blobs

on:
  push:
    branches:
      - chore/finish-listencloser-migration

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create persistence-sensitive transformed blobs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.request
          from pathlib import Path

          token = os.environ["GH_TOKEN"]
          repository = os.environ["GH_REPOSITORY"]

          def create_blob(content: str) -> str:
              body = json.dumps({"content": content, "encoding": "utf-8"}).encode()
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{repository}/git/blobs",
                  data=body,
                  method="POST",
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "Content-Type": "application/json",
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)["sha"]

          for path in ("backend/domain/api.py", "backend/domain/repositories.py"):
              text = Path(path).read_text(encoding="utf-8")
              updated = re.sub(r"hello-ai", "listencloser", text, flags=re.IGNORECASE)
              print(f"MIGRATION_BLOB {path} {create_blob(updated)}")
          PY
