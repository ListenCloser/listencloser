name: Real-stack E2E

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'backend/**'
      - '!backend/evaluation/**'
      - '!backend/tests/**'
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'package.json'
      - 'package-lock.json'
      - 'next.config.mjs'
      - 'tsconfig.json'
      - 'tests/e2e/real-stack-workflow.spec.ts'
      - 'tests/e2e/real-stack-golden.spec.ts'
      - 'playwright.realstack.config.ts'
      - '.github/workflows/real-stack-e2e.yml'
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '!backend/evaluation/**'
      - '!backend/tests/**'
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'package.json'
      - 'package-lock.json'
      - 'next.config.mjs'
      - 'tsconfig.json'
      - 'tests/e2e/real-stack-workflow.spec.ts'
      - 'tests/e2e/real-stack-golden.spec.ts'
      - 'playwright.realstack.config.ts'

concurrency:
  group: real-stack-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-stack:
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.113.0

      - name: Start fresh local Supabase and apply every migration
        run: |
          # The golden path requires Postgres, Kong, PostgREST, Auth, and Storage.
          # A disposable CI probe proved the identical real-audio browser flow with
          # the unrelated local services excluded, avoiding needless cold starts.
          supabase start -x realtime,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      - name: Export Supabase environment
        run: |
          set -euo pipefail
          eval "$(supabase status -o env)"
          # Normalize version-dependent CLI names to the names the backend expects.
          SUPABASE_URL="${SUPABASE_URL:-${API_URL:-http://127.0.0.1:54321}}"
          SUPABASE_ANON_KEY="${SUPABASE_ANON_KEY:-${ANON_KEY}}"
          SUPABASE_SERVICE_ROLE_KEY="${SUPABASE_SERVICE_ROLE_KEY:-${SERVICE_ROLE_KEY}}"
          echo "SUPABASE_URL=$SUPABASE_URL" >> "$GITHUB_ENV"
          echo "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$SUPABASE_SERVICE_ROLE_KEY" >> "$GITHUB_ENV"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: '.python-version'

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.12.6'
          enable-cache: true
          cache-dependency-glob: 'backend/uv.lock'

      - name: Sync locked backend environment
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          uv sync --project backend --locked

      - name: Measure Basic Pitch cold-to-warm reuse
        run: uv run --project backend python -m pytest backend/tests/test_basic_pitch_cache_acceptance.py -s -q

      - name: Restore Beat This checkpoint
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/torch/hub/checkpoints/beat_this-final0.ckpt
          key: ${{ runner.os }}-beat-this-final0-8c328b45f59d8dd3dff219253ff6a8d6482be57d0133a29140e2febbf8eb8331

      - name: Preload pinned Beat This checkpoint
        working-directory: backend
        run: |
          set -euo pipefail
          uv run python -c "from beat_this.inference import load_checkpoint; load_checkpoint('final0')"
          echo "8c328b45f59d8dd3dff219253ff6a8d6482be57d0133a29140e2febbf8eb8331  $HOME/.cache/torch/hub/checkpoints/beat_this-final0.ckpt" | sha256sum --check -

      - name: Start backend API
        run: |
          cd backend
          nohup uv run uvicorn main:app --host 0.0.0.0 --port 8000 > /tmp/backend.log 2>&1 &
          echo $! > /tmp/backend.pid

      - name: Start worker
        run: |
          cd backend
          nohup uv run python worker.py > /tmp/worker.log 2>&1 &
          echo $! > /tmp/worker.pid

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: npm
      - name: Restore Next.js build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-realstack-${{ hashFiles('package-lock.json') }}-${{ hashFiles('app/**/*', 'components/**/*', 'lib/**/*', 'next.config.mjs', 'package.json', 'tsconfig.json') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-realstack-${{ hashFiles('package-lock.json') }}-

      - name: Build frontend against the local stack
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ env.SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_MOCK_ENABLED: "false"
        run: |
          npm ci
          npm run build

      - name: Start frontend
        run: |
          MUSIC_BACKEND_URL=http://127.0.0.1:8000 nohup npm run start > /tmp/frontend.log 2>&1 &
          echo $! > /tmp/frontend.pid

      - name: Wait for the stack to come up
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8000/health/live > /dev/null && curl -sf http://localhost:3000 > /dev/null; then
              echo "stack ready"
              exit 0
            fi
            sleep 2
          done
          echo "stack did not become ready" >&2
          tail -40 /tmp/backend.log || true
          tail -40 /tmp/frontend.log || true
          exit 1

      - name: Run real-stack browser test
        env:
          REAL_AUDIO_FILE: ${{ github.workspace }}/tests/fixtures/real-piano.m4a
          SUPABASE_URL: ${{ env.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ env.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.SUPABASE_SERVICE_ROLE_KEY }}
          BACKEND_URL: "http://127.0.0.1:8000"
        run: |
          npx playwright install chromium --with-deps
          npx playwright test --config=playwright.realstack.config.ts

      - name: Extract understand performance timings
        run: |
          mkdir -p performance-results
          python - <<'PY'
          import json
          from pathlib import Path

          output = []
          for line in Path('/tmp/worker.log').read_text().splitlines():
              try:
                  record = json.loads(line)
              except json.JSONDecodeError:
                  continue
              if record.get('msg') == 'worker_queue_wait':
                  output.append({
                      'msg': 'worker_queue_wait',
                      'capability': record.get('capability'),
                      'duration_seconds': record.get('duration_seconds'),
                  })
              elif record.get('msg') == 'understand_stage_timing':
                  output.append({
                      'msg': 'understand_stage_timing',
                      'stage': record.get('stage'),
                      'outcome': record.get('outcome'),
                      'duration_seconds': record.get('duration_seconds'),
                  })
              elif record.get('msg') == 'understand_operation_timing':
                  output.append({
                      'msg': 'understand_operation_timing',
                      'operation': record.get('operation'),
                      'outcome': record.get('outcome'),
                      'duration_seconds': record.get('duration_seconds'),
                  })

          if not output:
              raise SystemExit('no understand performance records found')
          path = Path('performance-results/understand-stage-timing.jsonl')
          path.write_text(''.join(json.dumps(item, sort_keys=True) + '\n' for item in output))
          print(path.read_text(), end='')
          PY

      - name: Upload understand performance timings
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: understand-stage-timing-${{ github.run_attempt }}
          path: performance-results/understand-stage-timing.jsonl
          if-no-files-found: error
          retention-days: 14

      - name: Collect service logs on failure
        if: failure()
        run: |
          mkdir -p /tmp/real-stack-diagnostics
          cp /tmp/backend.log /tmp/real-stack-diagnostics/backend.log 2>/dev/null || true
          cp /tmp/worker.log /tmp/real-stack-diagnostics/worker.log 2>/dev/null || true
          cp /tmp/frontend.log /tmp/real-stack-diagnostics/frontend.log 2>/dev/null || true
          echo "===== backend ====="; tail -150 /tmp/backend.log || true
          echo "===== worker ====="; tail -150 /tmp/worker.log || true
          echo "===== frontend ====="; tail -150 /tmp/frontend.log || true

      - name: Upload real-stack failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: real-stack-diagnostics-${{ github.run_attempt }}
          path: |
            /tmp/real-stack-diagnostics/
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup || true
