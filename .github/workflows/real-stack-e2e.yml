name: Real-stack E2E

on:
  workflow_call:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '!backend/evaluation/**'
      - '!backend/tests/**'
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'package.json'
      - 'package-lock.json'
      - 'next.config.mjs'
      - 'tsconfig.json'
      - 'supabase/config.toml'
      - 'tests/e2e/real-stack-auth.ts'
      - 'tests/e2e/real-stack-golden.spec.ts'
      - 'playwright.realstack.config.ts'

permissions:
  contents: read

concurrency:
  group: real-stack-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.113.0

      - name: Start fresh local Supabase and apply every migration
        run: |
          # The golden path requires Postgres, Kong, PostgREST, Auth, and Storage.
          # A disposable CI probe proved the identical real-audio browser flow with
          # the unrelated local services excluded, avoiding needless cold starts.
          supabase start -x realtime,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      - name: Export Supabase environment
        run: |
          set -euo pipefail
          eval "$(supabase status -o env)"
          # Normalize version-dependent CLI names to the names the backend expects.
          SUPABASE_URL="${SUPABASE_URL:-${API_URL:-http://127.0.0.1:54321}}"
          SUPABASE_ANON_KEY="${SUPABASE_ANON_KEY:-${ANON_KEY}}"
          SUPABASE_SERVICE_ROLE_KEY="${SUPABASE_SERVICE_ROLE_KEY:-${SERVICE_ROLE_KEY}}"
          SUPABASE_JWT_SECRET="${SUPABASE_JWT_SECRET:-${JWT_SECRET}}"
          {
            echo "SUPABASE_URL=$SUPABASE_URL"
            echo "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SUPABASE_SERVICE_ROLE_KEY"
            echo "SUPABASE_JWT_SECRET=$SUPABASE_JWT_SECRET"
          } >> "$GITHUB_ENV"

      - name: Verify unsupported email Auth methods are disabled
        run: |
          set -euo pipefail

          assert_email_disabled() {
            local path="$1"
            local payload="$2"
            local body
            local status
            local code
            body="$(mktemp)"
            status="$(
              curl --silent --show-error \
                --output "$body" \
                --write-out '%{http_code}' \
                --request POST \
                --header "apikey: ${SUPABASE_ANON_KEY}" \
                --header 'Content-Type: application/json' \
                --data "$payload" \
                "${SUPABASE_URL}${path}"
            )"
            code="$(jq -r '.error_code // .code // empty' "$body")"
            if [[ "$status" -lt 400 || "$code" != "email_provider_disabled" ]]; then
              echo "Expected ${path} to reject email auth with email_provider_disabled; status=${status} code=${code}" >&2
              cat "$body" >&2
              rm -f "$body"
              return 1
            fi
            rm -f "$body"
          }

          assert_email_disabled \
            '/auth/v1/signup' \
            '{"email":"disabled-signup@real-stack.test","password":"disabled-password-1234"}'
          assert_email_disabled \
            '/auth/v1/otp' \
            '{"email":"disabled-otp@real-stack.test","create_user":true}'

      - name: Resolve production harmony routing
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_ENV"
          import re
          from pathlib import Path

          compose = Path("backend/docker-compose.yml").read_text()
          values = re.findall(
              r"^\s+HARMONY_ENGINE:\s*([A-Za-z0-9_.-]+)\s*$",
              compose,
              flags=re.MULTILINE,
          )
          if len(values) != 2 or len(set(values)) != 1:
              raise SystemExit(
                  f"production Compose must declare one shared API/worker HARMONY_ENGINE, got {values}"
              )
          print(f"HARMONY_ENGINE={values[0]}")
          PY

      - name: Build production backend image for the real stack
        run: docker build --tag listencloser-real-stack-backend backend

      - name: Start production-image backend API
        run: |
          nohup docker run --rm \
            --name listencloser-realstack-api \
            --network host \
            -e SUPABASE_URL \
            -e SUPABASE_ANON_KEY \
            -e SUPABASE_SERVICE_ROLE_KEY \
            -e HARMONY_ENGINE \
            listencloser-real-stack-backend \
            > /tmp/backend.log 2>&1 &
          echo $! > /tmp/backend.pid

      - name: Start production-image worker
        run: |
          nohup docker run --rm \
            --name listencloser-realstack-worker \
            --network host \
            -e SUPABASE_URL \
            -e SUPABASE_ANON_KEY \
            -e SUPABASE_SERVICE_ROLE_KEY \
            -e HARMONY_ENGINE \
            --entrypoint python \
            listencloser-real-stack-backend worker.py \
            > /tmp/worker.log 2>&1 &
          echo $! > /tmp/worker.pid

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: npm
      - name: Restore Next.js build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-realstack-${{ hashFiles('package-lock.json') }}-${{ hashFiles('app/**/*', 'components/**/*', 'lib/**/*', 'next.config.mjs', 'package.json', 'tsconfig.json') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-realstack-${{ hashFiles('package-lock.json') }}-

      - name: Build frontend against the local stack
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ env.SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_MOCK_ENABLED: "false"
        run: |
          npm ci
          npm run build

      - name: Start frontend
        run: |
          MUSIC_BACKEND_URL=http://127.0.0.1:8000 nohup npm run start > /tmp/frontend.log 2>&1 &
          echo $! > /tmp/frontend.pid

      - name: Wait for the stack to come up
        run: |
          for _ in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8000/health/live > /dev/null \
              && curl -sf http://127.0.0.1:8000/health/queue | grep -q '"status":"ready"' \
              && curl -sf http://localhost:3000 > /dev/null; then
              echo "stack and worker ready"
              exit 0
            fi
            sleep 2
          done
          echo "stack did not become ready" >&2
          tail -40 /tmp/backend.log || true
          tail -40 /tmp/worker.log || true
          tail -40 /tmp/frontend.log || true
          exit 1

      - name: Verify production harmony engine routing
        run: |
          set -euo pipefail
          routing_json="$(
            docker exec listencloser-realstack-worker \
              python -c 'import json, os; from engines.registry import get_harmony_engine; engine = get_harmony_engine(); print(json.dumps({"configured": os.environ.get("HARMONY_ENGINE"), "selected_engine": engine.provenance.engine, "selected_class": type(engine).__name__}, sort_keys=True))' \
              | tail -1
          )"
          python3 - "$routing_json" "$HARMONY_ENGINE" <<'PY'
          import json
          import sys
          from pathlib import Path

          record = json.loads(sys.argv[1])
          expected = sys.argv[2]
          if record.get("configured") != expected:
              raise SystemExit(
                  f"worker HARMONY_ENGINE mismatch: expected {expected!r}, got {record.get('configured')!r}"
              )
          if not record.get("selected_engine") or not record.get("selected_class"):
              raise SystemExit(f"worker harmony registry returned incomplete provenance: {record}")
          record["source"] = "backend/docker-compose.yml"
          path = Path("/tmp/harmony-engine-routing.json")
          path.write_text(json.dumps(record, sort_keys=True) + "\n")
          print(path.read_text(), end="")
          PY

      - name: Run real-stack browser test with MuseScore artifact observer
        env:
          REAL_AUDIO_FILE: ${{ github.workspace }}/tests/fixtures/real-piano.m4a
          SUPABASE_URL: ${{ env.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ env.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_JWT_SECRET: ${{ env.SUPABASE_JWT_SECRET }}
          BACKEND_URL: "http://127.0.0.1:8000"
        run: |
          set -euo pipefail
          npx playwright install chromium --with-deps

          # The golden path intentionally deletes the Work at the end. Observe
          # the fresh database concurrently so the promotion gate can prove the
          # MuseScore-derived MusicXML and score-playback artifacts existed before
          # that deletion without weakening the deletion contract.
          python3 - <<'PY' > /tmp/musescore-observer.log 2>&1 &
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          base = os.environ["SUPABASE_URL"].rstrip("/")
          service_key = os.environ["SUPABASE_SERVICE_ROLE_KEY"]
          headers = {
              "apikey": service_key,
              "Authorization": f"Bearer {service_key}",
          }

          def get(path: str):
              request = urllib.request.Request(base + path, headers=headers)
              with urllib.request.urlopen(request, timeout=10) as response:
                  return json.load(response)

          deadline = time.monotonic() + 540
          last_error = None
          while time.monotonic() < deadline:
              try:
                  artifacts = get("/rest/v1/artifacts?select=kind")
                  kinds = {row.get("kind") for row in artifacts}
                  versions = get("/rest/v1/artifact_versions?select=metadata")
                  reports = []
                  for row in versions:
                      metadata = row.get("metadata")
                      if isinstance(metadata, dict) and isinstance(metadata.get("notation"), dict):
                          reports.append(metadata["notation"])
                  if (
                      {"musicxml_score", "rendered_score"}.issubset(kinds)
                      and any(report.get("engine") == "musescore" for report in reports)
                  ):
                      print("observed MuseScore MusicXML + rendered score before deletion")
                      raise SystemExit(0)
              except (OSError, urllib.error.URLError, json.JSONDecodeError) as exc:
                  last_error = exc
              time.sleep(1)

          raise SystemExit(f"MuseScore score artifacts/provenance were never observed: {last_error}")
          PY
          observer_pid=$!

          npx playwright test --config=playwright.realstack.config.ts
          wait "$observer_pid"
          cat /tmp/musescore-observer.log

      - name: Extract understand performance timings
        run: |
          mkdir -p performance-results
          python3 - <<'PY'
          import json
          from pathlib import Path

          output = []
          for line in Path('/tmp/worker.log').read_text().splitlines():
              try:
                  record = json.loads(line)
              except json.JSONDecodeError:
                  continue
              if record.get('msg') == 'basic_pitch_prewarm_complete':
                  output.append({
                      'msg': 'basic_pitch_prewarm_complete',
                      'duration_seconds': record.get('duration_s'),
                  })
              elif record.get('msg') == 'librosa_beat_prewarm_complete':
                  output.append({
                      'msg': 'librosa_beat_prewarm_complete',
                      'duration_seconds': record.get('duration_s'),
                  })
              elif record.get('msg') == 'worker_queue_wait':
                  output.append({
                      'msg': 'worker_queue_wait',
                      'capability': record.get('capability'),
                      'duration_seconds': record.get('duration_seconds'),
                  })
              elif record.get('msg') == 'understand_stage_timing':
                  output.append({
                      'msg': 'understand_stage_timing',
                      'stage': record.get('stage'),
                      'outcome': record.get('outcome'),
                      'duration_seconds': record.get('duration_seconds'),
                  })
              elif record.get('msg') == 'understand_operation_timing':
                  output.append({
                      'msg': 'understand_operation_timing',
                      'operation': record.get('operation'),
                      'outcome': record.get('outcome'),
                      'duration_seconds': record.get('duration_seconds'),
                  })

          if not output:
              raise SystemExit('no understand performance records found')
          routing_path = Path('/tmp/harmony-engine-routing.json')
          if not routing_path.exists():
              raise SystemExit('missing verified harmony engine routing evidence')
          routing = json.loads(routing_path.read_text())
          output.insert(0, {'msg': 'engine_routing', **routing})

          path = Path('performance-results/understand-stage-timing.jsonl')
          path.write_text(''.join(json.dumps(item, sort_keys=True) + '\n' for item in output))
          print(path.read_text(), end='')
          PY

      - name: Upload understand performance timings
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: understand-stage-timing-${{ github.run_attempt }}
          path: performance-results/understand-stage-timing.jsonl
          if-no-files-found: error
          retention-days: 14

      - name: Collect service logs on failure
        if: failure()
        run: |
          mkdir -p /tmp/real-stack-diagnostics
          cp /tmp/backend.log /tmp/real-stack-diagnostics/backend.log 2>/dev/null || true
          cp /tmp/worker.log /tmp/real-stack-diagnostics/worker.log 2>/dev/null || true
          cp /tmp/frontend.log /tmp/real-stack-diagnostics/frontend.log 2>/dev/null || true
          cp /tmp/musescore-observer.log /tmp/real-stack-diagnostics/musescore-observer.log 2>/dev/null || true
          echo "===== backend ====="; tail -150 /tmp/backend.log || true
          echo "===== worker ====="; tail -150 /tmp/worker.log || true
          echo "===== frontend ====="; tail -150 /tmp/frontend.log || true
          echo "===== MuseScore observer ====="; cat /tmp/musescore-observer.log || true

      - name: Upload real-stack failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: real-stack-diagnostics-${{ github.run_attempt }}
          path: |
            /tmp/real-stack-diagnostics/
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop production-image backend containers
        if: always()
        run: |
          docker stop listencloser-realstack-api 2>/dev/null || true
          docker stop listencloser-realstack-worker 2>/dev/null || true

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup || true