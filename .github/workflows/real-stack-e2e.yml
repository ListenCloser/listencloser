name: Real-stack E2E

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: real-stack-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.113.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: npm
      - name: Restore Next.js build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-realstack-${{ hashFiles('package-lock.json') }}-${{ hashFiles('app/**/*', 'components/**/*', 'lib/**/*', 'next.config.mjs', 'package.json', 'tsconfig.json') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-realstack-${{ hashFiles('package-lock.json') }}-
      - name: Run canonical real-stack verification
        run: bash scripts/check-real-stack.sh

      - name: Upload real-stack browser performance report
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: import-performance-${{ github.run_attempt }}
          path: test-results/**/import-performance.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload understand performance timings
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: understand-stage-timing-${{ github.run_attempt }}
          path: performance-results/understand-stage-timing.jsonl
          if-no-files-found: error
          retention-days: 14

      - name: Upload real-stack failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: real-stack-diagnostics-${{ github.run_attempt }}
          path: |
            test-results/real-stack-diagnostics/
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
