name: Apply V5 design cleanup

on:
  push:
    branches: [design/v5-visual-language-cleanup]
    paths:
      - '.github/workflows/apply-v5-cleanup.yml'

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/v5-visual-language-cleanup
          fetch-depth: 0
      - name: Apply focused V5 cleanup
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path: str, old: str, new: str):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"expected snippet not found in {path}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1))

          # Next App Router auto-discovers app/icon.svg; keep it identical to the
          # product mark instead of the legacy purple-note favicon.
          Path("app/icon.svg").write_text(Path("public/icon.svg").read_text())

          replace_once(
              "app/layout.tsx",
              'import "./workspace-interactions.css";\n',
              'import "./workspace-interactions.css";\nimport "./visual-language-v5.css";\n',
          )

          # Import is blocked only until the Library project exists, not while an
          # already-saved recording is progressively opening.
          library = Path("components/workspace/LibraryPanel.tsx")
          text = library.read_text()
          text = text.replace(
              '  const [deleteError, setDeleteError] = useState<string | null>(null);\n',
              '  const [deleteError, setDeleteError] = useState<string | null>(null);\n  const importReady = canImport && Boolean(workspace.project);\n',
              1,
          )
          text = text.replace(
              '              disabled={!canImport || workspace.isLoadingWork}\n              aria-label={canImport ? "Import audio" : "Import temporarily unavailable"}\n',
              '              disabled={!importReady}\n              aria-label={importReady ? "Import audio" : "Import unavailable while the library starts"}\n              title={importReady ? "Import audio" : "Import is available when your library is ready"}\n',
              1,
          )
          library.write_text(text)

          # Ask is contextual utility, not a decorative AI sub-product.
          ask = Path("components/workspace/AskPanel.tsx")
          text = ask.read_text()
          text = text.replace(
              'const STARTER_PROMPTS = [\n  "Summarize this piece",\n  "What changes here?",\n  "What is happening harmonically here?",\n];',
              'const WHOLE_WORK_PROMPTS = [\n  "What stands out in this recording?",\n  "Where does the music change?",\n  "Explain the harmony in plain language.",\n];\n\nconst SELECTION_PROMPTS = [\n  "Explain this moment.",\n  "What changes in this selection?",\n  "Why does this passage sound different?",\n];',
              1,
          )
          text = text.replace(
              '    scoreDuration: scoreEntry?.audioUrl ? transport.duration : null,',
              '    scoreDuration: scoreEntry?.measureStarts?.length ? transport.duration : null,',
              1,
          )
          text = text.replace(
              '  const showScope = Boolean(workspace.selection && scope);\n  const conversation = workspace.askConversation;',
              '  const showScope = Boolean(workspace.selection && scope);\n  const starterPrompts = showScope ? SELECTION_PROMPTS : WHOLE_WORK_PROMPTS;\n  const conversation = workspace.askConversation;',
              1,
          )
          text = text.replace(
              '            <div className="ask-empty-mark" aria-hidden="true">∿</div>\n            <strong>Ask about what you hear</strong>\n            <p>Questions use the current piece, playhead, selection, and analysis as context.</p>\n            <div className="ask-prompts">\n              {STARTER_PROMPTS.map((prompt) => (',
              '            <strong>Ask about the current music</strong>\n            <p>Ask for an explanation, comparison, or a closer look at the current selection.</p>\n            <div className="ask-prompts">\n              {starterPrompts.map((prompt) => (',
              1,
          )
          text = text.replace(
              'placeholder={showScope ? "Ask about this selection…" : "Ask about this piece…"}',
              'placeholder={showScope ? "Ask a question about this selection…" : "Ask a question about this recording…"}',
              1,
          )
          ask.write_text(text)

          # Make transport utilities recognizable without requiring users to learn
          # a private icon language.
          transport = Path("components/workspace/TransportBar.tsx")
          text = transport.read_text()
          text = text.replace(
              'className={`transport-ctrl${loopEnabled ? " active" : ""}`}',
              'className={`transport-ctrl transport-ctrl-labeled${loopEnabled ? " active" : ""}`}',
              1,
          )
          text = text.replace('title="Loop"', 'title="Loop entire source"', 1)
          text = text.replace(
              '          </svg>\n        </button>\n        {selectionTimeRange && (',
              '          </svg>\n          <span className="transport-ctrl-text">Loop</span>\n        </button>\n        {selectionTimeRange && (',
              1,
          )
          text = text.replace(
              'className={`transport-ctrl${loopSelectionActive ? " active" : ""}`}',
              'className={`transport-ctrl transport-ctrl-labeled${loopSelectionActive ? " active" : ""}`}',
              1,
          )
          text = text.replace(
              '            </svg>\n          </button>\n        )}',
              '            </svg>\n            <span className="transport-ctrl-text">Region</span>\n          </button>\n        )}',
              1,
          )
          transport.write_text(text)

          # Analysis: interpretation first, metadata as quiet inline facts, raw
          # evidence only when it is interpretable in the active context.
          inspector = Path("components/workspace/Inspector.tsx")
          text = inspector.read_text()
          overview_pattern = re.compile(r'function OverviewRow\(\{ insights \}: \{ insights: Insight\[\] \}\) \{.*?\n\}\n\n(?=function SequenceBlock)', re.S)
          overview = r'''type OverviewItem = { label: string; value: string };

function normalizeMusicText(value: string): string {
  return value
    .replace(/\b([A-G])- (?=(?:major|minor)\b)/g, "$1♭ ")
    .replace(/\s+/g, " ")
    .trim();
}

function cleanOverviewValue(insight: Insight | undefined): string | null {
  if (!insight) return null;
  const value = normalizeMusicText(stripClaimPrefix(insight.claim));
  if (!value || value === "—" || value === "-" || /^(unknown|unavailable|not confidently detected)$/i.test(value)) return null;
  return value;
}

function overviewItems(insights: Insight[]): OverviewItem[] {
  const key = cleanOverviewValue(insights.find((item) => item.kind === "key"));
  const tempo = cleanOverviewValue(
    insights.find((item) => item.kind === "audio_tempo") ?? insights.find((item) => item.kind === "tempo"),
  );
  const meter = cleanOverviewValue(insights.find((item) => item.kind === "time_signature"));
  return [
    key ? { label: "Key", value: key } : null,
    tempo ? { label: "Tempo", value: tempo } : null,
    meter ? { label: "Meter", value: meter } : null,
  ].filter((item): item is OverviewItem => item !== null);
}

function AnalysisOverview({
  insights,
  findings,
  selection,
}: {
  insights: Insight[];
  findings: TemporalFinding[];
  selection: MusicalSelection | null;
}) {
  const items = overviewItems(insights);
  const values = Object.fromEntries(items.map((item) => [item.label, item.value]));
  const summaryParts: string[] = [];

  if (values.Key && values.Tempo && values.Meter) {
    summaryParts.push(`The strongest global reading is ${values.Key}, around ${values.Tempo}, in ${values.Meter}.`);
  } else if (values.Key && values.Tempo) {
    summaryParts.push(`The strongest tonal reading is ${values.Key}, with a pulse near ${values.Tempo}.`);
  } else if (values.Key) {
    summaryParts.push(`The strongest global tonal reading is ${values.Key}.`);
  } else if (values.Tempo) {
    summaryParts.push(`A stable pulse is estimated near ${values.Tempo}.`);
  }

  const firstFinding = findings[0];
  if (firstFinding) {
    const finding = normalizeMusicText(firstFinding.label).replace(/[.]+$/, "");
    summaryParts.push(`The clearest time-linked observation is ${finding} near ${formatTime(firstFinding.startSeconds)}.`);
  }

  if (summaryParts.length === 0) {
    summaryParts.push(
      selection
        ? "There is not enough stable evidence in this selection for a useful high-level claim yet."
        : "There is not enough stable global evidence for a useful high-level claim yet.",
    );
  }

  return (
    <section className="inspector-section inspector-overview-section">
      <div className="inspector-section-heading"><h3>Overview</h3></div>
      <p className="inspector-summary">{summaryParts.join(" ")}</p>
      {items.length > 0 && (
        <dl className="inspector-meta-line" aria-label="Analysis metadata">
          {items.map((item) => (
            <div className="inspector-meta-item" key={item.label}>
              <dt>{item.label}</dt>
              <dd>{item.value}</dd>
            </div>
          ))}
        </dl>
      )}
    </section>
  );
}

'''
          text, count = overview_pattern.subn(overview, text, count=1)
