name: Beat This Lifecycle

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/beat-this-lifecycle.yml'
      - 'backend/evaluation/beat_this_lifecycle.py'
      - 'backend/engines/beats/beat_this_engine.py'
      - 'backend/music_features.py'
      - 'backend/pyproject.toml'
      - 'backend/uv.lock'
      - 'tests/fixtures/real-piano.m4a'

concurrency:
  group: beat-this-lifecycle-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  benchmark:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: '.python-version'

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.12.6'
          enable-cache: true
          cache-dependency-glob: 'backend/uv.lock'

      - name: Sync locked backend environment
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          uv sync --project backend --locked

      - name: Restore Beat This checkpoint
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/torch/hub/checkpoints/beat_this-final0.ckpt
          key: ${{ runner.os }}-beat-this-final0-8c328b45f59d8dd3dff219253ff6a8d6482be57d0133a29140e2febbf8eb8331

      - name: Preload pinned Beat This checkpoint
        working-directory: backend
        run: |
          set -euo pipefail
          uv run python -c "from beat_this.inference import load_checkpoint; load_checkpoint('final0')"
          echo "8c328b45f59d8dd3dff219253ff6a8d6482be57d0133a29140e2febbf8eb8331  $HOME/.cache/torch/hub/checkpoints/beat_this-final0.ckpt" | sha256sum --check -

      - name: Measure production-shaped Beat This model lifecycle
        working-directory: backend
        run: |
          set -euo pipefail
          uv run python -m evaluation.beat_this_lifecycle \
            --input ../tests/fixtures/real-piano.m4a \
            --format m4a \
            --trials 3 \
            --output ../performance-results/beat-this-lifecycle.json

      - name: Upload Beat This lifecycle result
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: beat-this-lifecycle-${{ github.run_attempt }}
          path: performance-results/beat-this-lifecycle.json
          if-no-files-found: error
          retention-days: 30
