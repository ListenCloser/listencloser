name: Temporary C2 API contract generation

on:
  push:
    branches:
      - feat/1254-clamp3-text-passage

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: package.json
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version-file: .python-version
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: 0.12.9
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install frontend dependencies
        run: npm ci
      - name: Sync locked backend environment
        run: uv sync --project backend --locked
      - name: Generate canonical API artifacts
        run: npm run api:generate
      - name: Commit generated artifacts
        shell: bash
        run: |
          if git diff --quiet -- openapi/openapi.json lib/api-types.ts; then
            echo "Generated API artifacts are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add openapi/openapi.json lib/api-types.ts
          git commit -m "chore(api): regenerate C2 passage Find contract"
          git push origin HEAD:${GITHUB_REF_NAME}
