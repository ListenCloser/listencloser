name: Notation PM2S bakeoff

on:
  pull_request:
    paths:
      - "backend/evaluation/pm2s_notation_bakeoff.py"
      - "backend/tests/test_pm2s_notation_bakeoff.py"
      - ".github/workflows/eval-notation-pm2s.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pm2s-bakeoff:
    name: PM2S same-MIDI bakeoff
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    env:
      PYTHONPATH: backend
      PM2S_SHA: 9586f91cd16aaa50dbb82f720f6a34a3e0186f47
      PM2S_REPO: /tmp/PM2S
      PM2S_VENV: /tmp/pm2s-venv
      RESULT_DIR: evaluation/results/pm2s_notation_bakeoff

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up product Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.6"
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Sync locked product environment
        run: |
          uv sync --project backend --locked
          echo "PRODUCT_PYTHON=$(uv run --project backend python -c 'import sys; print(sys.executable)')" >> "$GITHUB_ENV"

      - name: Run evaluator unit tests
        run: |
          uv run --project backend python -m pytest -q backend/tests/test_pm2s_notation_bakeoff.py

      - name: Resolve product baseline
        run: |
          git fetch origin main
          echo "PRODUCT_BASELINE_SHA=$(git merge-base HEAD origin/main)" >> "$GITHUB_ENV"

      - name: Fetch held-out MAESTRO reference MIDI only
        run: |
          "$PRODUCT_PYTHON" - <<'PY'
          import json
          import urllib.request
          import zipfile
          from pathlib import Path

          manifest = json.loads(
              Path("backend/evaluation/corpora/real_world_v1.json").read_text()
          )
          rows = [
              row for row in manifest["clips"]
              if row.get("dataset") == "maestro" and row.get("split") == "test"
          ][:3]
          if len(rows) != 3:
              raise SystemExit(f"expected 3 held-out MAESTRO rows, got {len(rows)}")

          root = Path("evaluation/.cache/pm2s-inputs")
          root.mkdir(parents=True, exist_ok=True)
          archive = root / "maestro-v3.0.0-midi.zip"
          if not archive.exists():
              urllib.request.urlretrieve(
                  "https://storage.googleapis.com/magentadata/datasets/"
                  "maestro/v3.0.0/maestro-v3.0.0-midi.zip",
                  archive,
              )

          inputs = []
          with zipfile.ZipFile(archive) as zf:
              for row in rows:
                  member = f"maestro-v3.0.0/{row['source_id']}"
                  if member not in zf.namelist():
                      raise SystemExit(f"missing MAESTRO member: {member}")
                  path = root / f"{row['id']}.mid"
                  path.write_bytes(zf.read(member))
                  inputs.append(
                      {
                          "clip_id": row["id"],
                          "path": str(path),
                          "start": row["excerpt_start"],
                          "end": row["excerpt_end"],
                          "source_id": row["source_id"],
                          "split": row["split"],
                          "license": row["license"],
                      }
                  )

          (root / "inputs.json").write_text(json.dumps(inputs, indent=2) + "\n")
          PY

      - name: Set up isolated PM2S Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Pin PM2S source
        run: |
          git clone https://github.com/cheriell/PM2S.git "$PM2S_REPO"
          git -C "$PM2S_REPO" checkout "$PM2S_SHA"
          test "$(git -C "$PM2S_REPO" rev-parse HEAD)" = "$PM2S_SHA"

      - name: Install PM2S candidate dependencies in isolated venv
        run: |
          python -m venv "$PM2S_VENV"
          "$PM2S_VENV/bin/python" -m pip install --upgrade pip
          "$PM2S_VENV/bin/python" -m pip install \
            --extra-index-url https://download.pytorch.org/whl/cpu \
            "torch==1.12.1+cpu" \
            "numpy==1.23.5" \
            "pretty-midi==0.2.9" \
            "mir_eval==0.6" \
            "mido==1.2.9" \
            "pandas==1.5.3"

      - name: Run same-MIDI current vs PM2S bakeoff
        run: |
          "$PRODUCT_PYTHON" - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          root = Path("evaluation/.cache/pm2s-inputs")
          rows = json.loads((root / "inputs.json").read_text())
          result_dir = Path(os.environ["RESULT_DIR"])
          result_dir.mkdir(parents=True, exist_ok=True)
          summary = {
              "evaluation_id": "performance_midi_to_readable_score_pm2s_v1",
              "product_baseline_sha": os.environ["PRODUCT_BASELINE_SHA"],
              "dataset": "MAESTRO v3.0.0",
              "split": "test",
              "license": "CC BY-NC-SA 4.0",
              "clips": [],
          }

          for index, row in enumerate(rows):
              output = result_dir / f"{row['clip_id']}.json"
              command = [
                  os.environ["PRODUCT_PYTHON"],
                  "-m",
                  "evaluation.pm2s_notation_bakeoff",
                  "--input-midi",
                  row["path"],
                  "--clip-id",
                  row["clip_id"],
                  "--pm2s-python",
                  f"{os.environ['PM2S_VENV']}/bin/python",
                  "--pm2s-repo",
                  os.environ["PM2S_REPO"],
                  "--output",
                  str(output),
                  "--start",
                  str(row["start"]),
                  "--end",
                  str(row["end"]),
                  "--product-baseline-sha",
                  os.environ["PRODUCT_BASELINE_SHA"],
              ]
              subprocess.run(command, check=True)
              result = json.loads(output.read_text())
              result["dataset_provenance"] = row
              summary["clips"].append(result)

              # A missing/dead research checkpoint is itself a truthful result.
              # Do not spend two more 15-minute timeouts retrying the same setup.
              if index == 0 and result["pm2s"]["status"] != "measured":
                  summary["remaining_clips_skipped"] = len(rows) - 1
                  break

          measured = sum(
              row["pm2s"]["status"] == "measured" for row in summary["clips"]
          )
          summary["pm2s_measured_clips"] = measured
          summary["status"] = "measured" if measured else "candidate_unavailable"
          (result_dir / "summary.json").write_text(
              json.dumps(summary, indent=2) + "\n"
          )
          print(json.dumps(summary, indent=2))
          PY

      - name: Upload bakeoff evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pm2s-notation-bakeoff
          path: |
            evaluation/results/pm2s_notation_bakeoff
            evaluation/.cache/pm2s-inputs/inputs.json
          if-no-files-found: warn
