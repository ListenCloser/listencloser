name: Probe MidiBERT assets

on:
  push:
    branches:
      - agent/1233-midibert-runtime
    paths:
      - .github/workflows/probe-midibert-assets.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Inspect official checkpoint share
        run: |
          set -eux
          python -m pip install --quiet 'gdown>=5,<6'
          python - <<'PY'
          import gdown
          url = "https://drive.google.com/drive/folders/1ceIfC1UugZQHPgpEEMkdAF0VhZ1EeLl3?usp=sharing"
          files = gdown.download_folder(url=url, output="/tmp/midibert-assets", quiet=False, remaining_ok=True, skip_download=True)
          print("GDOWN_BEGIN")
          for item in files or []:
              print(item)
          print("GDOWN_END")
          PY
          curl --fail --location --retry 2 \
            'https://drive.google.com/embeddedfolderview?id=1ceIfC1UugZQHPgpEEMkdAF0VhZ1EeLl3#list' \
            -o /tmp/drive.html || true
          echo DRIVE_HTML_BYTES=$(wc -c </tmp/drive.html 2>/dev/null || echo 0)
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('/tmp/drive.html')
          text = p.read_text(errors='ignore') if p.exists() else ''
          print('DRIVE_MATCHES_BEGIN')
          for pattern in [r'https://drive\.google\.com/file/d/[^"&< ]+', r'[-\w]{20,}']:
              vals=[]
              for v in re.findall(pattern, text):
                  if v not in vals:
                      vals.append(v)
              print(pattern, vals[:80])
          print('DRIVE_MATCHES_END')
          PY
