name: Resolve V5 main drift

on:
  push:
    branches:
      - design/v5-visual-language-cleanup
    paths:
      - .github/workflows/merge-main-into-v5.yml

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/v5-visual-language-cleanup
          fetch-depth: 0
      - name: Merge current main and preserve both product contracts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main

          set +e
          git merge origin/main --no-edit
          merge_status=$?
          set -e

          if [ "$merge_status" -ne 0 ]; then
            unresolved="$(git diff --name-only --diff-filter=U)"
            echo "Unresolved paths: $unresolved"
            if [ "$unresolved" != "lib/representations.tsx" ]; then
              echo "Unexpected merge conflicts; refusing to guess."
              exit 1
            fi

            # #345 owns representation lifetime/caching. Start from its registry
            # contract, then reapply V5's notation-derived Score source and
            # measure-aware duration/follow behavior.
            git checkout --theirs lib/representations.tsx

            python3 - <<'PY'
          from pathlib import Path

          path = Path("lib/representations.tsx")
          text = path.read_text()

          old_setup = '''  const { transport, seek } = useTransport();
          const entry = workspace.representations.find((item) => item.kind === "score");
          const measureStarts = entry?.measureStarts ?? [];
          const scoreDuration = entry?.audioUrl ? transport.duration : null;'''
          new_setup = '''  const { transport, seek, setActiveSource } = useTransport();
          const entry = workspace.representations.find((item) => item.kind === "score");
          const measureStarts = entry?.measureStarts ?? [];
          const scoreSource = transport.sources.find((source) => source.role === "score") ?? null;
          const finalMeasureSpan = measureStarts.length > 1
            ? measureStarts[measureStarts.length - 1] - measureStarts[measureStarts.length - 2]
            : 2;
          const scoreDuration = measureStarts.length > 0
            ? Math.max(transport.duration || 0, measureStarts[measureStarts.length - 1] + Math.max(finalMeasureSpan, 0.25))
            : (transport.duration || null);'''
          if old_setup not in text:
              raise SystemExit("score setup contract not found")
          text = text.replace(old_setup, new_setup, 1)

          old_render = '''    <div className="representation-body">
                <SheetMusic
                  musicXml={entry?.musicxml ?? ""}'''
          new_render = '''    <div className="representation-body">
                <div className="score-playback-strip">
                  {scoreSource ? (
                    transport.activeSource?.role === "score" ? (
                      <span className="score-playback-state">Hearing score</span>
                    ) : (
                      <button type="button" className="score-playback-action" onClick={() => setActiveSource(scoreSource)}>Hear score</button>
                    )
                  ) : (
                    <span className="score-playback-state score-playback-state-muted">Notation audio is unavailable for this saved version.</span>
                  )}
                </div>
                <SheetMusic
                  musicXml={entry?.musicxml ?? ""}'''
          if old_render not in text:
              # Main currently uses two-space component indentation; keep a
              # second exact form so formatting changes don't weaken semantics.
              old_render = '''    <div className="representation-body">
                <SheetMusic
                  musicXml={entry?.musicxml ?? ""}'''
          if old_render not in text:
              old_render = '''    <div className="representation-body">
              <SheetMusic
                musicXml={entry?.musicxml ?? ""}'''
              new_render = new_render.replace("                ", "              ").replace("                  ", "                ")
          if old_render not in text:
              old_render = '''    <div className="representation-body">
      <SheetMusic
        musicXml={entry?.musicxml ?? ""}'''
              new_render = '''    <div className="representation-body">
      <div className="score-playback-strip">
        {scoreSource ? (
          transport.activeSource?.role === "score" ? (
            <span className="score-playback-state">Hearing score</span>
          ) : (
            <button type="button" className="score-playback-action" onClick={() => setActiveSource(scoreSource)}>Hear score</button>
          )
        ) : (
          <span className="score-playback-state score-playback-state-muted">Notation audio is unavailable for this saved version.</span>
        )}
      </div>
      <SheetMusic
        musicXml={entry?.musicxml ?? ""}'''
          if old_render not in text:
              raise SystemExit("score render insertion point not found")
          text = text.replace(old_render, new_render, 1)

          old_props = '''        isScoreActive={active && transport.activeSource?.role === "score"}
                  hasScorePlayback={transport.sources.some((source) => source.role === "score")}'''
          new_props = '''        isScoreActive={active}
                  hasScorePlayback={Boolean(scoreSource)}'''
          if old_props not in text:
              old_props = '''        isScoreActive={active && transport.activeSource?.role === "score"}
        hasScorePlayback={transport.sources.some((source) => source.role === "score")}'''
              new_props = '''        isScoreActive={active}
        hasScorePlayback={Boolean(scoreSource)}'''
          if old_props not in text:
              raise SystemExit("score active/source props not found")
          text = text.replace(old_props, new_props, 1)

          path.write_text(text)
          PY
            git add lib/representations.tsx
          fi

          git rm .github/workflows/merge-main-into-v5.yml
          git add -A
          git diff --cached --check
          git commit --no-edit || git commit -m "merge: reconcile V5 with current main"
          git push origin HEAD:design/v5-visual-language-cleanup
