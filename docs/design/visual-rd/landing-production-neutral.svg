<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#151411"/>
      <stop offset="1" stop-color="#1d1b17"/>
    </linearGradient>
  </defs>
  <rect width="1440" height="900" fill="url(#bg)"/>

  <text x="56" y="56" fill="#d6b56d" font-family="ui-monospace, monospace" font-size="11" letter-spacing="2.8">PRODUCTION-NEUTRAL LANDING COMPOSITION · R&amp;D</text>
  <text x="56" y="82" fill="#777168" font-family="system-ui, sans-serif" font-size="12.5">No sample notes, waveform peaks, timestamps, findings, confidence, playback state, or invented musical data.</text>

  <g transform="translate(56 132)">
    <text x="0" y="0" fill="#777168" font-family="ui-monospace, monospace" font-size="10.5" letter-spacing="2">ONE RECORDING · RELATED VIEWS</text>
    <text x="0" y="76" fill="#f1ece2" font-family="Georgia, serif" font-size="70" letter-spacing="-2.6">Hear a moment.</text>
    <text x="0" y="145" fill="#f1ece2" font-family="Georgia, serif" font-size="70" letter-spacing="-2.6">Keep your place.</text>
    <text x="2" y="194" fill="#aaa398" font-family="system-ui, sans-serif" font-size="15.5">Move between the recording, musical representations, and evidence-backed</text>
    <text x="2" y="218" fill="#aaa398" font-family="system-ui, sans-serif" font-size="15.5">explanation without losing the musical moment you are listening to.</text>
    <rect x="0" y="258" width="166" height="42" rx="7" fill="#d6b56d"/>
    <text x="83" y="284" text-anchor="middle" fill="#1b1914" font-family="system-ui, sans-serif" font-size="12.5" font-weight="650">Continue with Google</text>
    <text x="0" y="327" fill="#6f6a62" font-family="system-ui, sans-serif" font-size="10">Your recordings stay private to your account.</text>
  </g>

  <g transform="translate(710 120)">
    <rect width="670" height="390" rx="16" fill="#211f1b" stroke="#f1ece2" stroke-opacity=".08"/>
    <text x="24" y="34" fill="#858077" font-family="ui-monospace, monospace" font-size="10.5" letter-spacing="1.8">SHARED MUSICAL TIME</text>
    <text x="646" y="34" text-anchor="end" fill="#68635b" font-family="system-ui, sans-serif" font-size="10.5">structure before data exists</text>
    <line x1="24" y1="56" x2="646" y2="56" stroke="#f1ece2" stroke-opacity=".07"/>

    <g font-family="ui-monospace, monospace" font-size="10" fill="#777168" letter-spacing="1.2">
      <text x="24" y="107">AUDIO</text>
      <text x="24" y="177">NOTES</text>
      <text x="24" y="247">NOTATION</text>
      <text x="24" y="317">EVIDENCE</text>
    </g>

    <g stroke="#f1ece2" stroke-opacity=".08">
      <rect x="116" y="82" width="520" height="38" rx="6" fill="#f1ece2" fill-opacity=".012"/>
      <rect x="116" y="152" width="520" height="38" rx="6" fill="#f1ece2" fill-opacity=".012"/>
      <rect x="116" y="222" width="520" height="38" rx="6" fill="#f1ece2" fill-opacity=".012"/>
      <rect x="116" y="292" width="520" height="38" rx="6" fill="#f1ece2" fill-opacity=".012"/>
    </g>

    <g stroke="#f1ece2" stroke-opacity=".055">
      <path d="M156 82v248M260 82v248M364 82v248M468 82v248M572 82v248"/>
    </g>

    <!-- Deliberately empty representation-specific structure. -->
    <line x1="136" y1="101" x2="616" y2="101" stroke="#a19b90" stroke-opacity=".25"/>
    <g stroke="#9a9489" stroke-opacity=".16">
      <path d="M136 166h480M136 174h480"/>
      <path d="M136 232h480M136 238h480M136 244h480M136 250h480"/>
    </g>
    <line x1="136" y1="311" x2="616" y2="311" stroke="#9a9489" stroke-opacity=".16" stroke-width="5" stroke-linecap="round"/>

    <!-- Neutral alignment guide: not playback, evidence, or selection state. -->
    <line x1="390" y1="72" x2="390" y2="344" stroke="#c6c0b5" stroke-opacity=".4" stroke-width="1.5" stroke-dasharray="3 5"/>
    <rect x="344" y="348" width="92" height="20" rx="10" fill="#2b2924" stroke="#f1ece2" stroke-opacity=".08"/>
    <text x="390" y="362" text-anchor="middle" fill="#8d887f" font-family="ui-monospace, monospace" font-size="9.5">SAME MOMENT</text>
  </g>

  <line x1="56" y1="564" x2="1384" y2="564" stroke="#f1ece2" stroke-opacity=".075"/>

  <g transform="translate(56 610)">
    <g>
      <text x="0" y="0" fill="#777168" font-family="ui-monospace, monospace" font-size="10.5" letter-spacing="1.8">01 · LISTEN</text>
      <text x="0" y="38" fill="#ddd7cc" font-family="Georgia, serif" font-size="26">The recording stays primary.</text>
      <text x="0" y="68" fill="#8d887f" font-family="system-ui, sans-serif" font-size="12.5">Start with the saved audio. Understanding can arrive around it.</text>
    </g>
    <g transform="translate(450 0)">
      <text x="0" y="0" fill="#777168" font-family="ui-monospace, monospace" font-size="10.5" letter-spacing="1.8">02 · SEE</text>
      <text x="0" y="38" fill="#ddd7cc" font-family="Georgia, serif" font-size="26">Change view, not position.</text>
      <text x="0" y="68" fill="#8d887f" font-family="system-ui, sans-serif" font-size="12.5">Waveform, notes, and notation share one orienting musical time.</text>
    </g>
    <g transform="translate(900 0)">
      <text x="0" y="0" fill="#777168" font-family="ui-monospace, monospace" font-size="10.5" letter-spacing="1.8">03 · EXPLAIN</text>
      <text x="0" y="38" fill="#ddd7cc" font-family="Georgia, serif" font-size="26">Return claims to evidence.</text>
      <text x="0" y="68" fill="#8d887f" font-family="system-ui, sans-serif" font-size="12.5">Analysis and Ask should point back to supported musical context.</text>
    </g>
  </g>

  <rect x="56" y="786" width="1328" height="64" rx="10" fill="#201f1b" stroke="#f1ece2" stroke-opacity=".065"/>
  <text x="78" y="812" fill="#d6b56d" font-family="ui-monospace, monospace" font-size="10.5" letter-spacing="1.6">IMPLEMENTATION RULE</text>
  <text x="78" y="835" fill="#918b80" font-family="system-ui, sans-serif" font-size="12">This composition can ship before a canonical demo exists because every visible rail is structural. Replace empty rails with one real recording only when all rendered layers are sourced from persisted evidence.</text>
</svg>
