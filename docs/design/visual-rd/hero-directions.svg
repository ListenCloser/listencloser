<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#11110f"/><stop offset="1" stop-color="#181713"/></linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#8d6f35"/><stop offset=".55" stop-color="#d6b56d"/><stop offset="1" stop-color="#f0eadf"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d6b56d"/><stop offset=".5" stop-color="#72a9c4"/><stop offset="1" stop-color="#7b6dd8"/></linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="12"/></filter>
  </defs>
  <rect width="1440" height="900" fill="url(#bg)"/>
  <text x="54" y="64" fill="#d6b56d" font-family="ui-monospace, monospace" font-size="13" letter-spacing="3">HELLO-AI · VISUAL ENHANCEMENT SOT</text>
  <text x="54" y="112" fill="#f0eadf" font-family="Georgia, serif" font-size="44">Hero directions</text>
  <text x="54" y="143" fill="#8f897e" font-family="system-ui, sans-serif" font-size="15">Ranked by product fit, polish, motion discipline, and ability to extend beyond marketing.</text>

  <!-- Recommended card -->
  <g transform="translate(54 190)">
    <rect width="840" height="430" rx="20" fill="#1d1c18" stroke="#d6b56d" stroke-opacity=".35"/>
    <rect x="20" y="20" width="122" height="28" rx="14" fill="#d6b56d"/>
    <text x="81" y="39" text-anchor="middle" fill="#211f1b" font-family="system-ui" font-weight="700" font-size="11">RECOMMENDED</text>
    <text x="28" y="92" fill="#f0eadf" font-family="Georgia, serif" font-size="42">3 · Signal Landscape</text>
    <text x="28" y="125" fill="#9d968a" font-family="system-ui" font-size="15">Topo / spectral surface derived from signal geometry. One slow living object.</text>
    <g transform="translate(360 44)">
      <path d="M0 300 C70 240 120 260 180 205 C235 154 280 189 338 120 C390 57 454 95 512 30" fill="none" stroke="#f0eadf" stroke-opacity=".85" stroke-width="2"/>
      <path d="M0 313 C70 253 122 273 182 218 C238 167 282 202 340 133 C392 70 456 108 514 43" fill="none" stroke="#f0eadf" stroke-opacity=".65"/>
      <path d="M0 326 C70 266 124 286 184 231 C241 180 285 215 343 146 C395 83 459 121 517 56" fill="none" stroke="#d6b56d" stroke-opacity=".7"/>
      <path d="M0 339 C72 279 126 299 186 244 C244 193 288 228 346 159 C398 96 462 134 520 69" fill="none" stroke="#d6b56d" stroke-opacity=".42"/>
      <path d="M0 352 C74 292 128 312 188 257 C247 206 291 241 349 172 C401 109 465 147 523 82" fill="none" stroke="#72a9c4" stroke-opacity=".32"/>
      <path d="M0 365 C76 305 130 325 190 270 C250 219 294 254 352 185 C404 122 468 160 526 95" fill="none" stroke="#f0eadf" stroke-opacity=".18"/>
      <circle cx="343" cy="146" r="4" fill="#d6b56d"/><circle cx="184" cy="231" r="3" fill="#72a9c4"/><circle cx="459" cy="121" r="3" fill="#f0eadf"/>
    </g>
    <text x="28" y="181" fill="#d6b56d" font-family="ui-monospace, monospace" font-size="12">MOTION</text>
    <text x="28" y="206" fill="#c6c0b5" font-family="system-ui" font-size="14">16–24s low-amplitude contour drift · one 28s trace · freezes under reduced motion.</text>
    <text x="28" y="257" fill="#d6b56d" font-family="ui-monospace, monospace" font-size="12">WHY IT WINS</text>
    <text x="28" y="282" fill="#c6c0b5" font-family="system-ui" font-size="14">Distinctive without generic “AI chrome”; music/data-native; can become a system, not a hero-only trick.</text>
    <text x="28" y="333" fill="#d6b56d" font-family="ui-monospace, monospace" font-size="12">EXTENDS TO</text>
    <text x="28" y="358" fill="#c6c0b5" font-family="system-ui" font-size="14">Landing transitions · upload→waveform · truthful processing states · empty canvas texture · evidence jump pulse.</text>
    <text x="28" y="405" fill="#777168" font-family="system-ui" font-size="12">Implementation target: SVG/CSS first. No shader / canvas / pointer parallax unless later evidence justifies it.</text>
  </g>

  <!-- Secondary refs -->
  <g transform="translate(922 190)">
    <rect width="464" height="132" rx="16" fill="#1d1c18" stroke="#f0eadf" stroke-opacity=".1"/>
    <text x="22" y="34" fill="#d6b56d" font-family="ui-monospace" font-size="11">REFERENCE / FORK</text>
    <text x="22" y="65" fill="#f0eadf" font-family="Georgia, serif" font-size="25">Background Paths</text>
    <path d="M250 97 C295 38 338 120 438 51" fill="none" stroke="url(#blue)" stroke-width="2"/><path d="M250 110 C300 56 350 129 438 72" fill="none" stroke="#f0eadf" stroke-opacity=".25"/>
    <text x="22" y="101" fill="#9d968a" font-family="system-ui" font-size="12">Borrow SVG path composition + timing.</text>
    <text x="22" y="119" fill="#777168" font-family="system-ui" font-size="11">Do not inherit generic gradient-title styling.</text>
  </g>
  <g transform="translate(922 339)">
    <rect width="464" height="132" rx="16" fill="#1d1c18" stroke="#f0eadf" stroke-opacity=".1"/>
    <text x="22" y="34" fill="#d6b56d" font-family="ui-monospace" font-size="11">REFERENCE / MOTION</text>
    <text x="22" y="65" fill="#f0eadf" font-family="Georgia, serif" font-size="25">Entropy</text>
    <g opacity=".8"><path d="M260 103 C306 20 342 118 438 44" fill="none" stroke="#a99af8"/><path d="M260 92 C302 30 360 108 438 60" fill="none" stroke="#72a9c4"/><path d="M260 112 C316 53 368 122 438 82" fill="none" stroke="#d6b56d"/></g>
    <text x="22" y="101" fill="#9d968a" font-family="system-ui" font-size="12">Borrow organic order→structure motion language.</text>
    <text x="22" y="119" fill="#777168" font-family="system-ui" font-size="11">Too busy as a persistent whole-page background.</text>
  </g>
  <g transform="translate(922 488)">
    <rect width="464" height="132" rx="16" fill="#1d1c18" stroke="#f0eadf" stroke-opacity=".1"/>
    <text x="22" y="34" fill="#d6b56d" font-family="ui-monospace" font-size="11">REFERENCE / COMPOSITION</text>
    <text x="22" y="65" fill="#f0eadf" font-family="Georgia, serif" font-size="25">Liquid Metal / Halide</text>
    <path d="M278 106 C297 49 323 51 340 86 C355 117 379 112 397 57 C412 14 435 20 448 48" fill="none" stroke="#f0eadf" stroke-width="12" stroke-linecap="round" opacity=".55"/>
    <text x="22" y="101" fill="#9d968a" font-family="system-ui" font-size="12">Borrow one-object confidence + strong negative space.</text>
    <text x="22" y="119" fill="#777168" font-family="system-ui" font-size="11">Reject shader identity, 3D theater, persistent parallax.</text>
  </g>

  <!-- System scale -->
  <g transform="translate(54 660)">
    <text x="0" y="0" fill="#f0eadf" font-family="Georgia, serif" font-size="26">Expression should decay as users move into the tool</text>
    <line x1="0" y1="48" x2="1332" y2="48" stroke="#f0eadf" stroke-opacity=".12"/>
    <g font-family="system-ui" font-size="13">
      <text x="0" y="83" fill="#d6b56d">LANDING HERO · 8/10</text><text x="0" y="106" fill="#9d968a">slow animated landscape</text>
      <text x="272" y="83" fill="#d6b56d">LANDING BODY · 4/10</text><text x="272" y="106" fill="#9d968a">sparse path fragments</text>
      <text x="544" y="83" fill="#d6b56d">IMPORT / PROCESSING · 4/10</text><text x="544" y="106" fill="#9d968a">state-linked transitions only</text>
      <text x="856" y="83" fill="#d6b56d">WORKSPACE · 1/10</text><text x="856" y="106" fill="#9d968a">static texture + micro-feedback</text>
      <text x="1110" y="83" fill="#d6b56d">BRAND · STATIC</text><text x="1110" y="106" fill="#9d968a">16px-first abstract glyph</text>
    </g>
    <rect x="0" y="146" width="1332" height="62" rx="12" fill="#211f1b" stroke="#f0eadf" stroke-opacity=".08"/>
    <text x="20" y="173" fill="#d6b56d" font-family="ui-monospace" font-size="11">ANTI-SLOP RULE</text>
    <text x="20" y="196" fill="#c6c0b5" font-family="system-ui" font-size="13">A visual effect earns its place only if it explains the product, communicates real state, improves manipulation/orientation, or establishes memorable identity without competing with music.</text>
  </g>
</svg>