<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#12110f"/><stop offset="1" stop-color="#191814"/></linearGradient></defs>
  <rect width="1200" height="760" fill="url(#bg)"/>
  <text x="50" y="58" fill="#d6b56d" font-family="ui-monospace, monospace" font-size="12" letter-spacing="3">HELLO-AI · BRAND R&amp;D</text>
  <text x="50" y="105" fill="#f0eadf" font-family="Georgia, serif" font-size="40">Logo / favicon: deliberately unresolved</text>
  <text x="50" y="136" fill="#8f897e" font-family="system-ui" font-size="14">Recommendation: leave the current production mark alone until interaction identity is stronger. No candidate below is a preferred lane.</text>

  <g transform="translate(50 188)">
    <rect width="1100" height="110" rx="18" fill="#211f1b" stroke="#d6b56d" stroke-opacity=".26"/>
    <text x="24" y="35" fill="#d6b56d" font-family="ui-monospace" font-size="11">KEEP UNRESOLVED</text>
    <text x="24" y="65" fill="#f0eadf" font-family="Georgia, serif" font-size="25">A logo redesign is not a prerequisite for visual polish.</text>
    <text x="24" y="91" fill="#9c9589" font-family="system-ui" font-size="12.5">The product’s more defensible identity may emerge from shared musical time, evidence-linked interaction, and representation continuity before it emerges from a glyph.</text>
  </g>

  <!-- rejected sketches -->
  <g transform="translate(50 330)">
    <rect width="330" height="205" rx="18" fill="#1f1e1a" stroke="#f0eadf" stroke-opacity=".08"/>
    <text x="20" y="30" fill="#b98272" font-family="ui-monospace" font-size="11">DELETE AS PREFERRED LANE</text>
    <text x="20" y="59" fill="#f0eadf" font-family="Georgia, serif" font-size="23">Contour Fold</text>
    <path d="M42 128 C78 43 116 175 158 71 C193 -17 229 154 284 51" fill="none" stroke="#d6b56d" stroke-width="7" stroke-linecap="round"/>
    <text x="20" y="181" fill="#8f897e" font-family="system-ui" font-size="11.5">Still collapses to “waveform / squiggle” at favicon scale.</text>
  </g>

  <g transform="translate(435 330)">
    <rect width="330" height="205" rx="18" fill="#1f1e1a" stroke="#f0eadf" stroke-opacity=".08"/>
    <text x="20" y="30" fill="#b98272" font-family="ui-monospace" font-size="11">DELETE</text>
    <text x="20" y="59" fill="#f0eadf" font-family="Georgia, serif" font-size="23">Playhead Notch</text>
    <circle cx="165" cy="120" r="47" fill="none" stroke="#f0eadf" stroke-width="11" stroke-dasharray="122 33" transform="rotate(-79 165 120)"/>
    <path d="M165 72l-8 28h16z" fill="#d6b56d"/>
    <text x="20" y="181" fill="#8f897e" font-family="system-ui" font-size="11.5">Legible, but too close to generic media/time-control iconography.</text>
  </g>

  <g transform="translate(820 330)">
    <rect width="330" height="205" rx="18" fill="#1f1e1a" stroke="#f0eadf" stroke-opacity=".08"/>
    <text x="20" y="30" fill="#b98272" font-family="ui-monospace" font-size="11">DELETE FOR FAVICON</text>
    <text x="20" y="59" fill="#f0eadf" font-family="Georgia, serif" font-size="23">Continuous → Discrete</text>
    <g transform="translate(50 82)"><circle cx="5" cy="35" r="2" fill="#f0eadf" opacity=".35"/><circle cx="20" cy="30" r="3" fill="#f0eadf"/><circle cx="39" cy="22" r="4" fill="#d6b56d"/><rect x="70" y="14" width="12" height="12" rx="3" fill="#d6b56d"/><rect x="99" y="6" width="16" height="16" rx="3" fill="#d6b56d"/><rect x="136" y="24" width="20" height="20" rx="4" fill="#f0eadf"/><rect x="184" y="4" width="28" height="28" rx="5" fill="#d6b56d"/></g>
    <text x="20" y="181" fill="#8f897e" font-family="system-ui" font-size="11.5">Useful metaphor elsewhere; wrong compression target for 16×16.</text>
  </g>

  <g transform="translate(50 582)">
    <text x="0" y="0" fill="#f0eadf" font-family="Georgia, serif" font-size="27">Acceptance test for any future replacement</text>
    <rect x="0" y="28" width="1100" height="118" rx="16" fill="#211f1b" stroke="#f0eadf" stroke-opacity=".08"/>
    <text x="22" y="58" fill="#c7c0b5" font-family="system-ui" font-size="12.5">1. Pure monochrome silhouette remains recognizable at 16×16.</text>
    <text x="22" y="82" fill="#c7c0b5" font-family="system-ui" font-size="12.5">2. Does not primarily read as waveform, equalizer, music note, sparkle, or generic playhead.</text>
    <text x="22" y="106" fill="#c7c0b5" font-family="system-ui" font-size="12.5">3. Works in signed-in chrome, boot state, dark/light surfaces, 32px and 16px side-by-side.</text>
    <text x="22" y="130" fill="#8b857a" font-family="system-ui" font-size="11.5">Until a candidate clears this bar, the current production mark wins by default.</text>
  </g>
</svg>
