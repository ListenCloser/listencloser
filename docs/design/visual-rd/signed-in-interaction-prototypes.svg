<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 980">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#11110f"/><stop offset="1" stop-color="#191814"/></linearGradient>
  </defs>
  <rect width="1440" height="980" fill="url(#bg)"/>
  <text x="52" y="58" fill="#d6b56d" font-family="ui-monospace, monospace" font-size="12" letter-spacing="3">HELLO-AI · SIGNED-IN INTERACTION R&amp;D</text>
  <text x="52" y="108" fill="#f0eadf" font-family="Georgia, serif" font-size="42">Wow factor through product behavior</text>
  <text x="52" y="139" fill="#90897e" font-family="system-ui" font-size="14">Two high-priority prototypes to validate before spending more design-engineering time on hero spectacle.</text>

  <!-- Upload flow -->
  <g transform="translate(52 190)">
    <rect width="1336" height="300" rx="20" fill="#1d1c18" stroke="#f0eadf" stroke-opacity=".08"/>
    <text x="24" y="38" fill="#d6b56d" font-family="ui-monospace" font-size="11" letter-spacing="2">KEEP / BUILD · 01</text>
    <text x="24" y="73" fill="#f0eadf" font-family="Georgia, serif" font-size="28">Upload → real waveform continuity</text>
    <text x="24" y="99" fill="#8f897e" font-family="system-ui" font-size="12.5">The file does not disappear into a spinner. The first real decoded waveform becomes the same object the user continues to work with.</text>

    <!-- step 1 -->
    <g transform="translate(24 130)">
      <rect width="280" height="130" rx="14" fill="#23211d" stroke="#f0eadf" stroke-opacity=".09"/>
      <text x="16" y="24" fill="#777168" font-family="ui-monospace" font-size="10">1 · IMPORT</text>
      <rect x="18" y="38" width="244" height="58" rx="9" fill="#191815" stroke="#d6b56d" stroke-opacity=".23" stroke-dasharray="5 5"/>
      <text x="140" y="62" text-anchor="middle" fill="#f0eadf" font-family="system-ui" font-size="13">piano-demo.m4a</text>
      <text x="140" y="82" text-anchor="middle" fill="#8d867b" font-family="system-ui" font-size="11">Drop or choose audio</text>
      <text x="18" y="117" fill="#777168" font-family="system-ui" font-size="10.5">44px+ action target · no decorative motion required</text>
    </g>

    <!-- arrow -->
    <path d="M322 195h42" stroke="#d6b56d" stroke-opacity=".45"/><path d="M357 190l8 5-8 5" fill="none" stroke="#d6b56d"/>

    <!-- step 2 -->
    <g transform="translate(380 130)">
      <rect width="280" height="130" rx="14" fill="#23211d" stroke="#f0eadf" stroke-opacity=".09"/>
      <text x="16" y="24" fill="#777168" font-family="ui-monospace" font-size="10">2 · DECODE</text>
      <text x="18" y="55" fill="#f0eadf" font-family="system-ui" font-size="13">Preparing audio…</text>
      <rect x="18" y="70" width="244" height="4" rx="2" fill="#343129"/>
      <rect x="18" y="70" width="86" height="4" rx="2" fill="#d6b56d"/>
      <text x="18" y="98" fill="#8d867b" font-family="system-ui" font-size="11">Do not fabricate waveform/evidence yet.</text>
      <text x="18" y="117" fill="#777168" font-family="system-ui" font-size="10.5">State copy reflects the real pipeline.</text>
    </g>

    <path d="M678 195h42" stroke="#d6b56d" stroke-opacity=".45"/><path d="M713 190l8 5-8 5" fill="none" stroke="#d6b56d"/>

    <!-- step 3 -->
    <g transform="translate(736 130)">
      <rect width="280" height="130" rx="14" fill="#23211d" stroke="#d6b56d" stroke-opacity=".18"/>
      <text x="16" y="24" fill="#777168" font-family="ui-monospace" font-size="10">3 · AUDIO READY</text>
      <path d="M18 73 C26 73 29 55 36 55 C44 55 47 89 55 89 C63 89 66 45 74 45 C82 45 85 79 94 79 C102 79 105 59 114 59 C123 59 126 93 135 93 C144 93 147 50 156 50 C165 50 169 82 178 82 C187 82 190 62 199 62 C208 62 211 86 220 86 C230 86 235 66 244 66 C251 66 256 73 262 73" fill="none" stroke="#f0eadf" stroke-width="2.2" stroke-linecap="round"/>
      <line x1="18" y1="73" x2="262" y2="73" stroke="#f0eadf" stroke-opacity=".05"/>
      <circle cx="150" cy="73" r="3" fill="#d6b56d"/>
      <text x="18" y="117" fill="#8d867b" font-family="system-ui" font-size="10.5">The real waveform becomes the persistent object.</text>
    </g>

    <path d="M1034 195h42" stroke="#d6b56d" stroke-opacity=".45"/><path d="M1069 190l8 5-8 5" fill="none" stroke="#d6b56d"/>

    <!-- step 4 -->
    <g transform="translate(1092 130)">
      <rect width="220" height="130" rx="14" fill="#23211d" stroke="#f0eadf" stroke-opacity=".09"/>
      <text x="16" y="24" fill="#777168" font-family="ui-monospace" font-size="10">4 · EVIDENCE ARRIVES</text>
      <text x="18" y="51" fill="#c8c1b5" font-family="system-ui" font-size="11">Audio</text><text x="193" y="51" text-anchor="end" fill="#9ec9a7" font-family="system-ui" font-size="11">Ready ✓</text>
      <text x="18" y="72" fill="#c8c1b5" font-family="system-ui" font-size="11">Timing</text><text x="193" y="72" text-anchor="end" fill="#9ec9a7" font-family="system-ui" font-size="11">Ready ✓</text>
      <text x="18" y="93" fill="#c8c1b5" font-family="system-ui" font-size="11">Transcription</text><text x="193" y="93" text-anchor="end" fill="#d6b56d" font-family="system-ui" font-size="11">Processing…</text>
      <text x="18" y="114" fill="#8d867b" font-family="system-ui" font-size="10.5">Animation follows truth, never invents it.</text>
    </g>
  </g>

  <!-- Evidence jump flow -->
  <g transform="translate(52 530)">
    <rect width="1336" height="315" rx="20" fill="#1d1c18" stroke="#f0eadf" stroke-opacity=".08"/>
    <text x="24" y="38" fill="#d6b56d" font-family="ui-monospace" font-size="11" letter-spacing="2">KEEP / BUILD · 02</text>
    <text x="24" y="73" fill="#f0eadf" font-family="Georgia, serif" font-size="28">Breakdown / Ask → evidence jump with shared-time feedback</text>
    <text x="24" y="99" fill="#8f897e" font-family="system-ui" font-size="12.5">Language feels intelligent because it visibly resolves back to the music. Target total emphasis: ~500–900ms, then disappear.</text>

    <!-- left inspector -->
    <g transform="translate(24 128)">
      <rect width="330" height="150" rx="14" fill="#25231f" stroke="#f0eadf" stroke-opacity=".08"/>
      <text x="16" y="26" fill="#777168" font-family="ui-monospace" font-size="10">BREAKDOWN · 00:17.6–00:19.2</text>
      <text x="16" y="56" fill="#f0eadf" font-family="system-ui" font-size="14">Activity increases around this moment.</text>
      <text x="16" y="80" fill="#8f897e" font-family="system-ui" font-size="11.5">Supported by time-aligned evidence.</text>
      <rect x="16" y="101" width="74" height="34" rx="7" fill="#d6b56d"/><text x="53" y="122" text-anchor="middle" fill="#211f1b" font-family="system-ui" font-size="11" font-weight="700">Show</text>
      <rect x="98" y="101" width="74" height="34" rx="7" fill="#302d27" stroke="#f0eadf" stroke-opacity=".1"/><text x="135" y="122" text-anchor="middle" fill="#e6dfd3" font-family="system-ui" font-size="11">Loop</text>
      <text x="188" y="122" fill="#777168" font-family="system-ui" font-size="10.5">Tap target ≥44px in production</text>
    </g>

    <path d="M377 204h58" stroke="#d6b56d" stroke-opacity=".45"/><path d="M427 199l8 5-8 5" fill="none" stroke="#d6b56d"/>

    <!-- timeline stage -->
    <g transform="translate(450 128)">
      <rect width="580" height="150" rx="14" fill="#211f1b" stroke="#f0eadf" stroke-opacity=".08"/>
      <text x="16" y="25" fill="#777168" font-family="ui-monospace" font-size="10">SHARED MUSICAL TIME</text>
      <g stroke="#f0eadf" stroke-opacity=".045"><line x1="150" y1="34" x2="150" y2="130"/><line x1="270" y1="34" x2="270" y2="130"/><line x1="390" y1="34" x2="390" y2="130"/><line x1="510" y1="34" x2="510" y2="130"/></g>
      <path d="M18 76 C32 76 36 56 49 56 C62 56 67 96 80 96 C93 96 98 47 111 47 C125 47 131 88 144 88 C159 88 164 62 178 62 C192 62 196 101 211 101 C226 101 231 52 246 52 C262 52 267 85 282 85 C298 85 304 66 320 66 C337 66 342 94 359 94 C375 94 381 44 398 44 C416 44 421 88 438 88 C455 88 461 62 478 62 C495 62 502 83 519 83 C537 83 544 72 562 72" fill="none" stroke="#d8d1c4" stroke-width="2"/>
      <rect x="360" y="38" width="72" height="78" rx="8" fill="#d6b56d" opacity=".08" stroke="#d6b56d" stroke-opacity=".45"/>
      <line x1="396" y1="32" x2="396" y2="126" stroke="#d6b56d" stroke-width="2"/>
      <circle cx="396" cy="32" r="4" fill="#d6b56d"/>
      <text x="396" y="143" text-anchor="middle" fill="#d6b56d" font-family="ui-monospace" font-size="9.5">00:18.4</text>
    </g>

    <path d="M1047 204h42" stroke="#d6b56d" stroke-opacity=".45"/><path d="M1082 199l8 5-8 5" fill="none" stroke="#d6b56d"/>

    <!-- settle -->
    <g transform="translate(1104 128)">
      <rect width="208" height="150" rx="14" fill="#23211d" stroke="#f0eadf" stroke-opacity=".08"/>
      <text x="16" y="25" fill="#777168" font-family="ui-monospace" font-size="10">SETTLE</text>
      <text x="16" y="55" fill="#f0eadf" font-family="system-ui" font-size="12.5">1. Seek</text>
      <text x="16" y="78" fill="#f0eadf" font-family="system-ui" font-size="12.5">2. Reveal target view</text>
      <text x="16" y="101" fill="#f0eadf" font-family="system-ui" font-size="12.5">3. Brief range emphasis</text>
      <text x="16" y="124" fill="#f0eadf" font-family="system-ui" font-size="12.5">4. Fade to normal</text>
      <text x="16" y="143" fill="#8d867b" font-family="system-ui" font-size="10">No persistent glow/border.</text>
    </g>
  </g>

  <!-- expression matrix -->
  <g transform="translate(52 885)">
    <text x="0" y="0" fill="#d6b56d" font-family="ui-monospace" font-size="11" letter-spacing="1.8">EXPRESSION MODEL · SEPARATE AMBIENT FROM STATE-LINKED</text>
    <text x="0" y="29" fill="#a49d91" font-family="system-ui" font-size="12.5">Hero: ambient 7–8 / state 2 · Import: 1 / 5 · Processing: 1 / 5 · Workspace idle: 1 / 1 · Workspace interaction: 1 / 4 · Breakdown jump: 0 / 4 · Playback: 0 / 3</text>
    <text x="0" y="54" fill="#777168" font-family="system-ui" font-size="11.5">Quiet until something meaningful happens; then respond clearly.</text>
  </g>
</svg>
