<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 620">
  <defs>
    <radialGradient id="halo" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(451 286) rotate(90) scale(258 306)">
      <stop stop-color="#dcc69a" stop-opacity=".075"/>
      <stop offset=".58" stop-color="#dcc69a" stop-opacity=".018"/>
      <stop offset="1" stop-color="#dcc69a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="alignment" x1="442" y1="80" x2="442" y2="486" gradientUnits="userSpaceOnUse">
      <stop stop-color="#eadfc9" stop-opacity=".16"/>
      <stop offset=".18" stop-color="#ddc69a" stop-opacity=".64"/>
      <stop offset=".82" stop-color="#ddc69a" stop-opacity=".64"/>
      <stop offset="1" stop-color="#eadfc9" stop-opacity=".12"/>
    </linearGradient>
    <linearGradient id="hairline" x1="70" y1="0" x2="692" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f3eee4" stop-opacity="0"/>
      <stop offset=".18" stop-color="#f3eee4" stop-opacity=".09"/>
      <stop offset=".82" stop-color="#f3eee4" stop-opacity=".09"/>
      <stop offset="1" stop-color="#f3eee4" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <ellipse cx="451" cy="286" rx="306" ry="258" fill="url(#halo)"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text x="72" y="54" fill="#9a9388" font-size="10" letter-spacing="1.9">ONE SOURCE · SHARED MUSICAL TIME</text>
    <text x="688" y="54" text-anchor="end" fill="#6f6960" font-size="9.5" letter-spacing=".55">related views</text>
  </g>
  <path d="M72 72H688" stroke="url(#hairline)"/>

  <!-- Open structural planes only: no fabricated waveform, notes, score content, evidence, or playback state. -->
  <g>
    <rect x="106" y="108" width="550" height="72" rx="10" fill="#f3eee4" fill-opacity=".012" stroke="#f3eee4" stroke-opacity=".075"/>
    <rect x="82" y="201" width="598" height="72" rx="10" fill="#f3eee4" fill-opacity=".012" stroke="#f3eee4" stroke-opacity=".075"/>
    <rect x="118" y="294" width="530" height="72" rx="10" fill="#f3eee4" fill-opacity=".014" stroke="#f3eee4" stroke-opacity=".085"/>
    <rect x="94" y="387" width="574" height="72" rx="10" fill="#f3eee4" fill-opacity=".012" stroke="#f3eee4" stroke-opacity=".075"/>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" letter-spacing="1.45">
    <text x="124" y="132" fill="#8c857b">01 · AUDIO</text>
    <text x="100" y="225" fill="#8c857b">02 · NOTES</text>
    <text x="136" y="318" fill="#9c9489">03 · NOTATION</text>
    <text x="112" y="411" fill="#8c857b">04 · EVIDENCE</text>
  </g>

  <!-- Each plane shows only its coordinate grammar, never invented musical events. -->
  <g stroke="#b5ada1" stroke-opacity=".2">
    <path d="M224 148H628"/>
    <path d="M201 226H652M201 238H652M201 250H652"/>
    <path d="M236 326H620M236 333H620M236 340H620M236 347H620M236 354H620"/>
    <path d="M212 427H640"/>
  </g>

  <g stroke="#f3eee4" stroke-opacity=".055">
    <path d="M286 108V180M358 108V180M526 108V180M598 108V180"/>
    <path d="M262 201V273M346 201V273M538 201V273M622 201V273"/>
    <path d="M278 294V366M350 294V366M518 294V366M590 294V366"/>
    <path d="M254 387V459M338 387V459M530 387V459M614 387V459"/>
  </g>

  <!-- One neutral/warm alignment axis connects every representation. -->
  <line x1="442" y1="86" x2="442" y2="481" stroke="url(#alignment)" stroke-width="1.5"/>
  <g fill="#1a1916" stroke="#dcc69a" stroke-opacity=".78" stroke-width="1.25">
    <circle cx="442" cy="148" r="4.2"/>
    <circle cx="442" cy="237" r="4.2"/>
    <circle cx="442" cy="340" r="4.2"/>
    <circle cx="442" cy="427" r="4.2"/>
  </g>
  <circle cx="442" cy="148" r="1.4" fill="#e6d6b6" fill-opacity=".9"/>
  <circle cx="442" cy="237" r="1.4" fill="#e6d6b6" fill-opacity=".9"/>
  <circle cx="442" cy="340" r="1.4" fill="#e6d6b6" fill-opacity=".9"/>
  <circle cx="442" cy="427" r="1.4" fill="#e6d6b6" fill-opacity=".9"/>

  <text x="716" y="304" transform="rotate(90 716 304)" text-anchor="middle" fill="#c5bcae" fill-opacity=".16" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" letter-spacing="5.4">SAME MOMENT</text>

  <path d="M72 506H688" stroke="url(#hairline)"/>

  <g font-family="Georgia, Iowan Old Style, serif" font-size="21" fill="#ddd5c8">
    <text x="72" y="548">Listen</text>
    <text x="223" y="548">See</text>
    <text x="342" y="548">Explain</text>
  </g>
  <g fill="#8d857a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" letter-spacing="1.35">
    <text x="177" y="548">/</text>
    <text x="298" y="548">/</text>
    <text x="72" y="578">ONE RECORDING STAYS IN PLACE AS THE VIEW CHANGES</text>
  </g>
</svg>