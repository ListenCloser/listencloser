  <style>
    .ridge{fill:none;stroke:url(#r);stroke-width:1.25;vector-effect:non-scaling-stroke;animation:breathe 16s ease-in-out infinite alternate}
    .ridge:nth-of-type(3n){animation-duration:20s}.ridge:nth-of-type(4n){animation-duration:24s}
    .accent{fill:none;stroke:url(#a);stroke-width:1.9;stroke-linecap:round;stroke-dasharray:8 17;animation:travel 28s linear infinite}
    .dot{fill:#d6b56d;opacity:.65;animation:pulse 8s ease-in-out infinite}
    @keyframes breathe{from{transform:translateY(-1.5px);opacity:.72}to{transform:translateY(2px);opacity:1}}
    @keyframes travel{to{stroke-dashoffset:-300}}
    @keyframes pulse{0%,100%{opacity:.3}50%{opacity:.84}}
    @media(prefers-reduced-motion:reduce){.ridge,.accent,.dot{animation:none}}
  </style>
</defs>
