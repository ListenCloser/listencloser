<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" aria-hidden="true">
  <defs>
    <linearGradient id="ridge" x1="0" x2="1">
      <stop offset="0" stop-color="#d8d1c4" stop-opacity="0"/>
      <stop offset=".28" stop-color="#d8d1c4" stop-opacity=".26"/>
      <stop offset=".72" stop-color="#eee7da" stop-opacity=".58"/>
      <stop offset="1" stop-color="#d6b56d" stop-opacity=".18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#d6b56d" stop-opacity="0"/>
      <stop offset=".5" stop-color="#d6b56d" stop-opacity=".42"/>
      <stop offset=".78" stop-color="#ead19a" stop-opacity=".88"/>
      <stop offset="1" stop-color="#d6b56d" stop-opacity=".08"/>
    </linearGradient>
    <style>
      .landscape{animation:breathe 20s ease-in-out infinite alternate;transform-origin:50% 50%}
      .r{fill:none;stroke:url(#ridge);stroke-width:1.35;vector-effect:non-scaling-stroke}
      .a{fill:none;stroke:url(#accent);stroke-width:2;stroke-linecap:round;stroke-dasharray:760;stroke-dashoffset:760;animation:reveal 1.8s .35s cubic-bezier(.22,1,.36,1) forwards}
      @keyframes breathe{from{transform:translateY(-1.5px);opacity:.9}to{transform:translateY(1.5px);opacity:1}}
      @keyframes reveal{to{stroke-dashoffset:0}}
      @media(prefers-reduced-motion:reduce){.landscape,.a{animation:none}.a{stroke-dashoffset:0}}
    </style>
  </defs>
