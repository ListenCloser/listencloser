# Pre-commit hooks for listencloser.
# Install once: uv tool install pre-commit && pre-commit install
# Backend hooks intentionally run through the repository's locked uv environment
# so local and CI tool versions cannot drift.
repos:
  - repo: local
    hooks:
      - id: backend-ruff
        name: backend ruff
        entry: uv run --project backend ruff check --fix --config backend/pyproject.toml
        language: system
        types: [python]
        files: ^backend/
      - id: backend-ruff-format
        name: backend ruff format
        entry: uv run --project backend ruff format --config backend/pyproject.toml
        language: system
        types: [python]
        files: ^backend/
      - id: backend-tests
        name: backend security + contract tests
        entry: uv run --project backend python -m pytest backend/tests/test_security.py backend/tests/test_contract.py -q
        language: system
        pass_filenames: false
        files: ^backend/

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=2000']
