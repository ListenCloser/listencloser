<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Breakdown V3 mockup</title>
<style>
:root {
  color-scheme: dark;
  --canvas:#11110f; --shell:#171714; --raised:#1d1d19; --hover:#25241f; --strong:#2b2a24;
  --text:#f1efe8; --secondary:#b6b2a7; --muted:#817d73; --accent:#d6b56d;
  --border:rgba(241,239,232,.12); --border-soft:rgba(241,239,232,.07); --warn:#d0a65f; --danger:#c9786f;
  --r:7px;
}
*{box-sizing:border-box} body{margin:0;background:#0c0c0b;color:var(--text);font:13px/1.4 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button{font:inherit;color:inherit} button:focus-visible{outline:2px solid rgba(214,181,109,.7);outline-offset:2px}
.demo-toolbar{min-height:52px;display:flex;gap:8px;align-items:center;padding:8px 12px;background:#0d0d0c;border-bottom:1px solid var(--border)}
.demo-toolbar strong{margin-right:8px}.state-btn{min-height:36px;padding:0 11px;background:transparent;border:1px solid var(--border);border-radius:5px;color:var(--secondary);cursor:pointer}.state-btn:hover,.state-btn.active{background:var(--hover);color:var(--text);border-color:rgba(214,181,109,.35)}
.shell{height:calc(100vh - 53px);min-height:620px;display:grid;grid-template-columns:226px minmax(420px,1fr) 336px;grid-template-rows:48px minmax(0,1fr) 60px;background:var(--canvas)}
.topbar{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;padding:0 14px;background:var(--shell);border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:12px}.mark{width:22px;height:22px;border:1px solid rgba(214,181,109,.5);border-radius:50%;display:grid;place-items:center;color:var(--accent)}.piece{font-weight:600}.crumb{color:var(--muted)}.service{font-size:12px;color:var(--muted)}
.library{grid-column:1;grid-row:2;border-right:1px solid var(--border);background:var(--shell);padding:10px 8px;overflow:hidden}.panel-title{height:34px;display:flex;align-items:center;justify-content:space-between;padding:0 5px 8px;color:var(--secondary);font-weight:600}.import{border:0;background:transparent;color:var(--accent);cursor:pointer}.track{width:100%;min-height:44px;border:0;border-radius:5px;background:transparent;text-align:left;padding:7px 8px;margin:2px 0;cursor:pointer}.track.active{background:var(--hover)}.track-name{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.track-meta{display:block;color:var(--muted);font-size:11px;margin-top:2px}
.canvas{grid-column:2;grid-row:2;min-width:0;display:grid;grid-template-rows:39px minmax(0,1fr);background:var(--canvas)}
.tabs{display:flex;align-items:end;gap:18px;padding:0 16px;border-bottom:1px solid var(--border);background:var(--shell)}.tab{height:39px;border:0;background:none;color:var(--muted);position:relative;cursor:pointer}.tab.active{color:var(--text)}.tab.active:after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--accent)}
.visual{position:relative;overflow:hidden;padding:18px}.visual-head{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-bottom:12px}.wave{height:calc(100% - 28px);min-height:320px;border-top:1px solid var(--border-soft);border-bottom:1px solid var(--border-soft);position:relative;background:repeating-linear-gradient(90deg,transparent 0,transparent 64px,rgba(241,239,232,.035) 65px)}
.centerline{position:absolute;left:0;right:0;top:50%;border-top:1px solid rgba(241,239,232,.06)}
.bars{position:absolute;inset:10% 0;display:flex;align-items:center;gap:2px;padding:0 4px}.bar{flex:1;min-width:1px;background:rgba(182,178,167,.58);border-radius:1px;height:var(--h)}
.selection{position:absolute;top:0;bottom:0;left:43%;width:18%;background:rgba(214,181,109,.09);border-left:1px solid rgba(214,181,109,.6);border-right:1px solid rgba(214,181,109,.6)}.selection.hidden{display:none}.playhead{position:absolute;top:0;bottom:0;left:51%;width:1px;background:var(--accent);box-shadow:0 0 0 1px rgba(214,181,109,.08)}.section-label{position:absolute;top:8px;left:44%;font-size:11px;color:var(--secondary);background:rgba(17,17,15,.78);padding:2px 5px;border-radius:3px}
.inspector{grid-column:3;grid-row:2;background:var(--shell);border-left:1px solid var(--border);display:grid;grid-template-rows:auto minmax(0,1fr);min-width:0}.inspector-head{padding:0 12px;border-bottom:1px solid var(--border)}.mode-tabs{height:40px;display:flex;align-items:end;gap:16px}.mode{height:40px;border:0;background:none;color:var(--muted);position:relative}.mode.active{color:var(--text)}.mode.active:after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--accent)}.scope{min-height:37px;display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--border-soft);color:var(--secondary);font-size:12px}.scope.hidden{display:none}.scope button{width:32px;height:32px;background:transparent;border:0;color:var(--muted)}
.breakdown{overflow:auto;padding:13px 12px 26px}.eyebrow{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:4px 0 8px}.intro{font-size:12px;color:var(--secondary);margin:0 0 12px}.finding{padding:12px 0 13px;border-top:1px solid var(--border-soft)}.finding:first-of-type{border-top:0;padding-top:3px}.time{font:11px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--accent);margin-bottom:4px}.headline{font-size:14px;line-height:1.35;font-weight:600;margin:0}.explanation{color:var(--secondary);margin:5px 0 0}.evidence-line{display:flex;gap:6px;flex-wrap:wrap;color:var(--muted);font-size:11px;margin-top:8px}.evidence-line span+span:before{content:"·";margin-right:6px;color:#5e5b54}.actions{display:flex;gap:5px;flex-wrap:wrap;margin-top:10px}.action{min-height:32px;padding:0 8px;border-radius:5px;border:1px solid var(--border);background:transparent;color:var(--secondary);cursor:pointer}.action:hover{background:var(--hover);color:var(--text)}.action.primary{border-color:rgba(214,181,109,.32);color:var(--accent)}
.trust{font-size:11px;margin-top:8px;color:var(--warn)}.trust.interpretation{padding-left:8px;border-left:2px solid rgba(208,166,95,.65)}.support{margin-top:9px;padding:8px 9px;background:var(--raised);border-radius:5px;color:var(--secondary);font-size:11px}.support-row{display:flex;justify-content:space-between;gap:12px;padding:3px 0}.support-row span:last-child{color:var(--muted);text-align:right}.questions{border-top:1px solid var(--border);padding-top:12px;margin-top:8px}.question{width:100%;min-height:36px;text-align:left;padding:5px 2px;border:0;background:transparent;color:var(--secondary);cursor:pointer}.question:hover{color:var(--text)}
.empty{padding:18px 4px}.empty strong{display:block;font-size:14px;margin-bottom:5px}.empty p{color:var(--secondary);margin:0 0 14px}.available{border-top:1px solid var(--border-soft);padding-top:10px}.available div{padding:6px 0;color:var(--secondary)}
.transport{grid-column:1/-1;grid-row:3;background:var(--shell);border-top:1px solid var(--border);display:grid;grid-template-columns:210px 145px minmax(200px,1fr) 105px 130px;align-items:center;gap:10px;padding:0 12px}.source{color:var(--secondary)}.source b{color:var(--text);font-weight:500}.play-controls{display:flex;align-items:center;gap:7px}.transport-btn{width:38px;height:38px;border:1px solid var(--border);border-radius:50%;background:transparent;cursor:pointer}.transport-btn.play{border-color:rgba(214,181,109,.4);color:var(--accent)}.scrub{height:4px;background:var(--strong);position:relative;border-radius:4px}.scrub:after{content:"";position:absolute;left:0;top:0;bottom:0;width:51%;background:rgba(214,181,109,.55);border-radius:4px}.scrub-selection{position:absolute;left:43%;width:18%;top:-4px;height:12px;border-left:1px solid var(--accent);border-right:1px solid var(--accent);background:rgba(214,181,109,.1)}.scrub-selection.hidden{display:none}.clock{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--secondary);text-align:right}.compare{justify-self:end;min-height:34px;padding:0 10px;border:1px solid var(--border);background:transparent;border-radius:5px;color:var(--secondary)}
.prototype-note{position:absolute;right:18px;bottom:18px;color:var(--muted);font-size:10px;background:rgba(17,17,15,.82);padding:4px 6px;border-radius:4px}
@media(max-width:1050px){.shell{grid-template-columns:0 minmax(410px,1fr) 310px}.library{visibility:hidden}.transport{grid-template-columns:165px 130px minmax(160px,1fr) 90px 105px}}
@media(max-width:760px){.demo-toolbar{overflow:auto}.shell{height:calc(100vh - 53px);grid-template-columns:1fr;grid-template-rows:48px minmax(0,1fr) 60px}.topbar{grid-column:1;grid-row:1}.library{display:none}.canvas{grid-column:1;grid-row:2}.inspector{position:fixed;left:8px;right:8px;bottom:66px;max-height:57vh;z-index:5;border:1px solid var(--border);border-radius:10px;box-shadow:0 18px 45px rgba(0,0,0,.4)}.transport{grid-column:1;grid-row:3;grid-template-columns:105px 90px 1fr 76px;padding:0 8px}.compare{display:none}.source{font-size:11px}.play-controls .transport-btn:first-child{display:none}.wave{min-height:250px}.visual{padding:12px}}
</style>
</head>
<body>
<div class="demo-toolbar" aria-label="Prototype state picker">
  <strong>Breakdown V3</strong>
  <button class="state-btn active" data-state="pitched">Solo / pitched</button>
  <button class="state-btn" data-state="produced">Dense produced</button>
  <button class="state-btn" data-state="rhythm">Rhythm-first</button>
  <button class="state-btn" data-state="ambiguous">Low-confidence</button>
  <button class="state-btn" data-state="selection">Selected passage</button>
</div>
<div class="shell">
  <header class="topbar"><div class="brand"><div class="mark">♪</div><span class="piece" id="pieceName">Nocturne study</span><span class="crumb">/ workspace</span></div><span class="service">ready</span></header>
  <aside class="library"><div class="panel-title"><span>Library</span><button class="import">Import audio</button></div><button class="track active"><span class="track-name" id="trackA">Nocturne study</span><span class="track-meta">Analyzed</span></button><button class="track"><span class="track-name">Groove sketch 04</span><span class="track-meta">Ready</span></button><button class="track"><span class="track-name">Live room take</span><span class="track-meta">Imported</span></button></aside>
  <main class="canvas">
    <nav class="tabs" aria-label="Representations"><button class="tab active">Waveform</button><button class="tab">Piano roll</button><button class="tab">Score</button><button class="tab">Spectrogram</button></nav>
    <section class="visual"><div class="visual-head"><span id="viewLabel">Waveform · focused passage</span><span id="structureLabel">Section B</span></div><div class="wave"><div class="centerline"></div><div class="bars" id="bars"></div><div class="selection" id="selection"></div><div class="playhead"></div><span class="section-label" id="canvasLabel">phrase peak</span></div><span class="prototype-note">prototype evidence state</span></section>
  </main>
  <aside class="inspector">
    <div class="inspector-head"><div class="mode-tabs"><button class="mode active">Breakdown</button><button class="mode">Ask</button></div><div class="scope" id="scope"><span id="scopeText">Selected · 0:42–0:56</span><button aria-label="Clear selection">×</button></div></div>
    <div class="breakdown" id="breakdown"></div>
  </aside>
  <footer class="transport"><div class="source">Listening to <b>Original</b></div><div class="play-controls"><button class="transport-btn" aria-label="Previous">‹</button><button class="transport-btn play" aria-label="Play">▶</button><button class="transport-btn" aria-label="Loop">↻</button></div><div class="scrub"><span class="scrub-selection" id="scrubSelection"></span></div><div class="clock">0:48 / 2:16</div><button class="compare">Compare A/B</button></footer>
</div>
<script>
const states={
 pitched:{piece:"Nocturne study",scope:"Selected · 0:42–0:56",canvas:"phrase peak",structure:"Phrase 3",view:"Waveform · selection aligned to score",selection:true,html:`
  <div class="eyebrow">What stands out here</div>
  <article class="finding"><div class="time">0:42–0:56</div><h2 class="headline">The melody reaches its highest register while the accompaniment thins out.</h2><p class="explanation">The contrast makes the upper line feel more exposed without requiring a louder overall level.</p><div class="evidence-line"><span>register peak</span><span>lower note density below</span><span>score-aligned</span></div><div class="actions"><button class="action primary">Loop</button><button class="action">Show score</button><button class="action">Piano roll</button><button class="action">Ask why</button></div></article>
  <article class="finding"><div class="time">0:48</div><h3 class="headline">The harmony changes more slowly underneath the melodic peak.</h3><div class="evidence-line"><span>chord boundaries</span><span>beat-aligned</span></div><div class="actions"><button class="action">Show</button><button class="action">Ask</button></div></article>
  <div class="questions"><div class="eyebrow">Explore</div><button class="question">How does this phrase differ from the previous one?</button><button class="question">What is happening harmonically here?</button></div>`},
 produced:{piece:"Produced demo",scope:"Section · 0:58–1:14",canvas:"layer entrance",structure:"Section C",view:"Waveform · structure + layer evidence",selection:true,html:`
  <div class="eyebrow">What changed</div>
  <article class="finding"><div class="time">0:58–1:14</div><h2 class="headline">This section gets larger because drums enter, bass activity rises, and the upper spectrum fills out.</h2><p class="explanation">Several independently measured changes arrive together, so the useful explanation is relational rather than a single “energy” score.</p><div class="evidence-line"><span>drums enter</span><span>bass +28%</span><span>high-band energy ↑</span></div><div class="actions"><button class="action primary">Loop</button><button class="action">Show waveform</button><button class="action">Isolate drums</button><button class="action">Compare previous</button><button class="action">Ask</button></div><div class="support"><div class="support-row"><span>Drum stem activity</span><span>starts 0:59</span></div><div class="support-row"><span>Bass activity</span><span>higher vs previous span</span></div><div class="support-row"><span>Upper spectrum</span><span>higher across span</span></div></div></article>
  <article class="finding"><div class="time">1:10</div><h3 class="headline">The vocal remains present, so the contrast comes mainly from the accompaniment layers.</h3><div class="actions"><button class="action">Compare</button><button class="action">Ask</button></div></article>
  <div class="questions"><div class="eyebrow">Explore</div><button class="question">Which layer contributes most to the change?</button><button class="question">Where does a similar texture return?</button></div>`},
 rhythm:{piece:"Groove sketch 04",scope:"Section · 0:31–0:47",canvas:"groove repeats",structure:"Loop 2",view:"Waveform · beat/downbeat overlay",selection:true,html:`
  <div class="eyebrow">What stands out here</div>
  <article class="finding"><div class="time">0:31–0:47</div><h2 class="headline">The groove stays nearly unchanged while the surrounding layers drop back.</h2><p class="explanation">The beat/onset pattern remains similar across the transition even though the texture becomes sparser.</p><div class="evidence-line"><span>beat pattern stable</span><span>onset relation</span><span>layer activity ↓</span></div><div class="actions"><button class="action primary">Loop</button><button class="action">Show beat grid</button><button class="action">Compare</button><button class="action">Ask</button></div></article>
  <article class="finding"><div class="time">0:39</div><h3 class="headline">Most attacks continue to land close to the detected pulse.</h3><div class="evidence-line"><span>pulse evidence</span><span>timing distribution</span></div><div class="actions"><button class="action">Show</button></div></article>
  <div class="questions"><div class="eyebrow">Explore</div><button class="question">What is driving the groove?</button><button class="question">Does this pattern occur again?</button></div>`},
 ambiguous:{piece:"Live room take",scope:"",canvas:"stable pulse only",structure:"Unlabeled",view:"Waveform · available evidence only",selection:false,html:`
  <div class="empty"><strong>No strong Breakdown yet</strong><p>There is not enough stable evidence for a broader musical summary. The interface withholds unsupported categories instead of filling them with weak guesses.</p><div class="eyebrow">Available</div><div class="available"><div>A steady pulse is detected near 102 BPM.</div><div>Two passages have similar overall texture, but that match is experimental.</div></div><div class="actions"><button class="action">Show pulse</button><button class="action">Ask about available evidence</button></div></div>
  <div class="questions"><div class="eyebrow">Try asking</div><button class="question">What can you tell reliably from this recording?</button></div>`},
 selection:{piece:"Produced demo",scope:"Selected · 0:42–0:56",canvas:"active selection",structure:"Selection",view:"Waveform · user-selected passage",selection:true,html:`
  <div class="eyebrow">What changed here</div>
  <article class="finding"><div class="time">0:42–0:56</div><h2 class="headline">The texture opens up immediately after the selection begins.</h2><p class="explanation">The drums and bass become more active while the vocal line stays in roughly the same range.</p><div class="evidence-line"><span>drum activity ↑</span><span>bass activity ↑</span><span>vocal register stable</span></div><div class="actions"><button class="action primary">Loop selection</button><button class="action">Show evidence</button><button class="action">Compare 0:18–0:31</button><button class="action">Ask why</button></div></article>
  <article class="finding"><div class="time">Related · 0:18–0:31</div><h3 class="headline">A similar harmonic loop appears earlier, but with fewer accompaniment layers.</h3><div class="evidence-line"><span>harmonic relation</span><span>texture difference</span></div><div class="actions"><button class="action">Compare A/B</button><button class="action">Jump there</button></div></article>
  <article class="finding"><div class="trust interpretation"><strong>Interpretation</strong><br>This may read as a lift because several measured changes coincide. The interpretation is shown separately from the detected evidence.</div></article>
  <div class="questions"><div class="eyebrow">Follow up</div><button class="question">Why might this contrast matter musically?</button><button class="question">Where else does this happen?</button></div>`}
};
const bars=document.getElementById('bars'); for(let i=0;i<150;i++){const b=document.createElement('span');b.className='bar';const v=20+Math.abs(Math.sin(i*.37))*62+Math.abs(Math.sin(i*.11))*16;b.style.setProperty('--h',Math.min(94,v)+'%');bars.appendChild(b)}
function render(key){const s=states[key];document.getElementById('pieceName').textContent=s.piece;document.getElementById('trackA').textContent=s.piece;document.getElementById('scopeText').textContent=s.scope;document.getElementById('scope').classList.toggle('hidden',!s.selection);document.getElementById('selection').classList.toggle('hidden',!s.selection);document.getElementById('scrubSelection').classList.toggle('hidden',!s.selection);document.getElementById('canvasLabel').textContent=s.canvas;document.getElementById('structureLabel').textContent=s.structure;document.getElementById('viewLabel').textContent=s.view;document.getElementById('breakdown').innerHTML=s.html;document.querySelectorAll('.state-btn').forEach(b=>b.classList.toggle('active',b.dataset.state===key))}
document.querySelectorAll('.state-btn').forEach(b=>b.addEventListener('click',()=>render(b.dataset.state)));render('pitched');
</script>
</body>
</html>
