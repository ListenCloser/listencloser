services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: music-ai-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      SOUNDFONT_PATH: /usr/share/sounds/sf2/FluidR3_GM.sf2
      SENTRY_DSN_BACKEND: ${SENTRY_DSN_BACKEND:-}
      SENTRY_ENV: ${SENTRY_ENV:-production}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      RELEASE: ${RELEASE:-development}
      HARMONY_ENGINE: lv_chordia
      WORKER_HEALTH_FILE: /app/runtime/worker-heartbeat.json
    volumes:
      - worker-runtime:/app/runtime:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: music-ai-worker
    restart: unless-stopped
    command: ["python", "worker.py"]
    environment:
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      SOUNDFONT_PATH: /usr/share/sounds/sf2/FluidR3_GM.sf2
      SENTRY_DSN_BACKEND: ${SENTRY_DSN_BACKEND:-}
      SENTRY_ENV: ${SENTRY_ENV:-production}
      RELEASE: ${RELEASE:-development}
      HARMONY_ENGINE: lv_chordia
      WORKER_HEALTH_FILE: /app/runtime/worker-heartbeat.json
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-1}
      ALLIN1_ENABLED: ${ALLIN1_ENABLED:-false}
      ALLIN1_MODEL: ${ALLIN1_MODEL:-harmonix-all}
      ALLIN1_DEVICE: ${ALLIN1_DEVICE:-cpu}
    volumes:
      - worker-runtime:/app/runtime
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -s /app/runtime/worker-heartbeat.json && find /app/runtime/worker-heartbeat.json -mmin -1 | grep -q ."]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

volumes:
  worker-runtime:
