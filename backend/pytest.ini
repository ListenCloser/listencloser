[pytest]
testpaths = tests
pythonpath = .
asyncio_mode = strict
markers =
    integration: real-model inference tests (Basic Pitch / Transkun / piano-transcription) run against real ML models; excluded from the default unit suite. Run with: pytest backend/tests/ -m integration
    real_stack: tests requiring a live Supabase/Postgres database or real external services (RLS policies, pipeline smoke, real LLM provider); excluded from the default unit suite. Run with: pytest backend/tests/ -m real_stack
    benchmark: evaluation benchmark runs kept out of required unit semantics. Run with: pytest backend/tests/ -m benchmark
addopts = -m "not integration and not real_stack and not benchmark"
